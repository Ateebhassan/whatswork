<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Design Board</title>
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* The designer's board: every college post coming up, with a place to drop the finished design. */
:root{
  --bg:#f4f5f9; --panel:#fff; --sunk:#eceef4; --ink:#151a25; --muted:#687186; --faint:#a5acbb; --line:#e0e4ec;
  --brand:#3157e8; --brand-soft:#e4eaff; --on-brand:#fff; --ok:#169a62; --ok-soft:#e3f6ec; --warn:#ffb21e; --warn-ink:#8a5a00; --bad:#e5483b; --bad-soft:#fdecea;
  --sup:#0b8a84; --law:#8c1d2f;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1119; --panel:#151b26; --sunk:#1b2231; --ink:#e8ecf4; --muted:#929bb0; --faint:#5c6579; --line:#262f41;
  --brand:#7491ff; --brand-soft:#1e2847; --on-brand:#0d1119; --ok:#3fcf8e; --ok-soft:#14301f; --warn-ink:#ffcf6b; --bad:#ff6b5e; --bad-soft:#3a1d1d;
  --sup:#2cb5ae; --law:#d0546b; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:980px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-weight:600;font-size:14px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.stat b{font-family:var(--display);font-size:20px;color:var(--ink);margin-right:5px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.day{margin-top:20px}
.dh{display:flex;align-items:baseline;gap:10px;margin:0 2px 8px}
.dh h2{margin:0;font-family:var(--display);font-size:20px;font-weight:800}
.dh span{font-size:13px;font-weight:700;color:var(--muted)}
.dh .soon{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid}
.band{height:6px}
.inner{padding:12px 14px 14px;display:grid;gap:10px}
.t{font-weight:800;font-size:16px;line-height:1.3}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.major{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn-ink)}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.todo{background:var(--bad-soft);color:var(--bad)}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.f{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px}
.f img,.f video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.f .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px;z-index:2}
.up{display:flex;gap:8px;align-items:center}
.up label{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);font-weight:800;border-radius:12px;padding:11px;cursor:pointer}
.up input[type=file]{display:none}
.note{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:10px;padding:8px 10px;font-size:13.5px}
.prog{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);width:0}
.empty{color:var(--muted);padding:30px 4px;text-align:center}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:30px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header><div><div class="sub" id="who">Design board</div><h1>Posts to design</h1></div><div class="sub" id="upd"></div></header>
  <div class="stats" id="stats"></div>
  <div class="filters" id="filters"></div>
  <main id="list"><div class="empty">Loading…</div></main>
</div>
<script>
const SUPABASE_URL = "https://boajcspgqhuhchnvbkxl.supabase.co";
const SUPABASE_KEY = "sb_publishable_QbVXMyGif27UZnxhjApFUw_ul7EuoC5";
const FN = SUPABASE_URL + "/functions/v1/whatswork-worker";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = new URLSearchParams(location.hash.slice(1)).get("k") || "";
let data = null, show = "todo", college = "all";
const COL = { superior: "var(--sup)", law: "var(--law)", both: "linear-gradient(90deg,var(--sup) 50%,var(--law) 50%)" };

async function call(body){
  const r = await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:"Bearer "+SUPABASE_KEY }, body: JSON.stringify({ key, ...body }) });
  const j = await r.json().catch(()=>({error:"No answer from the server"}));
  if (j.error) throw new Error(j.error);
  return j;
}
function dayWords(d, today){
  const a = Date.UTC(...today.split("-").map((x,i)=>i===1?x-1:+x)), b = Date.UTC(...d.split("-").map((x,i)=>i===1?x-1:+x)), n = Math.round((b-a)/864e5);
  return n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":n<0?`${-n} days ago`:`in ${n} days`;
}
const fmt = d => new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const done = p => p.files.length>0 || p.status.made || p.status.scheduled;

function render(){
  const posts = data.posts.filter(p => p.date >= data.today || !done(p));
  const vis = posts.filter(p => (show==="all" || (show==="todo" ? !done(p) : done(p))) && (college==="all" || p.college===college || p.college==="both"));
  const todo = posts.filter(p=>!done(p)), week = todo.filter(p=>dayWords(p.date,data.today).match(/Today|Tomorrow|in [2-6] days/));
  $("who").textContent = "Design board" + (data.designer ? " · " + data.designer : "");
  $("upd").textContent = "Updated " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  $("stats").innerHTML = `<div class="stat"><b>${week.length}</b>to do this week</div><div class="stat"><b>${todo.length}</b>to do in all</div><div class="stat"><b>${posts.filter(done).length}</b>uploaded</div>`;
  $("filters").innerHTML = [["todo","To do"],["done","Uploaded"],["all","All"]].map(([k,l])=>`<button class="chip ${show===k?"on":""}" data-s="${k}">${l}</button>`).join("")
    + `<span style="width:8px"></span>` + [["all","Both colleges"],["superior","Superior"],["law","Law college"]].map(([k,l])=>`<button class="chip ${college===k?"on":""}" data-c="${k}">${l}</button>`).join("");
  $("filters").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ show=b.dataset.s; render(); });
  $("filters").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ college=b.dataset.c; render(); });
  const byDay = {}; vis.forEach(p => (byDay[p.date] ||= []).push(p));
  const days = Object.keys(byDay).sort();
  $("list").innerHTML = days.length ? days.map(d => `<section class="day"><div class="dh"><h2>${esc(fmt(d))}</h2><span class="${d<=data.today?"soon":""}">${dayWords(d,data.today)}</span></div>
    <div class="grid">${byDay[d].map(cardHtml).join("")}</div></section>`).join("") : `<div class="empty">${show==="todo"?"Nothing left to design. Nice work.":"Nothing here."}</div>`;
  $("list").querySelectorAll("input[type=file]").forEach(inp => inp.onchange = () => upload(inp));
  $("list").querySelectorAll("[data-del]").forEach(b => b.onclick = async () => { if(!confirm("Remove this file?")) return; try { const p=data.posts.find(x=>x.key===b.dataset.k); await call({action:"designer_delete", id:b.dataset.del, item_key:p.key, date:p.date}); await load(); } catch(e){ alert(e.message); } });
}
function cardHtml(p){
  const st = p.status.scheduled ? `<span class="tag done">Scheduled</span>` : p.files.length ? `<span class="tag done">Uploaded</span>` : p.status.made ? `<span class="tag done">Made</span>` : `<span class="tag todo">To do</span>`;
  return `<article class="card"><div class="band" style="background:${COL[p.college]||"var(--faint)"}"></div><div class="inner">
    <div class="t">${esc(p.title)}</div>
    <div class="tags">${st}<span class="tag">${esc(p.college==="both"?"Both colleges":p.collegeName)}</span>${p.size==="major"?`<span class="tag major">Major: video + posts</span>`:""}${p.birthday?`<span class="tag">Birthday</span>`:""}${p.weekly?`<span class="tag">Weekly</span>`:""}</div>
    ${p.files.length?`<div class="files">${p.files.map(f=>fileHtml(f,p)).join("")}</div>`:""}
    <input class="note" placeholder="Note for Ateeb (optional)" id="n-${esc(p.key)}" maxlength="300">
    <div class="up"><label>⬆ ${p.files.length?"Add more":"Upload design"}<input type="file" multiple accept="image/*,video/*,application/pdf,.psd,.ai,.zip" data-k="${esc(p.key)}"></label></div>
    <div class="prog" id="p-${esc(p.key)}" hidden><i></i></div>
  </div></article>`;
}
function fileHtml(f,p){
  const media = f.url && /^image\//.test(f.mime||"") ? `<img src="${esc(f.url)}" alt="" loading="lazy">` : f.url && /^video\//.test(f.mime||"") ? `<video src="${esc(f.url)}#t=0.5" muted playsinline preload="metadata"></video>` : "";
  return `<a class="f" href="${esc(f.url||"#")}" target="_blank" rel="noopener" title="${esc(f.name)}">${media||esc(f.name.split(".").pop().toUpperCase())}${f.by==="designer"?`<button class="x" data-del="${esc(f.id)}" data-k="${esc(p.key)}" onclick="event.preventDefault()">✕</button>`:""}</a>`;
}
async function upload(inp){
  const p = data.posts.find(x => x.key === inp.dataset.k); if (!p) return;
  const note = document.getElementById("n-"+p.key).value.trim();
  const bar = document.getElementById("p-"+p.key); bar.hidden = false;
  const files = [...inp.files];
  try {
    for (let i=0;i<files.length;i++){
      const f = files[i];
      if (f.size > 50*1024*1024) { alert(f.name+" is over 50 MB. Export a smaller file."); continue; }
      const { path, uploadUrl } = await call({ action:"designer_upload", item_key:p.key, date:p.date, name:f.name, size:f.size });
      await new Promise((ok, bad) => { const x = new XMLHttpRequest(); x.open("PUT", uploadUrl); x.setRequestHeader("x-upsert","false"); x.setRequestHeader("apikey", SUPABASE_KEY);
        x.upload.onprogress = e => { bar.firstChild.style.width = ((i + e.loaded/e.total)/files.length*100).toFixed(1)+"%"; };
        x.onload = () => x.status < 300 ? ok() : bad(new Error("Upload failed ("+x.status+")")); x.onerror = () => bad(new Error("Upload failed. Check the internet."));
        const fd = new FormData(); fd.append("cacheControl","3600"); fd.append("", f); x.send(fd); });
      await call({ action:"designer_saved", item_key:p.key, date:p.date, title:p.title, path, name:f.name, mime:f.type, size:f.size, note: i===0 ? note : "" });
    }
    await load();
  } catch(e) { alert(e.message); bar.hidden = true; }
}
async function load(){
  if (!key) { $("list").innerHTML = `<div class="msg"><b>This link is missing its key.</b><br><span class="sub">Ask Ateeb to send the designer link again.</span></div>`; return; }
  try { data = await call({ action:"designer_list", days:45 }); render(); }
  catch(e) { $("list").innerHTML = `<div class="msg"><b>${esc(e.message)}</b></div>`; }
}
load(); setInterval(()=>{ if(document.visibilityState==="visible" && !document.querySelector(".prog:not([hidden])")) load(); }, 120000);
</script>
</body>
</html>
