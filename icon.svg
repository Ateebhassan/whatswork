<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2550"/><stop offset="1" stop-color="#0d1330"/></linearGradient></defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <!-- a 24-hour dial: each arc is part of the day -->
  <g fill="none" stroke-width="58" transform="rotate(-90 256 256)">
    <circle cx="256" cy="256" r="150" stroke="#94a3b8" stroke-dasharray="210 1000" stroke-dashoffset="0"/>
    <circle cx="256" cy="256" r="150" stroke="#0d9488" stroke-dasharray="120 1000" stroke-dashoffset="-222"/>
    <circle cx="256" cy="256" r="150" stroke="#ea580c" stroke-dasharray="70 1000" stroke-dashoffset="-354"/>
    <circle cx="256" cy="256" r="150" stroke="#7c5cff" stroke-dasharray="90 1000" stroke-dashoffset="-436"/>
    <circle cx="256" cy="256" r="150" stroke="#4f7cff" stroke-dasharray="404 1000" stroke-dashoffset="-538"/>
  </g>
  <line x1="256" y1="256" x2="256" y2="160" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="318" y2="296" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="20" fill="#ffb21e"/>
</svg>
