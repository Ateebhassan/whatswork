<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1119" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WhatsWork">
<title>WhatsWork</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="planner-core.js"></script>
<script src="ww-core.js"></script>
<style>
/* Layout: phone-first planner. Slim header, content in the middle, everything you press lives at the bottom. */
:root{
  --bg:#f4f5f9; --panel:#ffffff; --sunk:#eceef4; --ink:#151a25; --muted:#687186; --faint:#a5acbb; --line:#e0e4ec;
  --brand:#3157e8; --brand-soft:#e4eaff; --on-brand:#ffffff;
  --warn:#ffb21e; --warn-ink:#8a5a00; --bad:#e5483b; --bad-soft:#fdecea; --ok:#169a62; --ok-soft:#e3f6ec;
  --grid:#eef0f5; --shadow:0 1px 2px rgba(21,26,37,.06),0 6px 18px rgba(21,26,37,.06);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navh:58px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1119; --panel:#151b26; --sunk:#1b2231; --ink:#e8ecf4; --muted:#929bb0; --faint:#5c6579; --line:#262f41;
  --brand:#7491ff; --brand-soft:#1e2847; --on-brand:#0d1119;
  --warn:#ffb21e; --warn-ink:#ffcf6b; --bad:#ff6b5e; --bad-soft:#3a1d1d; --ok:#3fcf8e; --ok-soft:#14301f;
  --grid:#1a2130; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:11px 13px;outline:none}
.field:focus{border-color:var(--brand);background:var(--panel)}
select.field{appearance:none;-webkit-appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:var(--on-brand);font-weight:700;border-radius:12px;padding:11px 16px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* auth */
#auth{height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));overflow:auto}
.auth-card{width:100%;max-width:380px;display:grid;gap:14px}
.wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark .dot{width:14px;height:14px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 30%,transparent)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px}
.auth-tabs button{padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* shell */
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
.head{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.head h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.head .eyebrow{font-size:12px;font-weight:700;color:var(--muted)}
#nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);flex:none}
#nav button{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
#nav button.on{color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-top:12px}
.card h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.empty{color:var(--muted);font-size:13.5px}

/* 24-hour split bar */
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.split i.free{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--grid) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:700}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.sw.free{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px);border:1px solid var(--faint)}

/* rows: posts and events */
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t span{font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag .sw{width:8px;height:8px;border-radius:50%}
.st{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.st.half{background:color-mix(in srgb,var(--warn) 22%,transparent);border-color:transparent;color:var(--warn-ink)}
.erow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.erow:first-of-type{border-top:0}
.erow .tm{width:74px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted)}
.erow .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.erow .t{flex:1;min-width:0}.erow .t b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow.now{background:var(--brand-soft);border-radius:10px;padding-left:6px;padding-right:6px}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600;text-align:left;width:100%}
.alert.sleep{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink)}

/* calendar bar */
.calbar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;flex:none}
.seg button{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.calbar .title{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--sunk)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;background:var(--panel)}
.chip .sw{border-radius:50%}
.chip.off{opacity:.45;background:transparent}
.chip.off .sw{background:transparent!important;border:1.5px solid var(--faint)}
#calBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#fab{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:16px;width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 70%,transparent);z-index:5}

/* day view */
#calTop{flex:none;display:grid;gap:6px;padding:0 max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
#calTop:empty{display:none}
.allday{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.allday::-webkit-scrollbar{display:none}
.legend.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.legend.one::-webkit-scrollbar{display:none}
#calTop .alert{padding:6px 10px;font-size:12.5px}
#calTop .alert svg{width:18px;height:18px}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:85%;padding:5px 9px;border-radius:9px;font-size:12.5px;font-weight:700;border-left:4px solid;background:var(--panel);box-shadow:var(--shadow);text-align:left;min-width:0}
.pchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.pchip .dot.half{background:var(--warn)} .pchip .dot.on{background:var(--ok)}
.tl{position:relative;margin:14px max(10px,env(safe-area-inset-right)) 90px max(4px,env(safe-area-inset-left))}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--grid);font-size:10.5px;color:var(--faint);font-weight:700}
.tl .hr span{position:absolute;top:-8px;left:0;width:40px;text-align:right;padding-right:6px;background:var(--bg)}
.tl .cols{position:absolute;top:0;bottom:0;left:44px;right:0}
.blk{position:absolute;border-radius:9px;padding:4px 7px;overflow:hidden;font-size:12px;line-height:1.25;color:#fff;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.blk b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{opacity:.9;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sleep{color:var(--ink);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)) 0 6px,color-mix(in srgb,var(--c) 14%,var(--panel)) 6px 12px)!important;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:none}
.blk.clash{outline:2.5px solid var(--bad);outline-offset:1px}
.gap{position:absolute;left:4px;right:4px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--faint);border:1.5px dashed var(--line);border-radius:9px;pointer-events:none}
.nowline{position:absolute;left:38px;right:0;height:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* week view */
.wk{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));padding:0 max(6px,env(safe-area-inset-right)) 0 max(2px,env(safe-area-inset-left))}
.wk .dh{position:sticky;top:0;z-index:4;background:var(--bg);text-align:center;padding:4px 1px 6px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.wk .dh b{display:block;font-size:15px;color:var(--ink);font-family:var(--display)}
.wk .dh.today b{color:var(--on-brand);background:var(--brand);border-radius:8px;margin:0 auto;width:28px}
.wk .dh .mk{display:flex;gap:3px;justify-content:center;align-items:center;min-height:14px;margin-top:2px}
.pc{font-size:10px;font-weight:800;padding:0 5px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.pc.todo{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn-ink)}
.rd{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:4px;font-size:9.5px;color:var(--faint);font-weight:700;transform:translateY(-6px)}
.wk .col{position:relative;border-left:1px solid var(--grid);background:repeating-linear-gradient(to bottom,transparent 0 71px,var(--grid) 71px 72px)}
.wk .col .blk{padding:2px 3px;font-size:10px;border-radius:5px}
.wk .col .blk b{font-size:10px}
.wk .col .nowline{left:0}
.wk .col .nowline::before{display:none}

/* month view */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.mo .dn{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 4px}
.mc{min-height:70px;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;min-width:0}
.mc.out{opacity:.4}
.mc .d{font-weight:800;font-size:13px;font-family:var(--display)}
.mc.today .d{color:var(--on-brand);background:var(--brand);border-radius:7px;width:22px;text-align:center}
.mc .bars{display:flex;flex-direction:column;gap:2px}
.mc .bars i{display:block;height:4px;border-radius:2px}
.mc .rd{position:absolute;top:6px;right:6px}
.mc .pc{align-self:flex-start;margin-top:auto;max-width:100%;overflow:hidden;white-space:nowrap}
@media (max-width:460px){.mc .pc .w{display:none}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .2s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{margin:0;font-family:var(--display);font-size:21px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.fl{display:grid;gap:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted);padding:0 6px}
#qEx button{height:auto;padding:6px 10px;text-align:left;font-weight:700}
.days button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.palette button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.palette button.on{border-color:var(--ink)}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:11px;padding:3px}
.seg3 button{padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg3 button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* review charts: one bar per night or week */
.schart{position:relative;display:flex;align-items:flex-end;gap:2px;height:calc(var(--h) + 36px);padding-top:16px}
.sbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.sbar .b{width:min(70%,28px);border-radius:4px 4px 0 0;background:#6c7bd0}
.sbar .b.short{background:repeating-linear-gradient(135deg,#6c7bd0 0 4px,color-mix(in srgb,#6c7bd0 55%,var(--panel)) 4px 8px)}
.sbar .b.screen{background:#0891b2}
.sbar .v{font-size:11px;font-weight:700;color:var(--muted);min-height:14px}
.sbar .d{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:16px;height:16px}
.schart .guide{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.schart .guide span{position:absolute;left:-2px;top:-8px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel);padding-right:3px}
.schart{padding-left:22px}
.sbar{position:relative;z-index:1}
.sbar .v{background:var(--panel);padding:0 2px;border-radius:4px}
code.field{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px 11px;user-select:all;-webkit-user-select:all}

/* settings */
.calrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.calrow:first-of-type{border-top:0}
.calrow .sw{width:14px;height:14px;border-radius:50%}
.calrow .t{flex:1;min-width:0}.calrow .t b{display:block;font-weight:700}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.providers button{padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:left;display:grid;gap:1px}
.providers button small{font-weight:500;color:var(--muted);font-size:11.5px}
.providers button.on{border-color:var(--brand);background:var(--brand-soft)}
.err{font-size:12.5px;color:var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:10px;margin:0}
.status{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok::before{background:var(--ok)}.status.bad::before{background:var(--bad)}

/* planner overlay */
#plannerView{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.pv-bar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
.pv-bar b{flex:1;font-family:var(--display);font-size:16px;text-align:center}
.pv-back{display:flex;align-items:center;gap:2px;font-weight:700;color:var(--brand);padding:6px 8px;border-radius:10px}
.pv-open{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;padding:6px 8px}
#pvFrame{flex:1;width:100%;border:0;background:var(--bg)}

#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#setup{padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:grid;gap:14px}

/* ===== v2 layout: clearer sections, bigger labels ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 0}
.sec h2{margin:0;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec .more{font-size:13px;font-weight:700;color:var(--brand)}
.card{border-radius:18px}
.head h1{font-size:28px}
/* bottom bar with a big add button in the middle */
#nav{position:relative;overflow:visible}
#nav .add{position:relative;display:grid;place-items:center}
#nav .add span{width:56px;height:56px;margin-top:-22px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--brand) 75%,transparent),0 0 0 5px var(--bg)}
#nav .add svg{width:26px;height:26px}
/* now / next hero */
.hero{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 92%,#000) 0%,var(--brand) 60%,color-mix(in srgb,var(--brand) 70%,#7c5cff) 100%);color:#fff;border:0;border-radius:22px;padding:16px;display:grid;gap:12px;margin-top:6px}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(150deg,#1f2c5c,#2b3f8f)}}
.hero .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.hero .meta{font-size:13.5px;opacity:.9;font-weight:600}
.hero .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:3px}
.hero .nx{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 12px;text-align:left;color:#fff;width:100%}
.hero .nx .when{font-weight:800;font-size:13px;white-space:nowrap;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:8px}
.hero .nx b{display:block;font-size:15px}
.hero .nx small{opacity:.85;font-weight:600}
.hero .dotc{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.warn .v{color:var(--warn-ink)} .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--ok)}
/* donut */
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px;display:block}
.donut .ctr{font-family:var(--display);font-weight:800}
.dleg{display:grid;gap:7px;min-width:0;width:100%}
.dleg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.dleg span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dleg b{font-variant-numeric:tabular-nums;font-weight:800}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg i.free{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px);border:1px solid var(--faint)}
/* agenda list (Today "Coming up", Week view, month day) */
.ag-day{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ag-day:first-child{border-top:0;padding-top:2px}
.ag-dh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;width:100%;text-align:left}
.ag-dh .dt{font-family:var(--display);font-size:15px}
.ag-dh .badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.ag-dh .badge.today{background:var(--brand);color:var(--on-brand)}
.ag-it{display:grid;grid-template-columns:62px 4px 1fr auto;gap:10px;align-items:center;padding:6px 0;width:100%;text-align:left;min-width:0}
.ag-it .tm{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-it .bar{align-self:stretch;border-radius:2px;min-height:26px}
.ag-it .t{min-width:0}.ag-it .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-it .t span{font-size:12px;color:var(--muted)}
.ag-it .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.ag-it .pill.ok{background:var(--ok-soft);color:var(--ok)} .ag-it .pill.todo{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.ag-it.routine{opacity:.62}
.ag-it.now{background:var(--brand-soft);border-radius:12px;margin:0 -8px;padding:6px 8px;width:calc(100% + 16px)}
.ag-empty{font-size:13px;color:var(--muted);padding:4px 0}
/* 24h strip used in week rows */
.strip{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:4px 0 2px}
.strip i{position:absolute;top:0;bottom:0}
.strip i.sl{background:repeating-linear-gradient(135deg,color-mix(in srgb,#6c7bd0 45%,transparent) 0 3px,transparent 3px 6px)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-weight:700;margin-bottom:2px}
/* calendar header */
.calhead{padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:grid;gap:10px;flex:none}
.calnav{display:flex;align-items:center;gap:4px}
.calnav h1{flex:1;margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calnav .todayb{font-size:13px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:7px 12px;border-radius:10px;margin-right:4px}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.seg.wide button{padding:8px;font-size:14px}
/* week strip above the day timeline */
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 0 6px}
.dstrip button{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted)}
.dstrip button b{font-family:var(--display);font-size:17px;color:var(--ink)}
.dstrip button.on{background:var(--ink);color:var(--panel)} .dstrip button.on b{color:var(--panel)}
.dstrip button.td:not(.on) b{color:var(--brand)}
.dstrip .mk{height:5px;display:flex;gap:2px}.dstrip .mk i{width:5px;height:5px;border-radius:50%}
.tl .hr span{font-size:11.5px}
.blk{border-radius:10px;padding:5px 9px;font-size:12.5px}
.blk b{font-size:13.5px}
/* month cells with words */
.mo{gap:3px}
.mc{min-height:84px;border-radius:12px;padding:4px 3px;gap:2px}
.mc .d{font-size:13px;margin-left:2px}
.mc .ev{display:block;font-size:10px;font-weight:700;line-height:1.25;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;border-left:3px solid;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--ink)}
.mc .mo-more{font-size:10px;font-weight:800;color:var(--muted);padding-left:3px}
.mc.sel{outline:2.5px solid var(--ink);outline-offset:-1px}
.mo-below{padding:4px max(14px,env(safe-area-inset-right)) 100px max(14px,env(safe-area-inset-left))}
/* add sheet */
.mic{width:84px;height:84px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;justify-self:center;box-shadow:0 12px 26px -10px color-mix(in srgb,var(--brand) 80%,transparent)}
.mic svg{width:34px;height:34px}
.mic.rec{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 20%,transparent)}}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typegrid button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.typegrid button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.vlist{display:grid;gap:8px}
.vitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.vitem .t{flex:1;min-width:0}.vitem .t b{display:block}
.vitem input{width:20px;height:20px;accent-color:var(--brand)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- local clock ---------- */
function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
function nowMin(){ const n=new Date(); return W.dnum(todayStr())*DAY + n.getHours()*60 + n.getMinutes(); }
function dateObj(s){ const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
const fmtDay = (s,o) => dateObj(s).toLocaleDateString("en-GB", o);
function mondayOf(s){ const wd=W.weekday(W.dnum(s)); return W.addDays(s, -((wd+6)%7)); }
function relDay(s){ const t=todayStr(); if(s===t) return "Today"; if(s===W.addDays(t,1)) return "Tomorrow"; if(s===W.addDays(t,-1)) return "Yesterday"; return fmtDay(s,{weekday:"short",day:"numeric",month:"short"}); }

/* free stretches of an hour or more */
function gapsOf(vis, d){
  const d0=W.dnum(d)*DAY, busy=W.timed(vis).filter(o=>o.end>d0&&o.start<d0+DAY).map(o=>[Math.max(o.start,d0)-d0, Math.min(o.end,d0+DAY)-d0]).sort((a,b)=>a[0]-b[0]);
  const gaps=[]; let c=0; busy.forEach(r=>{ if(r[0]-c>=60) gaps.push([c,r[0]]); c=Math.max(c,r[1]); }); if(DAY-c>=60) gaps.push([c,DAY]); return gaps;
}

/* what's on one date, in time order */
function dayAgenda(d, list, opts={}){
  const vis=list.filter(o=>o.cal.visible!==false), d0=W.dnum(d)*DAY;
  const rows=[];
  vis.filter(o=>o.allDay && o.kind!=="post" && o.date===d).forEach(o=>rows.push({o,date:d,sort:-1}));
  W.timed(vis).filter(o=>o.kind!=="sleep" && o.end>d0 && o.start<d0+DAY).forEach(o=>{ const r=ROUTINE(o); if(opts.skipRoutine&&r) return; rows.push({o,date:d,sort:o.start,routine:r&&!opts.noFade}); });

/* ---------- donut: where the 24 hours go ---------- */
function donutGroups(groups){
  const named=groups.filter(g=>g.id!=="free"&&g.minutes>0).sort((a,b)=>b.minutes-a.minutes), free=groups.find(g=>g.id==="free");
  let list=named.slice(0,5);
  const rest=named.slice(5).reduce((a,g)=>a+g.minutes,0);
  if (rest) list.push({id:"other",label:"Other",color:"#94a3b8",minutes:rest});
  if (free && free.minutes) list.push(free);
  return list;
}
function donutHtml(groups, total, centre, sub){
  const R=60, C=2*Math.PI*R, gap=groups.length>1?2.5:0; let off=0;
  const arcs=groups.map(g=>{ const len=g.minutes/total*C, a=`<circle r="${R}" cx="75" cy="75" fill="none" stroke="${g.id==="free"?"var(--sunk)":g.color}" stroke-width="20" stroke-dasharray="${Math.max(0,len-gap).toFixed(2)} ${(C-Math.max(0,len-gap)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 75 75)"><title>${esc(g.label)}: ${W.fmtDur(g.minutes)}</title></circle>`; off+=len; return a; }).join("");
  const leg=groups.map(g=>`<div><i class="${g.id==="free"?"free":""}" style="${g.id==="free"?"":"background:"+g.color}"></i><span class="n">${esc(g.label)}</span><b>${W.fmtDur(g.minutes)}</b></div>`).join("");
  return `<div class="donut"><svg viewBox="0 0 150 150" role="img" aria-label="${esc(groups.map(g=>g.label+" "+W.fmtDur(g.minutes)).join(", "))}">${arcs}
    <text x="75" y="72" text-anchor="middle" class="ctr" font-size="21" fill="currentColor">${esc(centre)}</text><text x="75" y="92" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--muted)">${esc(sub)}</text></svg>
    <div class="dleg">${leg}</div></div>`;
}
let donutMode = store.get("donut","day");
function donutCardHtml(t){

    const groups=donutGroups(Object.values(acc)), total=7*DAY, free=acc.free?.minutes||0;

/* side-by-side lanes for blocks that overlap */
function layout(items){
  items.sort((a,b)=>a.s-b.s || (b.e-b.s)-(a.e-a.s));
  let cl=null, end=-1;
  items.forEach(it=>{
    if (!cl || it.s>=end) { cl={lanes:[]}; end=it.e; } else end=Math.max(end,it.e);
    let lane=cl.lanes.findIndex(x=>x<=it.s); if(lane<0){ lane=cl.lanes.length; cl.lanes.push(it.e); } else cl.lanes[lane]=it.e;
    it.lane=lane; it.cl=cl;
  });
  items.forEach(it=>it.cols=it.cl.lanes.length);
  return items;
}
function dayItems(vis, d){
  const d0=W.dnum(d)*DAY;
  const items=W.timed(vis).filter(o=>o.end>d0 && o.start<d0+DAY).map(o=>({o, s:Math.max(o.start,d0)-d0, e:Math.min(o.end,d0+DAY)-d0}));
  const lanes=layout(items.filter(x=>x.o.kind!=="sleep"));
  items.filter(x=>x.o.kind==="sleep").forEach(x=>{ x.lane=0; x.cols=1; });
  return { items, sleeps: items.filter(x=>x.o.kind==="sleep"), lanes };
}
function blockHtml(x, H, an){
  const o=x.o, top=x.s/60*H, h=Math.max((x.e-x.s)/60*H, 22), sleep=o.kind==="sleep";
  const left = sleep ? "0%" : (x.lane/x.cols*100).toFixed(2)+"%", width = sleep ? "100%" : `calc(${(100/x.cols).toFixed(2)}% - 3px)`;

async function plannerMutate(fn, msg){

  catch(e){ toast("Couldn't load the planner: "+(e.message||e)); return false; }

/* recording: iPhone home-screen apps can't use the browser's speech reader, so the audio goes to your AI key to be understood */
let rec=null;
async function toggleRecording(){
  const btn=$("qMic");
  if (rec) { rec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast("This phone can't record here. Use the keyboard 🎤 instead."); $("qText").focus(); return; }
  let stream; try { stream=await navigator.mediaDevices.getUserMedia({audio:true}); } catch { toast("Microphone wasn't allowed. Allow it in Settings for this app."); return; }
  const type=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported?.(t))||"";
  const chunks=[]; rec=new MediaRecorder(stream, type?{mimeType:type}:undefined);
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const timer=setTimeout(()=>rec&&rec.stop(), 45000);
  rec.onstop=async()=>{
    clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); const mime=(rec.mimeType||type||"audio/mp4").split(";")[0]; rec=null;
    if (!$("qMic")) return; btn.classList.remove("rec"); $("qMicHelp").textContent="Understanding…";
    const blob=new Blob(chunks,{type:mime});
    if (blob.size<1500) { $("qMicHelp").textContent="That was too short. Tap and try again."; return; }
    const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
    try {
      const {data,error}=await api.voiceAI(b64, mime, todayStr(), hm(nowMin()%DAY));
      if (error || data?.error) throw new Error(data?.error || error.message);
      const entries=(data.entries||[]).map(a=>fromAI(a, W.parseQuick(a.title||"", cals, todayStr(), nowMin()%DAY)));
      if (!entries.length) { $("qMicHelp").textContent=data.transcript?`I heard “${data.transcript}” but found nothing to add.`:"I didn't catch anything. Try again."; return; }
      if (entries.length===1) { closeSheet(); openEvent(null, entries[0].date, null, {...entries[0], heard:data.transcript}); return; }
      openVoiceList(entries, data.transcript);
    } catch(e) { $("qMicHelp").textContent="Couldn't understand it: "+(e.message||e); }
  };
  rec.start(); btn.classList.add("rec"); $("qMicHelp").textContent="Listening… tap again when you're done.";
}

/* trust the AI's answer only where it is well formed; fall back to the simple reader for the rest */
function fromAI(a, local){
  const ok = (v,re)=>typeof v==="string" && re.test(v);
  const cal = cals.find(c=>[c.name,c.short_name].filter(Boolean).some(n=>n.toLowerCase()===String(a.calendar||"").toLowerCase()));
  return {
    via:"ai", guessed:[],
    title: (typeof a.title==="string" && a.title.trim()) ? a.title.trim().slice(0,140) : local.title,
    calendar_id: cal ? cal.id : local.calendar_id,
    kind: W.KINDS[a.kind] ? a.kind : local.kind,
    date: ok(a.date,/^\d{4}-\d{2}-\d{2}$/) ? a.date : local.date,
    start_time: a.kind==="post" ? null : ok(a.start,/^\d{2}:\d{2}$/) ? a.start : local.start_time,
    end_time: a.kind==="post" ? null : ok(a.end,/^\d{2}:\d{2}$/) ? a.end : local.end_time,
    repeat: ["none","daily","weekly"].includes(a.repeat) ? a.repeat : local.repeat,
    repeat_days: Array.isArray(a.repeat_days) ? a.repeat_days.filter(x=>Number.isInteger(x)&&x>=0&&x<=6) : local.repeat_days,
  };
}

function openEvent(ev, date, startMin, prefill){
  if (!cals.length) return toast("Add a calendar first, in Settings");
  const isNew=!ev, repeating = !!(ev && ev.repeat && ev.repeat!=="none");
  const lastCal = store.get("lastCal", null);
  const defCal = calById(lastCal) ? lastCal : (cals.find(c=>c.kind!=="planner")||cals[0]).id;
  const startM = startMin ?? Math.min(23*60, (Math.floor((nowMin()%DAY)/30)+1)*30);
  const e = ev ? {...ev} : { calendar_id:defCal, title:"", kind:"meeting", date, start_time:hm(startM), end_time:hm((startM+60)%DAY), repeat:"none", repeat_days:[], repeat_until:null, notes:"" };
  if (prefill) { for (const k of Object.keys(prefill)) if (prefill[k]!=null && k!=="guessed" && k!=="via") e[k]=prefill[k]; if (!prefill.start_time && prefill.kind!=="post") { e.start_time=hm(startM); e.end_time=hm((startM+60)%DAY); } if (prefill.kind==="post") { e.start_time=null; e.end_time=null; } }
  const allDay = e.start_time==null;

function hhmmLocal(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* one bar per night, a dashed line at 6 hours */
function sleepChartHtml(){
  const t=todayStr(), days=[]; for(let i=7;i>=1;i--) days.push(W.addDays(t,-i+1));
  const byDate={}; health.forEach(h=>byDate[h.date]=h);
  const vals=days.map(d=>{ const h=byDate[d]; return h?W.sleepMinutes(h):null; });
  const max=Math.max(9*60,...vals.filter(v=>v!=null)), H=120;
  const bars=days.map((d,i)=>{ const v=vals[i], hgt=v!=null?Math.max(3,v/max*H):0, h=byDate[d];
    const tip = v!=null ? `${fmtDay(d,{weekday:"long"})}: ${W.fmtDur(v)}${h&&h.sleep_start&&h.sleep_end?` (${W.fmtTime(W.tmin(hhmmLocal(h.sleep_start)))} to ${W.fmtTime(W.tmin(hhmmLocal(h.sleep_end)))})`:""}` : `${fmtDay(d,{weekday:"long"})}: no data`;
    return `<button class="sbar" data-sleep="${d}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="v num">${v!=null?(v/60).toFixed(1):""}</span><span class="b ${v!=null&&v<360?"short":""}" style="height:${hgt}px"></span><span class="d">${fmtDay(d,{weekday:"short"}).slice(0,2)}</span></button>`; }).join("");
  const have=vals.filter(v=>v!=null), avg=have.length?Math.round(have.reduce((a,b)=>a+b,0)/have.length):null;
  return `<div class="schart" style="--h:${H}px"><div class="guide" style="bottom:${360/max*H+19}px"><span>6h</span></div>${bars}</div>
    <div class="small muted">${avg!=null?`Average ${W.fmtDur(avg)} over ${have.length} night${have.length>1?"s":""}. Tap a bar for the times.`:"No sleep recorded in the last 7 days yet."}</div>`;
}
function screenChartHtml(){
  const rows=screenWeeks.slice(0,6).reverse();
  if (!rows.length) return `<div class="empty">No screen time added yet. On iPhone: Settings, Screen Time, See All Activity, then Week shows your daily average.</div>`;
  const max=Math.max(...rows.map(r=>r.screen_avg_minutes||0),60), H=90;
  return `<div class="schart" style="--h:${H}px">${rows.map(r=>`<div class="sbar" title="${esc("Week of "+fmtDay(r.week_start,{day:"numeric",month:"short"})+": "+W.fmtDur(r.screen_avg_minutes)+" a day")}"><span class="v num">${(r.screen_avg_minutes/60).toFixed(1)}</span><span class="b screen" style="height:${Math.max(3,r.screen_avg_minutes/max*H)}px"></span><span class="d">${fmtDay(r.week_start,{day:"numeric",month:"short"})}</span></div>`).join("")}</div>
    <div class="small muted">Hours a day, average for each week.</div>`;
}

function openSleepEntry(date){
  const h=health.find(x=>x.date===date);
  const bed=h?.sleep_start?hhmmLocal(h.sleep_start):"06:00", wake=h?.sleep_end?hhmmLocal(h.sleep_end):"13:00";
  sheet(`<h2>Sleep</h2>
    <label class="fl"><span class="label">Woke up on</span><input id="sDate" class="field" type="date" value="${date}"></label>
    <div class="grid2"><label class="fl"><span class="label">Fell asleep</span><input id="sBed" class="field" type="time" value="${bed}"></label>
      <label class="fl"><span class="label">Woke up</span><input id="sWake" class="field" type="time" value="${wake}"></label></div>
    <div class="small muted" id="sHint"></div>
    <div class="actions"><button class="btn" id="sSave">Save</button>${h?`<button class="btn danger" id="sDel">Delete</button>`:""}</div>`);
  const calc=()=>{ const d=$("sDate").value, [bh,bm]=$("sBed").value.split(":").map(Number), [wh,wm]=$("sWake").value.split(":").map(Number);
    const end=new Date(...d.split("-").map((x,i)=>i===1?+x-1:+x), wh, wm), start=new Date(end); start.setHours(bh,bm,0,0); if (start>=end) start.setDate(start.getDate()-1);
    return {start,end,mins:Math.round((end-start)/60000)}; };
  const hint=()=>{ try{ const c=calc(); $("sHint").textContent=W.fmtDur(c.mins)+" of sleep"; }catch{} };
  ["sDate","sBed","sWake"].forEach(id=>$(id).oninput=hint); hint();
  $("sSave").onclick=async()=>{ const c=calc(); if(c.mins<=0||c.mins>20*60) return toast("Check the times");
    const r=await api.saveHealthDay({ user_id:me.id, date:$("sDate").value, sleep_start:c.start.toISOString(), sleep_end:c.end.toISOString(), asleep_minutes:null, source:"manual" });
    if (r.error) return toast(r.error.message); closeSheet(); toast("Saved"); await loadHealth(); render(); };
  if ($("sDel")) $("sDel").onclick=async()=>{ const r=await api.deleteHealthDay(date); if(r.error) return toast(r.error.message); closeSheet(); await loadHealth(); render(); };
}

    const key="ww_"+[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("");
    const {error}=await api.setHealthToken(await sha256hex(key)); if(error) return toast(error.message);
    $("kBox").innerHTML=`<div class="fl"><span class="label">Your key (shown once, copy it into the Shortcut now)</span><div class="line"><code class="field small" style="overflow-wrap:anywhere">${key}</code><button class="ib" data-copy="${key}" aria-label="Copy key">${icon("copy")}</button></div></div>`;
    wireCopy();
  };
}

/* ---------- SETTINGS ---------- */
let ai={enabled:false,provider:"gemini",model:"",has_key:false}, aiProvider="gemini";
async function renderSettings(){
  const pushOk = "serviceWorker" in navigator && "PushManager" in window;
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let subbed=false; try{ if(pushOk){ const reg=await navigator.serviceWorker.getRegistration(); subbed=!!(reg && await reg.pushManager.getSubscription()); } }catch{}
  try{ const {data}=await api.getAi(); ai=(data&&data[0])||ai; }catch{}
  aiProvider=ai.provider||"gemini";
  const billLabel={paid:"Paid",unpaid:"Unpaid",personal:"Personal"};
  $("settingsBody").innerHTML = `
  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("layers")} Calendars</span></h3>
    <div>${cals.map(c=>`<button class="calrow" data-cal="${c.id}"><i class="sw" style="background:${c.color}"></i><span class="t"><b>${esc(c.name)}</b><span class="small muted">${billLabel[c.billing]||""}${c.kind==="planner"?" · college posts":""}${c.follows_world_days?" · posts on world days":""}${c.visible===false?" · hidden":""}</span></span>${icon("right")}</button>`).join("")}</div>
    <button class="btn soft" id="sAddCal">${icon("plus")} Add a calendar</button></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("pin")} College planner</span></h3>
    <p class="small muted" style="margin:0">College posts, world days and birthdays show on your calendar. Tap any post there to tick it or edit it.</p>
    <button class="calrow" id="sBdays">${icon("gift")}<span class="t"><b>Faculty birthdays</b><span class="small muted">${(plannerState?.birthdays||[]).length} names</span></span>${icon("right")}</button>
    <button class="calrow" id="sNotes">${icon("q")}<span class="t"><b>To confirm</b><span class="small muted">${(plannerState?.notes||[]).length} waiting for a date</span></span>${icon("right")}</button>
    <button class="calrow" id="sSheets">${icon("layers")}<span class="t"><b>Designer sheets and backup</b><span class="small muted">Month and six-month PDF or Word sheets, designer files, backup</span></span>${icon("right")}</button></div>

  <div class="card"><div class="line"><h3><span style="display:flex;gap:8px;align-items:center">${icon("bell")} Notifications</span></h3><span class="status ${subbed&&perm==="granted"?"ok":perm==="denied"?"bad":""}">${subbed&&perm==="granted"?"On":perm==="denied"?"Blocked":"Off"}</span></div>
    <p class="small muted" style="margin:0">30 minutes before a shift and 15 minutes before classes and meetings. At 8 pm a check of tomorrow's posts and clashes, at 9 am the same for today. Sunday evening: your weekly review.</p>
    ${!pushOk ? (ios&&!standalone ? `<p class="err">On iPhone, add WhatsWork to your Home Screen first (Share, then Add to Home Screen), open it from there and come back here.</p>` : `<p class="err">This browser can't receive notifications.</p>`)
      : perm==="denied" ? `<p class="err">Notifications are blocked for this app. Allow them in your phone's settings, then come back.</p>`
      : `<div class="actions">${subbed?`<button class="btn soft sm" id="sTest">Send a test</button><button class="btn ghost sm" id="sPushOff">Turn off on this device</button>`:`<button class="btn" id="sPushOn">${icon("bell")} Turn on notifications</button>`}</div>`}</div>

  <div class="card"><div class="line"><h3><span style="display:flex;gap:8px;align-items:center">${icon("spark")} AI</span></h3><label class="switch"><input type="checkbox" id="sAi" ${ai.enabled?"checked":""}><span></span></label></div>
    <p class="small muted" style="margin:0">Used for adding by voice, quick add and weekly reviews. For voice, pick Gemini or ChatGPT. Without a key, use the 🎤 on your keyboard.</p>
    <div class="providers" id="sProv">${Object.entries(AI_PROVIDERS).map(([k,v])=>`<button data-k="${k}" class="${k===aiProvider?"on":""}">${v.name}<small>${v.note}</small></button>`).join("")}</div>
    <label class="fl"><span class="label">Model</span><input id="sModel" class="field" value="${esc(ai.model||AI_PROVIDERS[aiProvider].model)}"></label>
    <label class="fl"><span class="label">API key</span><input id="sKey" class="field" type="password" autocomplete="off" placeholder="${ai.has_key?"Saved ("+esc(ai.key_hint||"")+"). Paste a new one to replace":"Paste your API key"}"></label>
    <div class="small muted" id="sKeyHelp">Get a key at <a href="${AI_PROVIDERS[aiProvider].keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${AI_PROVIDERS[aiProvider].keyUrl.replace("https://","")}</a>. It's stored on the server and never shown again.</div>
    <div class="actions"><button class="btn sm" id="sAiSave">Save AI settings</button>${ai.has_key?`<button class="btn ghost sm" id="sKeyDel">Remove key</button>`:""}</div></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("user")} You</span></h3>
    <input id="sName" class="field" value="${esc(myName)}" maxlength="60">
    <div class="small muted">${esc(me.email||"")}</div>
    <div class="actions"><button class="btn soft sm" id="sNameSave">Save name</button><button class="btn ghost sm" id="sOut">Sign out</button></div></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("phone")} Install on your phone</span></h3>
    <p class="small muted" style="margin:0"><b>iPhone (Safari):</b> Share, then Add to Home Screen, then open it from the Home Screen.<br><b>Android (Chrome):</b> menu, then Install app.</p></div>`;
  $("settingsBody").querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>openCalendar(calById(b.dataset.cal)));
  $("sAddCal").onclick=()=>openCalendar(null);
  $("sBdays").onclick=openBirthdays; $("sNotes").onclick=openNotes; $("sSheets").onclick=openPlanner;
  $("sNameSave").onclick=async()=>{ const n=$("sName").value.trim(); if(!n) return; const r=await api.setName(n); if(r.error) return toast(r.error.message); myName=n; toast("Name saved"); };
  $("sOut").onclick=async()=>{ await api.signOut(); location.reload(); };
  const on=$("sPushOn"); if(on) on.onclick=enablePush;
  const off=$("sPushOff"); if(off) off.onclick=disablePush;
  const tst=$("sTest"); if(tst) tst.onclick=async()=>{ tst.disabled=true; const {data,error}=await api.testPush(); tst.disabled=false; if(error) return toast("Test failed: "+error.message); toast(data?.sent?"Test sent. Check your notifications.":"No device found. Turn notifications off and on again."); };
  $("sProv").querySelectorAll("button").forEach(b=>b.onclick=()=>{ aiProvider=b.dataset.k; $("sProv").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    const p=AI_PROVIDERS[aiProvider]; $("sModel").value = aiProvider===ai.provider&&ai.model ? ai.model : p.model;
    $("sKeyHelp").innerHTML=`Get a key at <a href="${p.keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${p.keyUrl.replace("https://","")}</a>. It's stored on the server and never shown again.`; });
  $("sAiSave").onclick=()=>saveAi();
  const kd=$("sKeyDel"); if(kd) kd.onclick=()=>saveAi("__clear__");
}
async function saveAi(forceKey){
  const key = forceKey ?? $("sKey").value.trim(), model=$("sModel").value.trim();
  const enabled = forceKey==="__clear__" ? false : $("sAi").checked;
  if (enabled && !model) return toast("Add a model name first");
  if (enabled && !key && !(ai.has_key && aiProvider===ai.provider)) return toast("Paste an API key first");
  const {error}=await api.saveAi({p_enabled:enabled,p_provider:aiProvider,p_model:model,p_key:key,p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
  if (error) return toast(error.message);
  aiOn = enabled && (!!key || ai.has_key) && forceKey!=="__clear__";
  toast(forceKey==="__clear__"?"Key removed":enabled?"AI is on":"Saved. AI is off."); renderSettings();
}
function b64ToBytes(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); const p=s+"=".repeat((4-s.length%4)%4); return Uint8Array.from(atob(p),c=>c.charCodeAt(0)); }
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast("Notifications weren't allowed"); return renderSettings(); }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
    const {error}=await api.savePush(sub.toJSON()); if(error) throw error;
    toast("Notifications are on for this device");
  }catch(e){ toast("Couldn't turn on notifications: "+(e.message||e)); }
  renderSettings();
}
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub){ await api.deletePush(sub.endpoint); await sub.unsubscribe(); } toast("Notifications off on this device"); }
  catch(e){ toast(e.message||String(e)); }
  renderSettings();
}

/* ---------- one database step left ---------- */
function showSetup(){
  ["sToday","sCal","sSettings","sReview"].forEach(id=>$(id).classList.add("hidden")); $("nav").classList.add("hidden"); $("sSetup").classList.remove("hidden");
  $("setup").innerHTML=`<div class="wordmark"><span class="dot"></span>Almost ready</div>
    <p style="margin:0">WhatsWork's new calendar needs one database step: open Supabase, then SQL Editor, then New query. Paste the setup file, press Run, then come back here.</p>
    <button class="btn" onclick="location.reload()">Done, reload</button>
    <button class="btn soft" onclick="openPlanner()">Open the College Planner meanwhile</button>`;
}

/* ---------- planner overlay ---------- */
function openPlanner(){
  const f=$("pvFrame"); if(!f.src) f.src="planner.html";
  $("plannerView").classList.remove("hidden"); history.pushState({planner:1},"");
}
function closePlanner(){ $("plannerView").classList.add("hidden"); if (started) reload(); }
$("pvBack").onclick=()=>{ if(history.state?.planner) history.back(); else closePlanner(); };
window.addEventListener("popstate",()=>{ if(!$("plannerView").classList.contains("hidden")) closePlanner(); });

/* ---------- start ---------- */
function handleLink(url){
  const u=new URL(url, location.href);
  if (u.searchParams.get("planner")) { openPlanner(); return; }
  if (u.searchParams.get("review")) { showTab("review"); return; }
  const d=u.searchParams.get("d"); if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) openDay(d);
}
(async function boot(){
  await api.init();
  api.onAuth(async user=>{
    if (!user) { me=null; started=false; $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); return; }
    if (me && me.id===user.id) return;
    me=user; $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
    let d; try { d=await api.loadAll(); } catch(e){ d={error:e}; }
    if (d.error) { if (d.missing) return showSetup(); toast("Couldn't load: "+(d.error.message||d.error)); me=null; return; }
    await loadHealth();
    applyData(d); started=true; api.subscribe(reloadSoon);
    api.getAi().then(r=>{ const a=r?.data?.[0]; if(a) ai={...ai,...a}; aiOn=!!(a && a.enabled && a.has_key); }).catch(()=>{});
    showTab(tab);
    if (location.search) { handleLink(location.href); history.replaceState(null,"",location.pathname); }
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("message",ev=>{ if(ev.data?.url) handleLink(ev.data.url); });
  }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && me && started) reloadSoon(); });
  setInterval(()=>{ if(me && started && tab!=="settings" && !$("sheetRoot").innerHTML) render(); }, 60000);
})();
</script>
