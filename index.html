<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1119" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WhatsWork">
<title>WhatsWork</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="planner-core.js"></script>
<script src="ww-core.js"></script>
<style>
/* Layout: phone-first planner. Slim header, content in the middle, everything you press lives at the bottom. */
:root{
  --bg:#f4f5f9; --panel:#ffffff; --sunk:#eceef4; --ink:#151a25; --muted:#687186; --faint:#a5acbb; --line:#e0e4ec;
  --brand:#3157e8; --brand-soft:#e4eaff; --on-brand:#ffffff;
  --warn:#ffb21e; --warn-ink:#8a5a00; --bad:#e5483b; --bad-soft:#fdecea; --ok:#169a62; --ok-soft:#e3f6ec;
  --grid:#eef0f5; --shadow:0 1px 2px rgba(21,26,37,.06),0 6px 18px rgba(21,26,37,.06);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navh:58px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1119; --panel:#151b26; --sunk:#1b2231; --ink:#e8ecf4; --muted:#929bb0; --faint:#5c6579; --line:#262f41;
  --brand:#7491ff; --brand-soft:#1e2847; --on-brand:#0d1119;
  --warn:#ffb21e; --warn-ink:#ffcf6b; --bad:#ff6b5e; --bad-soft:#3a1d1d; --ok:#3fcf8e; --ok-soft:#14301f;
  --grid:#1a2130; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:11px 13px;outline:none}
.field:focus{border-color:var(--brand);background:var(--panel)}
select.field{appearance:none;-webkit-appearance:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:var(--on-brand);font-weight:700;border-radius:12px;padding:11px 16px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)} .small{font-size:12.5px}
.label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* auth */
#auth{height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));overflow:auto}
.auth-card{width:100%;max-width:380px;display:grid;gap:14px}
.wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark .dot{width:14px;height:14px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px color-mix(in srgb,var(--warn) 30%,transparent)}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px}
.auth-tabs button{padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* shell */
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 max(14px,env(safe-area-inset-right)) 24px max(14px,env(safe-area-inset-left))}
.head{padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.head h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.head .eyebrow{font-size:12px;font-weight:700;color:var(--muted)}
#nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom);flex:none}
#nav button{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:700;color:var(--muted)}
#nav button.on{color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;margin-top:12px}
.card h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.empty{color:var(--muted);font-size:13.5px}

/* 24-hour split bar */
.split{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--sunk)}
.split i{display:block;height:100%}
.split i.free{background:repeating-linear-gradient(135deg,var(--sunk) 0 4px,var(--grid) 4px 8px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-weight:700}
.sw{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.sw.free{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px);border:1px solid var(--faint)}

/* rows: posts and events */
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t span{font-size:12px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag .sw{width:8px;height:8px;border-radius:50%}
.st{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.st.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.st.half{background:color-mix(in srgb,var(--warn) 22%,transparent);border-color:transparent;color:var(--warn-ink)}
.erow{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.erow:first-of-type{border-top:0}
.erow .tm{width:74px;flex:none;font-size:12.5px;font-weight:700;color:var(--muted)}
.erow .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.erow .t{flex:1;min-width:0}.erow .t b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.erow.now{background:var(--brand-soft);border-radius:10px;padding-left:6px;padding-right:6px}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-size:13px;font-weight:600;text-align:left;width:100%}
.alert.sleep{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-ink)}

/* calendar bar */
.calbar{display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left))}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;flex:none}
.seg button{padding:5px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.calbar .title{flex:1;min-width:0;text-align:center;font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--sunk)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:700;background:var(--panel)}
.chip .sw{border-radius:50%}
.chip.off{opacity:.45;background:transparent}
.chip.off .sw{background:transparent!important;border:1.5px solid var(--faint)}
#calBody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
#fab{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:16px;width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--brand) 70%,transparent);z-index:5}

/* day view */
#calTop{flex:none;display:grid;gap:6px;padding:0 max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
#calTop:empty{display:none}
.allday{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.allday::-webkit-scrollbar{display:none}
.legend.one{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.legend.one::-webkit-scrollbar{display:none}
#calTop .alert{padding:6px 10px;font-size:12.5px}
#calTop .alert svg{width:18px;height:18px}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;max-width:85%;padding:5px 9px;border-radius:9px;font-size:12.5px;font-weight:700;border-left:4px solid;background:var(--panel);box-shadow:var(--shadow);text-align:left;min-width:0}
.pchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchip .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
.pchip .dot.half{background:var(--warn)} .pchip .dot.on{background:var(--ok)}
.tl{position:relative;margin:14px max(10px,env(safe-area-inset-right)) 90px max(4px,env(safe-area-inset-left))}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--grid);font-size:10.5px;color:var(--faint);font-weight:700}
.tl .hr span{position:absolute;top:-8px;left:0;width:40px;text-align:right;padding-right:6px;background:var(--bg)}
.tl .cols{position:absolute;top:0;bottom:0;left:44px;right:0}
.blk{position:absolute;border-radius:9px;padding:4px 7px;overflow:hidden;font-size:12px;line-height:1.25;color:#fff;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.blk b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk small{opacity:.9;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.sleep{color:var(--ink);background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--panel)) 0 6px,color-mix(in srgb,var(--c) 14%,var(--panel)) 6px 12px)!important;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:none}
.blk.clash{outline:2.5px solid var(--bad);outline-offset:1px}
.gap{position:absolute;left:4px;right:4px;display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--faint);border:1.5px dashed var(--line);border-radius:9px;pointer-events:none}
.nowline{position:absolute;left:38px;right:0;height:0;border-top:2px solid var(--bad);z-index:3;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* week view */
.wk{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr));padding:0 max(6px,env(safe-area-inset-right)) 0 max(2px,env(safe-area-inset-left))}
.wk .dh{position:sticky;top:0;z-index:4;background:var(--bg);text-align:center;padding:4px 1px 6px;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.wk .dh b{display:block;font-size:15px;color:var(--ink);font-family:var(--display)}
.wk .dh.today b{color:var(--on-brand);background:var(--brand);border-radius:8px;margin:0 auto;width:28px}
.wk .dh .mk{display:flex;gap:3px;justify-content:center;align-items:center;min-height:14px;margin-top:2px}
.pc{font-size:10px;font-weight:800;padding:0 5px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.pc.todo{background:color-mix(in srgb,var(--warn) 25%,transparent);color:var(--warn-ink)}
.rd{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:4px;font-size:9.5px;color:var(--faint);font-weight:700;transform:translateY(-6px)}
.wk .col{position:relative;border-left:1px solid var(--grid);background:repeating-linear-gradient(to bottom,transparent 0 71px,var(--grid) 71px 72px)}
.wk .col .blk{padding:2px 3px;font-size:10px;border-radius:5px}
.wk .col .blk b{font-size:10px}
.wk .col .nowline{left:0}
.wk .col .nowline::before{display:none}

/* month view */
.mo{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:4px max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.mo .dn{text-align:center;font-size:11px;font-weight:800;color:var(--muted);padding:2px 0 4px}
.mc{min-height:70px;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:4px;display:flex;flex-direction:column;gap:3px;text-align:left;position:relative;min-width:0}
.mc.out{opacity:.4}
.mc .d{font-weight:800;font-size:13px;font-family:var(--display)}
.mc.today .d{color:var(--on-brand);background:var(--brand);border-radius:7px;width:22px;text-align:center}
.mc .bars{display:flex;flex-direction:column;gap:2px}
.mc .bars i{display:block;height:4px;border-radius:2px}
.mc .rd{position:absolute;top:6px;right:6px}
.mc .pc{align-self:flex-start;margin-top:auto;max-width:100%;overflow:hidden;white-space:nowrap}
@media (max-width:460px){.mc .pc .w{display:none}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .2s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{margin:0;font-family:var(--display);font-size:21px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.fl{display:grid;gap:5px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.days{display:flex;gap:5px;flex-wrap:wrap}
.days button{min-width:38px;height:34px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:800;color:var(--muted);padding:0 6px}
#qEx button{height:auto;padding:6px 10px;text-align:left;font-weight:700}
.days button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.palette{display:flex;gap:8px;flex-wrap:wrap}
.palette button{width:30px;height:30px;border-radius:50%;border:3px solid transparent}
.palette button.on{border-color:var(--ink)}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:11px;padding:3px}
.seg3 button{padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted)}
.seg3 button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* review charts: one bar per night or week */
.schart{position:relative;display:flex;align-items:flex-end;gap:2px;height:calc(var(--h) + 36px);padding-top:16px}
.sbar{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.sbar .b{width:min(70%,28px);border-radius:4px 4px 0 0;background:#6c7bd0}
.sbar .b.short{background:repeating-linear-gradient(135deg,#6c7bd0 0 4px,color-mix(in srgb,#6c7bd0 55%,var(--panel)) 4px 8px)}
.sbar .b.screen{background:#0891b2}
.sbar .v{font-size:11px;font-weight:700;color:var(--muted);min-height:14px}
.sbar .d{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:16px;height:16px}
.schart .guide{position:absolute;left:0;right:0;border-top:1.5px dashed var(--faint);pointer-events:none}
.schart .guide span{position:absolute;left:-2px;top:-8px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--panel);padding-right:3px}
.schart{padding-left:22px}
.sbar{position:relative;z-index:1}
.sbar .v{background:var(--panel);padding:0 2px;border-radius:4px}
code.field{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:9px 11px;user-select:all;-webkit-user-select:all}

/* settings */
.calrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.calrow:first-of-type{border-top:0}
.calrow .sw{width:14px;height:14px;border-radius:50%}
.calrow .t{flex:1;min-width:0}.calrow .t b{display:block;font-weight:700}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(18px)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.providers button{padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:left;display:grid;gap:1px}
.providers button small{font-weight:500;color:var(--muted);font-size:11.5px}
.providers button.on{border-color:var(--brand);background:var(--brand-soft)}
.err{font-size:12.5px;color:var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:10px;margin:0}
.status{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--faint)}
.status.ok::before{background:var(--ok)}.status.bad::before{background:var(--bad)}

/* planner overlay */
#plannerView{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.pv-bar{display:flex;align-items:center;gap:10px;padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line);min-height:48px}
.pv-bar b{flex:1;font-family:var(--display);font-size:16px;text-align:center}
.pv-back{display:flex;align-items:center;gap:2px;font-weight:700;color:var(--brand);padding:6px 8px;border-radius:10px}
.pv-open{font-size:13px;font-weight:700;color:var(--brand);text-decoration:none;padding:6px 8px}
#pvFrame{flex:1;width:100%;border:0;background:var(--bg)}

#toast{position:fixed;left:50%;bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#setup{padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:grid;gap:14px}

/* ===== v2 layout: clearer sections, bigger labels ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 2px 0}
.sec h2{margin:0;font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec .more{font-size:13px;font-weight:700;color:var(--brand)}
.card{border-radius:18px}
.head h1{font-size:28px}
/* bottom bar with a big add button in the middle */
#nav{position:relative;overflow:visible}
#nav .add{position:relative;display:grid;place-items:center}
#nav .add span{width:56px;height:56px;margin-top:-22px;border-radius:20px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;box-shadow:0 10px 22px -8px color-mix(in srgb,var(--brand) 75%,transparent),0 0 0 5px var(--bg)}
#nav .add svg{width:26px;height:26px}
/* now / next hero */
.hero{background:linear-gradient(150deg,color-mix(in srgb,var(--brand) 92%,#000) 0%,var(--brand) 60%,color-mix(in srgb,var(--brand) 70%,#7c5cff) 100%);color:#fff;border:0;border-radius:22px;padding:16px;display:grid;gap:12px;margin-top:6px}
@media (prefers-color-scheme:dark){.hero{background:linear-gradient(150deg,#1f2c5c,#2b3f8f)}}
.hero .lbl{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
.hero .big{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.hero .meta{font-size:13.5px;opacity:.9;font-weight:600}
.hero .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.hero .prog i{display:block;height:100%;background:#fff;border-radius:3px}
.hero .nx{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.13);border-radius:14px;padding:10px 12px;text-align:left;color:#fff;width:100%}
.hero .nx .when{font-weight:800;font-size:13px;white-space:nowrap;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:8px}
.hero .nx b{display:block;font-size:15px}
.hero .nx small{opacity:.85;font-weight:600}
.hero .dotc{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:left;display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.01em}
.tile .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.warn .v{color:var(--warn-ink)} .tile.bad .v{color:var(--bad)} .tile.good .v{color:var(--ok)}
/* donut */
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media (max-width:360px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:150px;height:150px;display:block}
.donut .ctr{font-family:var(--display);font-weight:800}
.dleg{display:grid;gap:7px;min-width:0;width:100%}
.dleg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13.5px}
.dleg span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dleg b{font-variant-numeric:tabular-nums;font-weight:800}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg i.free{background:repeating-linear-gradient(135deg,var(--faint) 0 2px,transparent 2px 4px);border:1px solid var(--faint)}
/* agenda list (Today "Coming up", Week view, month day) */
.ag-day{display:grid;gap:2px;padding:10px 0;border-top:1px solid var(--line)}
.ag-day:first-child{border-top:0;padding-top:2px}
.ag-dh{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;width:100%;text-align:left}
.ag-dh .dt{font-family:var(--display);font-size:15px}
.ag-dh .badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.ag-dh .badge.today{background:var(--brand);color:var(--on-brand)}
.ag-it{display:grid;grid-template-columns:62px 4px 1fr auto;gap:10px;align-items:center;padding:6px 0;width:100%;text-align:left;min-width:0}
.ag-it .tm{font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-it .bar{align-self:stretch;border-radius:2px;min-height:26px}
.ag-it .t{min-width:0}.ag-it .t b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-it .t span{font-size:12px;color:var(--muted)}
.ag-it .pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.ag-it .pill.ok{background:var(--ok-soft);color:var(--ok)} .ag-it .pill.todo{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}
.ag-it.routine{opacity:.62}
.ag-it.now{background:var(--brand-soft);border-radius:12px;margin:0 -8px;padding:6px 8px;width:calc(100% + 16px)}
.ag-empty{font-size:13px;color:var(--muted);padding:4px 0}
/* 24h strip used in week rows */
.strip{position:relative;height:12px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:4px 0 2px}
.strip i{position:absolute;top:0;bottom:0}
.strip i.sl{background:repeating-linear-gradient(135deg,color-mix(in srgb,#6c7bd0 45%,transparent) 0 3px,transparent 3px 6px)}
.ticks{display:flex;justify-content:space-between;font-size:9.5px;color:var(--faint);font-weight:700;margin-bottom:2px}
/* calendar header */
.calhead{padding:calc(8px + env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:grid;gap:10px;flex:none}
.calnav{display:flex;align-items:center;gap:4px}
.calnav h1{flex:1;margin:0;font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calnav .todayb{font-size:13px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:7px 12px;border-radius:10px;margin-right:4px}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.seg.wide button{padding:8px;font-size:14px}
/* week strip above the day timeline */
.dstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 0 6px}
.dstrip button{display:grid;justify-items:center;gap:1px;padding:6px 0;border-radius:12px;font-size:11px;font-weight:700;color:var(--muted)}
.dstrip button b{font-family:var(--display);font-size:17px;color:var(--ink)}
.dstrip button.on{background:var(--ink);color:var(--panel)} .dstrip button.on b{color:var(--panel)}
.dstrip button.td:not(.on) b{color:var(--brand)}
.dstrip .mk{height:5px;display:flex;gap:2px}.dstrip .mk i{width:5px;height:5px;border-radius:50%}
.tl .hr span{font-size:11.5px}
.blk{border-radius:10px;padding:5px 9px;font-size:12.5px}
.blk b{font-size:13.5px}
/* month cells with words */
.mo{gap:3px}
.mc{min-height:84px;border-radius:12px;padding:4px 3px;gap:2px}
.mc .d{font-size:13px;margin-left:2px}
.mc .ev{display:block;font-size:10px;font-weight:700;line-height:1.25;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:clip;border-left:3px solid;background:color-mix(in srgb,var(--c) 14%,var(--panel));color:var(--ink)}
.mc .mo-more{font-size:10px;font-weight:800;color:var(--muted);padding-left:3px}
.mc.sel{outline:2.5px solid var(--ink);outline-offset:-1px}
.mo-below{padding:4px max(14px,env(safe-area-inset-right)) 100px max(14px,env(safe-area-inset-left))}
/* add sheet */
.mic{width:84px;height:84px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;justify-self:center;box-shadow:0 12px 26px -10px color-mix(in srgb,var(--brand) 80%,transparent)}
.mic svg{width:34px;height:34px}
.mic.rec{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--bad) 20%,transparent)}}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.typegrid button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border-radius:14px;border:1.5px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.typegrid button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.vlist{display:grid;gap:8px}
.vitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left;width:100%}
.vitem .t{flex:1;min-width:0}.vitem .t b{display:block}
.vitem input{width:20px;height:20px;accent-color:var(--brand)}


/* ===== v3: calendar fits one screen ===== */
.calhead{gap:8px;padding-bottom:6px}
.calnav h1{font-size:22px}
.calrow2{display:flex;gap:8px;align-items:center}
.calrow2 .seg.wide{flex:1}
.calpick{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:var(--sunk);font-size:13px;font-weight:800;flex:none}
.calpick .dots{display:flex}.calpick .dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--sunk);margin-left:-4px}.calpick .dots i:first-child{margin-left:0}
#calTop{border-bottom:0;padding-bottom:4px}
.dstrip{padding:0 0 2px}.dstrip button{padding:3px 0}.dstrip button b{font-size:15px}
.pillrow{display:flex;gap:5px;flex-wrap:wrap;max-height:56px;overflow:hidden}
.pill2{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:7px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill2.todo{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 60%,transparent)}
.pill2.ok{opacity:.75}
.clip{font-size:10.5px}
.alert.slim{padding:5px 9px;font-size:12px}.alert.slim svg{width:16px;height:16px}
.tl.fit{margin:4px max(10px,env(safe-area-inset-right)) 0 max(4px,env(safe-area-inset-left))}
.tl.fit .hr span{font-size:10px;top:-6px}
.tl.fit .blk{padding:2px 7px;border-radius:7px}
.blk.thin{display:flex;align-items:center}
.blk b.one{font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk b.one .tm{opacity:.85;font-weight:700}
.tl.fit .gap{font-size:10.5px;border-width:1px}
/* week as seven 24-hour lines */
.ruler{display:grid;grid-template-columns:50px 1fr;padding:0 max(12px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.ruler div{position:relative;height:14px}
.ruler i{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:800;color:var(--faint);font-style:normal}
.ruler i:first-child{transform:none}.ruler i:last-child{transform:translateX(-100%)}
.week{display:grid;padding:0 max(12px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.wrow{display:grid;grid-template-columns:50px 1fr;gap:0;align-items:center;border-top:1px solid var(--line);text-align:left;width:100%}
.wrow .wd{display:grid;justify-items:center;position:relative}
.wrow .wd small{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.wrow .wd b{font-family:var(--display);font-size:20px;line-height:1.1}
.wrow.today .wd b{color:var(--on-brand);background:var(--brand);border-radius:9px;padding:0 6px}
.wrow .wd .rd{position:absolute;top:0;right:6px}
.wrow .wr{display:grid;gap:4px;min-width:0}
.track{position:relative;height:24px;border-radius:7px;background:var(--sunk);overflow:hidden;background-image:linear-gradient(to right,transparent calc(25% - 1px),var(--line) 25%,transparent calc(25% + 1px),transparent calc(50% - 1px),var(--line) 50%,transparent calc(50% + 1px),transparent calc(75% - 1px),var(--line) 75%,transparent calc(75% + 1px))}
.track i{position:absolute;top:2px;bottom:2px;border-radius:5px;overflow:hidden}
.track i.sl{background:repeating-linear-gradient(135deg,color-mix(in srgb,#6c7bd0 50%,transparent) 0 3px,transparent 3px 6px)}
.track i.clash{outline:2px solid var(--bad)}
.track i em{font-style:normal;font-size:10px;font-weight:800;color:#fff;padding:0 4px;line-height:20px;white-space:nowrap;display:block;overflow:hidden;text-overflow:ellipsis}
.track i.sl em{color:var(--muted)}
.track .now{width:2px;background:var(--bad);top:0;bottom:0;border-radius:0}
.wtxt{display:flex;gap:4px 10px;flex-wrap:wrap;max-height:34px;overflow:hidden;font-size:11.5px;font-weight:700}
.wtxt span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.wtxt span i{width:7px;height:7px;border-radius:50%}
.wtxt .pc{font-size:10.5px}
/* month on one screen */
.mo-head{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:800;color:var(--muted);text-align:center;padding:0 max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.mo.fit{gap:3px;padding:2px max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.mo.fit .mc{min-height:0;padding:3px 3px 6px;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;gap:1px;position:relative}
.mo.fit .mc .d{font-size:12px}
.mo.fit .evs{display:flex;flex-direction:column;gap:1.5px;min-height:0;overflow:hidden}
.mo.fit .ev{font-size:9.5px;line-height:10.5px;font-weight:700;padding:0 2px;border-radius:3px;border-left:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 13%,var(--panel));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;white-space:normal;color:var(--ink);flex:none}
.mo.fit .ev u{text-decoration:none;font-weight:800;color:var(--muted);margin-right:2px}
.mo.fit .ev.post{border-left-style:dotted}
.mo.fit .ev.done{opacity:.55}
.mo.fit .mo-more{font-size:9.5px;line-height:12px}
.mstrip{position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:var(--sunk);overflow:hidden}
.mstrip i{position:absolute;top:0;bottom:0}
.mstrip i.sl{background:color-mix(in srgb,#6c7bd0 45%,transparent)}
/* calendar drawer from the left */
.dscrim{position:fixed;inset:0;z-index:35;background:rgba(10,14,22,0);transition:background .2s}
.dscrim.open{background:rgba(10,14,22,.45)}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--panel);padding:calc(16px + env(safe-area-inset-top)) 14px 16px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:12px;transform:translateX(-100%);transition:transform .22s cubic-bezier(.2,.9,.3,1);box-shadow:8px 0 30px rgba(0,0,0,.2)}
.dscrim.open .drawer{transform:none}
.drawer h2{margin:0;font-family:var(--display);font-size:22px}
.dlist{display:grid;gap:6px;overflow:auto}
.drow{display:flex;align-items:center;gap:6px;border-radius:14px;background:var(--sunk);padding:4px 6px 4px 4px}

.dmain{flex:1;display:flex;align-items:center;gap:10px;padding:8px;text-align:left;min-width:0}

.dmain span{display:grid;min-width:0}.dmain b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dmain small{font-size:11.5px;color:var(--muted);font-weight:600}
.dmain .tick{margin-left:auto;font-weight:900;color:var(--ok)}
.only{font-size:11.5px;font-weight:800;color:var(--brand);padding:6px 8px;border-radius:8px}
/* notification settings */
.nrow{display:grid;grid-template-columns:28px 1fr auto auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-of-type{border-top:0}
.nrow .ic{font-size:19px;text-align:center}
.nrow b{display:block;font-weight:800;font-size:14px}.nrow small{color:var(--muted);font-size:11.5px;font-weight:600}

/* designs on a post */
.dfiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}

/* ===== v4: one calendar, simpler views ===== */
.legend2{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;font-weight:700;color:var(--muted);padding:0 2px 4px}
.legend2 span{display:inline-flex;align-items:center;gap:4px}.legend2 i{width:9px;height:9px;border-radius:3px}
.nxlist{padding:4px 12px}

.nx2 i{align-self:stretch;border-radius:2px;min-height:30px}
.nx2 .t{min-width:0}.nx2 b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nx2 small{font-size:12px;color:var(--muted)}
.nx2 .cd{font-size:11.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg.wide4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:10px}.seg.wide4 button{padding:7px 2px;font-size:12.5px}
.pill.half{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}

.warns{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}

/* day as a list spaced by time */

.dposts{display:grid;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 10px;margin-bottom:4px}
.dcard{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:stretch;width:100%;text-align:left;background:color-mix(in srgb,var(--c) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-left:5px solid var(--c);border-radius:14px;padding:9px 10px}
.dcard .tm{display:flex;flex-direction:column;justify-content:space-between;font-variant-numeric:tabular-nums}

.dcard.sleep{background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,transparent 6px 12px),var(--panel);border-left-color:#94a3b8}
.dcard.clash{box-shadow:inset 0 0 0 2px var(--bad)}
.dcard.on{box-shadow:0 0 0 2px var(--brand)}
.dgap{border:1.5px dashed var(--line);border-radius:12px;padding:7px;font-size:12px;font-weight:700;color:var(--faint);text-align:center;width:100%}
.dpray{display:grid;grid-template-columns:50px 8px auto 1fr;gap:8px;align-items:center;padding:2px 0 2px 10px;font-size:12.5px;text-align:left;width:100%}
.dpray .tm{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dpray i{width:8px;height:8px;border-radius:50%;background:#d4a017}
.dpray small{color:var(--muted);font-weight:600}
.dnow{position:relative;height:16px;display:flex;align-items:center}
.dnow::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid var(--bad)}
.dnow span{position:relative;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:6px}
/* week boxes */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.wbox{display:flex;flex-direction:column;gap:5px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 10px;min-height:150px;min-width:0}
.wbox.wide{grid-column:1 / -1;min-height:0}
.dfeed{padding-bottom:30px}
.dsec{display:grid;gap:6px;padding-bottom:18px}
.dsec.past{opacity:.72}
.dshead{position:sticky;top:-1px;z-index:3;background:var(--bg);padding:7px 2px 7px;font-family:var(--display);font-size:16px}
.dshead .muted{font-size:12.5px;font-weight:700}
.dshead b.tdy{color:var(--brand)}
.wfeed{display:grid;gap:2px;padding:4px max(14px,env(safe-area-inset-right)) 30px max(14px,env(safe-area-inset-left))}
.wblock{display:grid;gap:8px;padding-bottom:16px}
.wposts{display:grid;gap:3px;border-top:1px dashed var(--line);padding-top:6px}
.wl u.pok{color:var(--ok)} .wl u.ptodo{color:var(--warn)}
.wbox.past,.mc.past{background:color-mix(in srgb,var(--panel) 55%,var(--bg));opacity:.55}
.mc.past.out{opacity:.35}
.mc.past .d{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.wbox .wh small{font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;vertical-align:2px}
.wbox .wh .tdy{background:var(--brand);color:var(--on-brand)}
.wbox .wh .pst{background:var(--line);color:var(--muted)}
.wbox.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.wbox .wh{display:flex;justify-content:space-between;align-items:center}
.wbox .wh b{font-family:var(--display);font-size:16px}
.wbox.today .wh b{color:var(--brand)}
.wbox .strip{margin:0;height:7px}
.wls{display:flex;flex-direction:column;gap:3px;min-width:0}
.wbox.wide .wls{flex-direction:row;flex-wrap:wrap;gap:3px 12px}
.wl{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wl i{width:7px;height:7px;border-radius:50%;flex:none}
.wl u{text-decoration:none;color:var(--muted);font-weight:800;font-size:11px;font-variant-numeric:tabular-nums;flex:none}
.wp{margin-top:auto;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;align-self:flex-start}
.wp.todo{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn-ink)}.wp.ok{background:var(--ok-soft);color:var(--ok)}
/* month */
.mo.fit .ev{font-size:9px;line-height:10px}
.mo.fit .ev.post{border-left-style:solid}
.mo-key{font-size:11px;color:var(--muted);text-align:center;padding:6px 0}


.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:118px 1fr auto;gap:8px;align-items:center;font-size:13px}
.hb .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .tr{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:6px}
.hb b{font-size:12.5px}
.pdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pday{display:grid;justify-items:center;gap:3px}
.pday .pb{width:100%;max-width:30px;height:60px;border-radius:8px;background:var(--sunk);display:flex;align-items:flex-end;overflow:hidden}
.pday .pb i{display:block;width:100%;background:var(--ok);border-radius:8px}
.pday b{font-size:11.5px}.pday small{font-size:10.5px;color:var(--muted);font-weight:700}
.pday.today small{color:var(--brand)}
.more-set summary{cursor:pointer;list-style:none}.more-set summary::-webkit-details-marker{display:none}
.more-set[open] summary{margin-bottom:10px}
.more-set .card{border:0;padding:8px 0;margin:0;background:none;box-shadow:none}
.more-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.more-add button{font-size:12.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--sunk)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
// ====== CONFIG ======

const SUPABASE_KEY = "sb_publishable_QbVXMyGif27UZnxhjApFUw_ul7EuoC5";

const AI_PROVIDERS = {

};
const PALETTE = ["#0b8a84","#8c1d2f","#7c5cff","#3157e8","#e0812a","#5b8c2a","#d6336c","#0891b2","#a16207","#475569","#c026d3","#16a34a"];
const KIND_ORDER = ["meeting","call","work","shift","university","personal","sleep","post","other"];
const WORLD_CATS = {law:"Law and rights",world:"World days",national:"National days",islamic:"Islamic days",health:"Health days",education:"Education days"};
const WEEKDAYS = [[1,"Mon"],[2,"Tue"],[3,"Wed"],[4,"Thu"],[5,"Fri"],[6,"Sat"],[0,"Sun"]];
// =====================
const W = WWCore, DAY = W.DAY;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = n => `<svg class="i"><use href="#i-${n}"/></svg>`;
function toast(t){const e=$("toast");e.textContent=t;e.classList.remove("hidden");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.add("hidden"),2800)}
const store = { get(k,d){ try{ const v=localStorage.getItem("ww."+k); return v==null?d:JSON.parse(v); }catch{ return d; } }, set(k,v){ try{ localStorage.setItem("ww."+k,JSON.stringify(v)); }catch{} } };

/* ---------- local clock ---------- */
function todayStr(){ const n=new Date(); return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0"); }
function nowMin(){ const n=new Date(); return W.dnum(todayStr())*DAY + n.getHours()*60 + n.getMinutes(); }
function dateObj(s){ const p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
const fmtDay = (s,o) => dateObj(s).toLocaleDateString("en-GB", o);
function mondayOf(s){ const wd=W.weekday(W.dnum(s)); return W.addDays(s, -((wd+6)%7)); }
function relDay(s){ const t=todayStr(); if(s===t) return "Today"; if(s===W.addDays(t,1)) return "Tomorrow"; if(s===W.addDays(t,-1)) return "Yesterday"; return fmtDay(s,{weekday:"short",day:"numeric",month:"short"}); }

/* ---------- data ---------- */
let sb = null, me = null, myName = "", cals = [], events = [], postRows = [], plannerTracks = {}, plannerState = null;
let aiOn = false, health = [], screenWeeks = [], reviews = [], healthMissing = false, postFiles = [], notify = {};
const NOTIFY_DEFAULTS = { shift:{on:true,lead:30,sound:true}, university:{on:true,lead:15,sound:true}, meeting:{on:true,lead:15,sound:true}, other:{on:true,lead:15,sound:true},
  prayer:{on:false,lead:5,sound:true}, bedtime:{on:false,lead:30,sound:true}, briefing_am:{on:true}, briefing_pm:{on:true}, review:{on:true}, alarms:{wake:false,shift:false,shift_lead:60,meeting:false,meeting_lead:30} };
let tab = store.get("tab","today"), calView = store.get("calView","day"), calDate = todayStr(), started = false;

const api = window.WW_TEST_API || {
  async init(){ sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); window.wwSupabase = sb; },
  // Supabase freezes if the database is called from inside this callback, so hand off first
  onAuth(cb){ sb.auth.onAuthStateChange((_e,s)=>{ const u=s?.user||null; setTimeout(()=>cb(u),0); }); },
  signIn(email,password){ return sb.auth.signInWithPassword({email,password}); },
  signUp(email,password,name){ return sb.auth.signUp({email,password,options:{data:{name}}}); },
  signOut(){ return sb.auth.signOut(); },
  async loadAll(){
    const get = () => Promise.all([
      sb.from("profiles").select("*").eq("id",me.id).maybeSingle(),
      sb.from("calendars").select("*").order("sort").order("created_at"),
      sb.from("events").select("*"),
      sb.from("post_status").select("*"),
      sb.from("planner_docs").select("name,json,v").eq("user_id",me.id),
    ]);
    let [p,c,e,ps,pd] = await get();
    const err = c.error || e.error || ps.error;
    if (err) return { missing: /calendars|events|post_status|schema cache|does not exist/i.test(err.message||""), error: err };
    if (!c.data.length) { const r = await sb.rpc("ww_init"); if (!r.error) [p,c,e,ps,pd] = await get(); }
    let files=[]; try { const fr=await sb.from("post_files").select("*").order("created_at"); files=fr.data||[]; } catch {}
    return { profile:p.data, calendars:c.data||[], events:e.data||[], postStatus:ps.data||[], plannerDocs:pd.data||[], files };
  },
  subscribe(onChange){
    const f = "user_id=eq."+me.id;
    sb.channel("ww-"+me.id)
      .on("postgres_changes",{event:"*",schema:"public",table:"calendars",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"events",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"post_status",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"planner_docs",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"reviews",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"health_days",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"health_weeks",filter:f},onChange)
      .on("postgres_changes",{event:"*",schema:"public",table:"post_files",filter:f},onChange)
      .subscribe();
  },
  saveCalendar(c){ const {id,...v}=c; return id ? sb.from("calendars").update(v).eq("id",id).select().single() : sb.from("calendars").insert(v).select().single(); },
  saveEvent(ev){ const {id,...v}=ev; v.updated_at=new Date().toISOString(); return id ? sb.from("events").update(v).eq("id",id).select().single() : sb.from("events").insert(v).select().single(); },
  deleteEvent(id){ return sb.from("events").delete().eq("id",id); },
  setPostStatus(calendar_id,item_key,patch){ return sb.from("post_status").upsert({calendar_id,item_key,...patch,updated_at:new Date().toISOString()},{onConflict:"calendar_id,item_key"}).select().single(); },
  async setPlannerTrack(key, date, patch){
    const name="track-"+date.slice(0,7);
    const {data}=await sb.from("planner_docs").select("json").eq("user_id",me.id).eq("name",name).maybeSingle();
    let map={}; try{ map=data?JSON.parse(data.json):{}; }catch{}
    const cur=map[key]||{};
    for (const [f,v] of Object.entries(patch)) { if (v) cur[f]=1; else delete cur[f]; }
    if (Object.keys(cur).length) map[key]=cur; else delete map[key];
    return sb.rpc("planner_save",{p_name:name,p_json:JSON.stringify(map)});
  },
  setName(n){ return sb.rpc("set_my_name",{p_name:n}); },
  getAi(){ return sb.rpc("get_ai_settings"); },
  saveAi(p){ return sb.rpc("save_ai_settings",p); },
  savePush(j){ return sb.rpc("save_push_sub",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth}); },
  deletePush(endpoint){ return sb.rpc("delete_push_sub",{p_endpoint:endpoint}); },
  testPush(){ return sb.functions.invoke(WORKER,{body:{action:"test_push"}}); },
  async loadPlannerMain(){ const r=await sb.from("planner_docs").select("json").eq("user_id",me.id).eq("name","main").maybeSingle(); return {data:r.data?.json||null, error:r.error}; },
  savePlannerMain(json){ return sb.rpc("planner_save",{p_name:"main",p_json:json}); },
  parseText(text, today, now){ return sb.functions.invoke(WORKER,{body:{action:"parse_text", text, today, now}}); },
  voiceAI(audio, mime, today, now){ return sb.functions.invoke(WORKER,{body:{action:"voice_add", audio, mime, today, now}}); },
  quickAI(text, today, now){ return sb.functions.invoke(WORKER,{body:{action:"quick_add", text, today, now}}); },
  async loadHealth(){
    const since = new Date(Date.now()-70*864e5).toISOString().slice(0,10);

/* ---------- the 24 hours by type (for the round chart) ---------- */
const PRI = { meeting:7, call:7, shift:6, university:5, work:4, personal:3, other:2, sleep:1 };
function typeSplit(date, list){
  const d0=W.dnum(date)*DAY, slot=new Array(DAY);
  W.timed(list.filter(o=>o.cal.visible!==false)).forEach(o=>{ const lo=Math.max(o.start,d0)-d0, hi=Math.min(o.end,d0+DAY)-d0, p=PRI[o.kind]||2;
    for (let m=lo;m<hi;m++) if(!slot[m] || p>(PRI[slot[m]]||2)) slot[m]=o.kind; });
  const acc={};
  for (let m=0;m<DAY;m++){ const k=slot[m]; const t=k?(TYPE[k]||TYPE.other):null; const id=t?t.label:"Free"; (acc[id] ||= {id:t?id:"free",label:id,color:t?t.color:"",minutes:0}).minutes++; }
  return Object.values(acc);
}
function donutGroups(groups){

  if (rest) list.push({id:"other",label:"Other",color:"#94a3b8",minutes:rest});
  if (free && free.minutes) list.push(free);
  return list;
}

function greeting(){ const h=new Date().getHours(); return h<5?"Working late":h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }

function rangeDays(r, t){
  if (r==="today") return [t,t];
  if (r==="week") return [t, W.addDays(mondayOf(t),6)];
  if (r==="next") { const m=W.addDays(mondayOf(t),7); return [m, W.addDays(m,6)]; }
  const d=dateObj(t), last=new Date(d.getFullYear(), d.getMonth()+1, 0); return [t, last.getFullYear()+"-"+String(last.getMonth()+1).padStart(2,"0")+"-"+String(last.getDate()).padStart(2,"0")];
}
function renderToday(){

  const list=occs(W.addDays(t,-1), W.addDays(r1>W.addDays(t,8)?r1:W.addDays(t,8),1)), vis=list.filter(o=>o.cal.visible!==false), an=W.analyse(list);

  $("tTitle").textContent = greeting()+(myName?", "+myName.split(" ")[0]:"");

  const nextPray = vis.filter(o=>o.kind==="prayer"&&!o.allDay&&o.start>nm).sort((a,b)=>a.start-b.start).slice(0,1);
  const nextAll = timedV.filter(o=>o.start>nm).sort((a,b)=>a.start-b.start).slice(0,4).concat(nextPray).sort((a,b)=>a.start-b.start);
  const pToday = groupPosts(postsFor(t,list)); pToday.forEach(p=>postIndex[p.id]=p);
  const todo = pToday.filter(p=>!p.status.scheduled);
  const alerts = alertsFrom(an, t, null, W.addDays(t,7));
  const free = typeSplit(t, vis).find(g=>g.id==="free")?.minutes||0;
  const sleepNext = W.timed(vis).filter(o=>o.kind==="sleep" && o.start>=nm-60 && o.start<nm+DAY).sort((a,b)=>a.start-b.start)[0];
  let sleepLeft=null; if (sleepNext){ const cut=an.shortSleep.find(s=>s.sleep.key===sleepNext.key); sleepLeft = cut?Math.max(0,cut.left):sleepNext.end-sleepNext.start; }
  let weekTodo=0; for(let i=0;i<7;i++) weekTodo+=groupPosts(postsFor(W.addDays(t,i),list)).filter(p=>!p.status.scheduled).length;

  let upHtml=""; for (let d=r0; d<=r1; d=W.addDays(d,1)) upHtml += agendaDayHtml(d, list, an, {skipRoutine:true, prayers:upRange==="today", hideEmpty:true, noHead:upRange==="today"});

    <div class="seg wide4" id="upSeg">${[["today","Today"],["week","This week"],["next","Next week"],["month","This month"]].map(([k,l])=>`<button data-r="${k}" class="${upRange===k?"on":""}">${l}</button>`).join("")}</div>
    <div class="card">${upHtml || `<div class="empty">Nothing planned${upRange==="today"?" for the rest of today":""}.</div>`}</div>

(()=>{ let x0=null,y0=0; const el=$("calBody");

/* DAY: every day joined in one scrolling feed */
function setDayTitle(){ const rd=relDay(calDate); $("calTitle").textContent=["Today","Tomorrow","Yesterday"].includes(rd)? rd+", "+fmtDay(calDate,{day:"numeric",month:"short"}) : fmtDay(calDate,{weekday:"short",day:"numeric",month:"short"}); }
function daySecHtml(d, list, an, nm){
  const vis=list.filter(o=>o.cal.visible!==false), d0=W.dnum(d)*DAY, t=todayStr();
  const posts=groupPosts(postsFor(d,list)); posts.forEach(p=>postIndex[p.id]=p);
  const allDay=vis.filter(o=>o.allDay && o.kind!=="post" && o.date===d);
  const items=W.timed(vis).filter(o=>o.end>d0 && o.start<d0+DAY).map(o=>({o, s:Math.max(o.start,d0), e:Math.min(o.end,d0+DAY), kind:"item"}));
  const prayers=prayersOf(vis,d).map(o=>({o, s:o.start, e:o.start, kind:"pray"}));
  const all=items.concat(prayers).sort((a,b)=>a.s-b.s || (a.kind==="pray")-(b.kind==="pray"));
  let html="", cursor=d0, nowDone=!(nm>=d0 && nm<d0+DAY);
  const nowLine = ()=>`<div class="dnow"><span>Now ${W.fmtTime(nm%DAY)}</span></div>`;
  all.forEach(x=>{
    if (x.kind==="item" && x.s-cursor>=60) { if(!nowDone && nm<x.s){ html+=nowLine(); nowDone=true; } html+=`<button class="dgap" data-add="${x.s-d0}" data-aday="${d}">Free ${dur(x.s-cursor)} · ${tShort(cursor)}–${tShort(x.s)}</button>`; }
    if (!nowDone && nm<x.s) { html+=nowLine(); nowDone=true; }
    if (x.kind==="pray") { html+=`<button class="dpray" data-ev="${x.o.ev.id}" data-date="${x.o.date}"><span class="tm">${tShort(x.o.start)}</span><i></i><b>🕌 ${esc(x.o.ev.title)}</b><small>prayer break</small></button>`; return; }
    const o=x.o, mins=x.e-x.s, h=Math.max(52, Math.min(150, mins*0.32)), sleep=o.kind==="sleep", on=nm>=o.start&&nm<o.end;
    html+=`<button class="dcard ${sleep?"sleep":""} ${an.flagged[o.key]?"clash":""} ${on?"on":""}" style="--c:${colorOf(o)};min-height:${h}px" data-ev="${o.ev.id}" data-date="${o.date}">
      <span class="tm"><b>${o.start<d0?"…":tShort(o.start)}</b><small>${o.end>d0+DAY?"…":tShort(o.end)}</small></span>
      <span class="bd"><b>${esc(o.ev.title)}</b><small>${dur(o.end-o.start)} · ${esc(shortName(o.cal))}${o.start<d0?" · from yesterday":o.end>d0+DAY?" · into tomorrow":""}</small></span>${on?`<span class="pill ok">Now</span>`:""}</button>`;
    cursor=Math.max(cursor,x.e);
  });
  if (d0+DAY-cursor>=60) html+=`<button class="dgap" data-add="${cursor-d0}" data-aday="${d}">Free ${dur(d0+DAY-cursor)} · ${tShort(cursor)}–12a</button>`;
  if (!nowDone) html+=nowLine();
  const rd=relDay(d), head = ["Today","Tomorrow","Yesterday"].includes(rd) ? `${rd} <span class="muted">· ${fmtDay(d,{weekday:"short",day:"numeric",month:"short"})}</span>` : fmtDay(d,{weekday:"long",day:"numeric",month:"short"});
  const alerts = d>=t ? alertsFrom(an,d,d) : [];
  return `<section class="dsec ${d<t?"past":""}" data-dsec="${d}">
    <div class="dshead"><b class="${d===t?"tdy":""}">${head}</b></div>
    ${(allDay.length||posts.length)?`<div class="dposts">${allDay.map(o=>rowHtml({o,date:d},nm)).join("")}${posts.map(p=>rowHtml({post:p},nm)).join("")}</div>`:""}
    ${html || `<button class="dgap" data-add="540" data-aday="${d}">Nothing planned · tap to add</button>`}
    ${alerts.map(a=>alertHtml(a,false)).join("")}
  </section>`;
}
let dayLo=null, dayHi=null, wkLo=null, wkHi=null, feedBusy=false;
function dayRangeHtml(a,b,nm){ const list=occs(W.addDays(a,-1),W.addDays(b,1)), an=W.analyse(list); let h=""; for(let d=a; d<=b; d=W.addDays(d,1)) h+=daySecHtml(d,list,an,nm); return h; }
function wireStrip(){ $("calTop").querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{ calDate=b.dataset.pick; renderCal(); }); }
function wireFeed(){ const body=$("calBody"); wire(body); body.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>openEvent(null, b.dataset.aday||calDate, Math.round(+b.dataset.add/30)*30)); }
function renderDayView(){

function extendDayFeed(dir){
  if (feedBusy) return; feedBusy=true;
  const body=$("calBody"), feed=body.querySelector(".dfeed"); if(!feed){ feedBusy=false; return; }

  else { const b0=W.addDays(dayLo,-1); dayLo=W.addDays(dayLo,-7); const h0=body.scrollHeight; feed.insertAdjacentHTML("afterbegin", dayRangeHtml(dayLo,b0,nm)); body.scrollTop += body.scrollHeight-h0; }

function syncStrip(){

/* WEEK: weeks joined in one scrolling feed; six boxes and Sunday wide */
function weekBoxHtml(d, list, an, compact){
  const vis=list.filter(o=>o.cal.visible!==false), d0=W.dnum(d)*DAY, t=todayStr();
  const items=W.timed(vis).filter(o=>o.kind!=="sleep" && o.start>=d0-1 && o.start<d0+DAY).sort((a,b)=>a.start-b.start);
  const cont=W.timed(vis).filter(o=>o.kind!=="sleep" && o.start<d0 && o.end>d0);
  const aday=vis.filter(o=>o.allDay && o.kind!=="post" && o.date===d);
  const posts=groupPosts(postsFor(d,list)); posts.forEach(p=>postIndex[p.id]=p);
  const fl=d>=t && (an.clashes.some(c=>c.date===d)||an.shortSleep.some(s=>s.date===d));
  const lines=aday.map(o=>`<span class="wl"><i style="background:${colorOf(o)}"></i><u>★</u>${esc(o.ev.title)}</span>`)
    .concat(cont.map(o=>`<span class="wl"><i style="background:${colorOf(o)}"></i><u>till ${tShort(o.end)}</u>${esc(o.ev.title)}</span>`))
    .concat(items.map(o=>`<span class="wl"><i style="background:${colorOf(o)}"></i><u>${tShort(o.start)}</u>${esc(o.ev.title)}</span>`));
  const pl=posts.slice(0,3).map(p=>`<span class="wl"><i style="background:${postColor(p)}"></i><u class="${p.status.scheduled?"pok":"ptodo"}">${p.status.scheduled?"✓":"○"}</u>${esc(p.title)}</span>`).join("")
    + (posts.length>3?`<span class="wl muted">+${posts.length-3} more post${posts.length>4?"s":""}</span>`:"");
  return `<button class="wbox ${d===t?"today":""} ${d<t?"past":""} ${compact?"wide":""}" data-day="${d}">
    <span class="wh"><b>${fmtDay(d,{weekday:"short"})} <span class="num">${+d.slice(8)}</span>${d===t?` <small class="tdy">Today</small>`:d<t?` <small class="pst">done</small>`:""}</b>${fl?`<i class="rd"></i>`:""}</span>
    ${stripHtml(d,list)}
    <span class="wls">${lines.join("") || `<span class="wl muted">Free day</span>`}</span>
    ${posts.length?`<span class="wposts">${pl}</span>`:""}</button>`;
}
function weekLabel(start){ return start===todayStr() ? "Next 7 days" : fmtDay(start,{day:"numeric",month:"short"})+" – "+fmtDay(W.addDays(start,6),{day:"numeric",month:"short"}); }
function weekBlockHtml(start, list, an){
  return `<div class="wblock" data-wk="${start}"><div class="dshead"><b class="${start===todayStr()?"tdy":""}">${weekLabel(start)}</b></div>
    <div class="wgrid">${[0,1,2,3,4,5].map(i=>weekBoxHtml(W.addDays(start,i),list,an)).join("")}${weekBoxHtml(W.addDays(start,6),list,an,true)}</div>
    ${warnsHtml(alertsFrom(an,start,null,W.addDays(start,6)))}</div>`;
}
function weekRangeHtml(a,b){ const list=occs(W.addDays(a,-1),W.addDays(b,7)), an=W.analyse(list); let h=""; for(let x=a; x<=b; x=W.addDays(x,7)) h+=weekBlockHtml(x,list,an); return h; }
function renderWeekView(){
  const start=calDate; wkLo=W.addDays(start,-7); wkHi=W.addDays(start,14);
  $("calTitle").textContent = weekLabel(start);
  $("calTop").innerHTML = legendHtml();
  $("calBody").innerHTML = `<div class="wfeed">${weekRangeHtml(wkLo,wkHi)}</div>`;
  wire($("calBody"));
  requestAnimationFrame(()=>{ const bl=$("calBody").querySelector(`[data-wk="${start}"]`); if(bl) $("calBody").scrollTop=Math.max(0,bl.offsetTop-4); });
}
function extendWeekFeed(dir){
  if (feedBusy) return; feedBusy=true;
  const body=$("calBody"), feed=body.querySelector(".wfeed"); if(!feed){ feedBusy=false; return; }
  if (dir>0){ const a=W.addDays(wkHi,7); wkHi=W.addDays(wkHi,14); feed.insertAdjacentHTML("beforeend", weekRangeHtml(a,wkHi)); }
  else { const b0=W.addDays(wkLo,-7); wkLo=W.addDays(wkLo,-14); const h0=body.scrollHeight; feed.insertAdjacentHTML("afterbegin", weekRangeHtml(wkLo,b0)); body.scrollTop += body.scrollHeight-h0; }
  wire($("calBody")); feedBusy=false;
}
/* keep the title, the day strip and the Today button in step while scrolling, and grow the feed near the ends */
let scrPending=false;
$("calBody").addEventListener("scroll",()=>{ if(scrPending) return; scrPending=true; requestAnimationFrame(()=>{ scrPending=false; calScrolled(); }); },{passive:true});
function calScrolled(){
  const body=$("calBody");
  if (calView==="day"){
    if (body.scrollTop<400) extendDayFeed(-1);
    else if (body.scrollHeight-body.scrollTop-body.clientHeight<900) extendDayFeed(1);
    const top=body.scrollTop+60; let cur=null;
    for (const sec of body.querySelectorAll(".dsec")){ if (sec.offsetTop+sec.offsetHeight>top){ cur=sec; break; } }
    if (cur && cur.dataset.dsec!==calDate){ calDate=cur.dataset.dsec; setDayTitle(); syncStrip(); updTodayBtn(); }
  } else if (calView==="week"){
    if (body.scrollTop<400) extendWeekFeed(-1);
    else if (body.scrollHeight-body.scrollTop-body.clientHeight<900) extendWeekFeed(1);
    const top=body.scrollTop+60; let cur=null;
    for (const bl of body.querySelectorAll(".wblock")){ if (bl.offsetTop+bl.offsetHeight>top){ cur=bl; break; } }
    if (cur && cur.dataset.wk!==calDate){ calDate=cur.dataset.wk; $("calTitle").textContent=weekLabel(calDate); updTodayBtn(); }
  }
}
function updTodayBtn(){ $("calToday").classList.toggle("hidden", calView==="month" ? calDate.slice(0,7)===todayStr().slice(0,7) : calDate===todayStr()); }

/* MONTH: the month on one screen with the main events and post status */
function renderMonthView(){
  const d=dateObj(calDate), y=d.getFullYear(), m=d.getMonth()+1, first=`${y}-${String(m).padStart(2,"0")}-01`;
  const start=mondayOf(first), list=occs(W.addDays(start,-1), W.addDays(start,43)), vis=list.filter(o=>o.cal.visible!==false), an=W.analyse(list), t=todayStr();
  $("calTitle").textContent = dateObj(first).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  let weeks=0; for (let i=0;i<42;i+=7){ if (i>=28 && +W.addDays(start,i).slice(5,7)!==m) break; weeks++; }
  $("calTop").innerHTML = `<div class="mo-head">${WEEKDAYS.map(w=>`<span>${w[1]}</span>`).join("")}</div>`;
  const body=$("calBody"), cellH=Math.max(96, (body.clientHeight-8-(weeks-1)*3)/weeks), lines=Math.max(2, Math.floor((cellH-24)/12));
  const flagDays = new Set(an.clashes.map(c=>c.date).concat(an.shortSleep.map(s=>s.date)).filter(x=>x>=t));
  let html="";
  for (let i=0;i<weeks*7;i++){
    const day=W.addDays(start,i), out=+day.slice(5,7)!==m, d0=W.dnum(day)*DAY, posts=groupPosts(postsFor(day,list));
    const evs=vis.filter(o=>o.kind!=="sleep" && o.kind!=="post" && o.kind!=="prayer" && !ROUTINE(o) && (o.allDay ? o.date===day : (o.start>=d0 && o.start<d0+DAY))).sort((a,b)=>a.start-b.start);
    const rows=evs.map(o=>`<span class="ev" style="--c:${colorOf(o)}">${o.allDay?"":`<u>${tShort(o.start)}</u>`}${esc(o.ev.title)}</span>`)
      .concat(posts.map(p=>`<span class="ev post ${p.status.scheduled?"done":""}" style="--c:${postColor(p)}">${p.status.scheduled?"✓ ":"○ "}${esc(p.title)}</span>`));
    const shown = rows.length>lines ? rows.slice(0,lines-1) : rows;
    html+=`<button class="mc ${out?"out":""} ${day===t?"today":""} ${day<t?"past":""}" data-mday="${day}" style="height:${cellH}px"><span class="d num">${+day.slice(8)}</span>${flagDays.has(day)?`<i class="rd"></i>`:""}
      <span class="evs">${shown.join("")}${rows.length>shown.length?`<span class="mo-more">+${rows.length-shown.length} more</span>`:""}</span></button>`;
  }
  const alerts=alertsFrom(an, first, null, W.addDays(first,30)).filter(a=>a.date.slice(0,7)===first.slice(0,7));
  body.innerHTML = `<div class="mo fit">${html}</div><div class="mo-key">○ not scheduled · ✓ scheduled</div>${warnsHtml(alerts).replace('class="warns"','class="warns pad"')}`;
  body.querySelectorAll("[data-mday]").forEach(b=>b.onclick=()=>openDaySheet(b.dataset.mday));
  wire(body);
}
function openDaySheet(day){

  sheet(`<div class="line"><h2>${esc(fmtDay(day,{weekday:"long",day:"numeric",month:"long"}))}</h2><button class="btn soft sm" id="dsOpen">Open day</button></div>
    ${stripHtml(day,list)}

  $("dsOpen").onclick=()=>{ closeSheet(); openDay(day); };
  $("dsAdd").onclick=()=>{ closeSheet(); openAdd(day); };
}

  try { const {data,error}=await api.loadPlannerMain(); if(error) throw error; st = normaliseState(data ? JSON.parse(data) : null); }

}

/* recording: iPhone home-screen apps can't use the browser's speech reader, so the audio goes to your AI key to be understood */
let rec=null;
async function toggleRecording(){
  const btn=$("qMic");
  if (rec) { rec.stop(); return; }
  if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast("This phone can't record here. Use the keyboard 🎤 instead."); $("qText").focus(); return; }
  let stream; try { stream=await navigator.mediaDevices.getUserMedia({audio:true}); } catch { toast("Microphone wasn't allowed. Allow it in Settings for this app."); return; }
  const type=["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t=>MediaRecorder.isTypeSupported?.(t))||"";
  const chunks=[]; rec=new MediaRecorder(stream, type?{mimeType:type}:undefined);
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  const timer=setTimeout(()=>rec&&rec.stop(), 45000);
  rec.onstop=async()=>{
    clearTimeout(timer); stream.getTracks().forEach(t=>t.stop()); const mime=(rec.mimeType||type||"audio/mp4").split(";")[0]; rec=null;
    if (!$("qMic")) return; btn.classList.remove("rec"); $("qMicHelp").textContent="Understanding…";
    const blob=new Blob(chunks,{type:mime});
    if (blob.size<1500) { $("qMicHelp").textContent="That was too short. Tap and try again."; return; }
    const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
    try {
      const {data,error}=await api.voiceAI(b64, mime, todayStr(), hm(nowMin()%DAY));
      if (error || data?.error) throw new Error(data?.error || error.message);
      handleActions(data);
    } catch(e) { $("qMicHelp").textContent="Couldn't understand it: "+(e.message||e); }
  };
  rec.start(); btn.classList.add("rec"); $("qMicHelp").textContent="Listening… tap again when you're done.";
}
/* what the voice or a typed command asked for: things to add, things to take out */
function matchOccs(what, d){
  const list=occs(W.addDays(d,-1),W.addDays(d,1)), w=String(what||"").toLowerCase().trim();
  return list.filter(o=>o.date===d && !o.allDay && o.kind!=="sleep" && o.kind!=="prayer" && o.cal.visible!==false && !o.cal.archived)
    .filter(o=>{ if(!w) return true; const t=o.ev.title.toLowerCase();
      return t.includes(w) || w.includes(t) || o.kind===w ||
        (/class|uni|lecture/.test(w) && o.kind==="university") ||
        (/meeting|call/.test(w) && (o.kind==="meeting"||o.kind==="call")) ||
        (/shift/.test(w) && o.kind==="shift") ||
        w.split(/\s+/).some(x=>x.length>3 && t.includes(x)); });
}
function handleActions(data){
  const nm=nowMin()%DAY;
  const adds=(data.add||data.entries||[]).map(a=>fromAI(a, W.parseQuick(a.title||"", cals, todayStr(), nm)));
  let rem=[];
  (data.remove||[]).forEach(r=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(r?.date||"")) rem=rem.concat(matchOccs(r.what, r.date)); });
  (data.day_off||[]).forEach(d=>{ if(/^\d{4}-\d{2}-\d{2}$/.test(d||"")) rem=rem.concat(matchOccs("", d)); });
  const seen={}; rem=rem.filter(o=>{ const k=o.ev.id+"@"+o.date; if(seen[k]) return false; seen[k]=1; return true; });
  if (!adds.length && !rem.length) {
    const msg=data.transcript?`I heard “${data.transcript}” but found nothing to do.`:"I didn't catch anything. Try again.";
    if ($("qMicHelp")) $("qMicHelp").textContent=msg; else toast(msg); return;
  }
  if (rem.length) return openVoicePlan(adds, rem, data.transcript);
  if (adds.length===1) { closeSheet(); return openEvent(null, adds[0].date, null, {...adds[0], heard:data.transcript}); }
  openVoiceList(adds, data.transcript);
}

/* trust the AI's answer only where it is well formed; fall back to the simple reader for the rest */
function fromAI(a, local){
  const ok = (v,re)=>typeof v==="string" && re.test(v);
  const cal = cals.find(c=>[c.name,c.short_name].filter(Boolean).some(n=>n.toLowerCase()===String(a.calendar||"").toLowerCase()));
  return {
    via:"ai", guessed:[],
    title: (typeof a.title==="string" && a.title.trim()) ? a.title.trim().slice(0,140) : local.title,
    calendar_id: cal ? cal.id : local.calendar_id,
    kind: W.KINDS[a.kind] ? a.kind : local.kind,
    date: ok(a.date,/^\d{4}-\d{2}-\d{2}$/) ? a.date : local.date,
    start_time: a.kind==="post" ? null : ok(a.start,/^\d{2}:\d{2}$/) ? a.start : local.start_time,
    end_time: a.kind==="post" ? null : ok(a.end,/^\d{2}:\d{2}$/) ? a.end : local.end_time,
    repeat: ["none","daily","weekly"].includes(a.repeat) ? a.repeat : local.repeat,
    repeat_days: Array.isArray(a.repeat_days) ? a.repeat_days.filter(x=>Number.isInteger(x)&&x>=0&&x<=6) : local.repeat_days,
  };
}

function hhmmLocal(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
/* one bar per night, a dashed line at 6 hours */
function sleepChartHtml(){
  const t=todayStr(), days=[]; for(let i=7;i>=1;i--) days.push(W.addDays(t,-i+1));
  const byDate={}; health.forEach(h=>byDate[h.date]=h);
  const vals=days.map(d=>{ const h=byDate[d]; return h?W.sleepMinutes(h):null; });
  const max=Math.max(9*60,...vals.filter(v=>v!=null)), H=120;
  const bars=days.map((d,i)=>{ const v=vals[i], hgt=v!=null?Math.max(3,v/max*H):0, h=byDate[d];
    const tip = v!=null ? `${fmtDay(d,{weekday:"long"})}: ${W.fmtDur(v)}${h&&h.sleep_start&&h.sleep_end?` (${W.fmtTime(W.tmin(hhmmLocal(h.sleep_start)))} to ${W.fmtTime(W.tmin(hhmmLocal(h.sleep_end)))})`:""}` : `${fmtDay(d,{weekday:"long"})}: no data`;
    return `<button class="sbar" data-sleep="${d}" title="${esc(tip)}" aria-label="${esc(tip)}"><span class="v num">${v!=null?(v/60).toFixed(1):""}</span><span class="b ${v!=null&&v<360?"short":""}" style="height:${hgt}px"></span><span class="d">${fmtDay(d,{weekday:"short"}).slice(0,2)}</span></button>`; }).join("");
  const have=vals.filter(v=>v!=null), avg=have.length?Math.round(have.reduce((a,b)=>a+b,0)/have.length):null;
  return `<div class="schart" style="--h:${H}px"><div class="guide" style="bottom:${360/max*H+19}px"><span>6h</span></div>${bars}</div>
    <div class="small muted">${avg!=null?`Average ${W.fmtDur(avg)} over ${have.length} night${have.length>1?"s":""}. Tap a bar for the times.`:"No sleep recorded in the last 7 days yet."}</div>`;
}

  if (!rows.length) return `<div class="empty">No screen time added yet. On iPhone: Settings, Screen Time, See All Activity, then Week shows your daily average.</div>`;

/* ---------- MY WEEK: where the week's time goes, sleep and posts, at a glance ---------- */
function weekTypeHours(mon){
  const list=occs(W.addDays(mon,-1),W.addDays(mon,7)), acc={};
  for (let i=0;i<7;i++) typeSplit(W.addDays(mon,i),list).forEach(g=>{ if(g.id==="free") return; (acc[g.id] ||= {...g,minutes:0}).minutes+=g.minutes; });
  return Object.values(acc).sort((a,b)=>b.minutes-a.minutes);
}
function barsHtml(rows, max){
  return `<div class="hbars">${rows.map(r=>`<div class="hb"><span class="n">${esc(r.label)}</span><span class="tr"><i style="width:${(r.minutes/max*100).toFixed(1)}%;background:${r.color}"></i></span><b class="num">${W.fmtDur(r.minutes)}</b></div>`).join("")}</div>`;
}
function todoHtml(t){
  const list=occs(W.addDays(t,-1),W.addDays(t,8)), out=[];
  for (let i=0;i<7;i++){ const d=W.addDays(t,i); groupPosts(postsFor(d,list)).filter(p=>!p.status.scheduled).forEach(p=>{ postIndex[p.id]=p; out.push({p,d}); }); }
  if (!out.length) return `<p class="small muted" style="margin:0">Every post for the next 7 days is scheduled ✓</p>`;
  return out.slice(0,8).map(x=>`<button class="ag-it" data-post="${esc(x.p.id)}"><span class="tm">${x.d===t?"Today":fmtDay(x.d,{weekday:"short"})}</span><span class="bar" style="background:${postColor(x.p)}"></span><span class="t"><b>${esc(x.p.title)}</b><span>${esc(x.p.calNames)}</span></span>${postStatusHtml(x.p.status)}</button>`).join("")
    + (out.length>8?`<div class="small muted" style="padding:4px 2px 0">+${out.length-8} more — see the calendar</div>`:"");
}
function comingHtml(t){
  const out=[];
  for (let i=0;i<14;i++){ const d=W.addDays(t,i); (W.worldDaysOn?W.worldDaysOn(d):[]).forEach(it=>out.push({d,it})); }
  out.sort((a,b)=> a.d.localeCompare(b.d) || (b.it.size==="major")-(a.it.size==="major"));
  if (!out.length) return `<p class="small muted" style="margin:0">No special days in the next two weeks.</p>`;
  return `<div class="wls" style="gap:6px">${out.slice(0,9).map(x=>`<span class="wl"><u>${x.d===t?"Today":fmtDay(x.d,{day:"numeric",month:"short"})}</u>${x.it.size==="major"?"⭐ ":""}${esc(x.it.title)}</span>`).join("")}</div>`;
}
function renderReview(){
  const t=todayStr(), mon=mondayOf(t), sun=W.addDays(mon,6);
  $("wkEyebrow").textContent = fmtDay(mon,{day:"numeric",month:"short"})+" – "+fmtDay(sun,{day:"numeric",month:"short"});
  const rows=weekTypeHours(mon), max=Math.max(1,...rows.map(r=>r.minutes));
  const list=occs(W.addDays(mon,-1),W.addDays(sun,1));
  const days=[0,1,2,3,4,5,6].map(i=>{ const d=W.addDays(mon,i), ps=groupPosts(postsFor(d,list)); return {d, total:ps.length, done:ps.filter(p=>p.status.scheduled).length}; });
  const pt=days.reduce((a,x)=>a+x.total,0), pd=days.reduce((a,x)=>a+x.done,0);
  const latest=reviews[0];
  $("reviewBody").innerHTML = `
    <div class="card"><h3>Where your time goes</h3>${rows.length?barsHtml(rows,max):`<div class="empty">Nothing planned this week yet.</div>`}</div>
    <div class="card"><h3>Posts this week <span class="small muted">${pd} of ${pt} scheduled</span></h3>
      <div class="pdays">${days.map(x=>`<button class="pday ${x.d===t?"today":""}" data-day="${x.d}"><span class="pb"><i style="height:${x.total?Math.max(8,x.done/x.total*100):0}%"></i></span><b class="num">${x.total?x.done+"/"+x.total:"–"}</b><small>${fmtDay(x.d,{weekday:"short"}).slice(0,2)}</small></button>`).join("")}</div></div>
    <div class="card"><h3>Still to do <span class="small muted">posts, next 7 days</span></h3>${todoHtml(t)}</div>
    <div class="card"><h3>Coming up <span class="small muted">special days</span></h3>${comingHtml(t)}</div>
    ${hoursCardHtml()}
    <div class="card"><h3>Sleep <span class="small muted">last 7 nights</span></h3>${sleepChartHtml()}
      <div class="actions"><button class="btn soft sm" id="hAdd">Add last night</button><button class="btn ghost sm" id="hShortcut">${icon("phone")} Sleep buttons</button></div></div>
    <div class="card"><h3>✨ AI tips</h3>${latest&&latest.items?.length?reviewHtml(latest,false):`<p class="small muted" style="margin:0">${aiOn?"Tap <b>AI tips</b> at the top and your AI looks at this week and gives you a few short tips.":"Turn on AI in Settings, then tap <b>AI tips</b> at the top for a few short tips about your week."}</p>`}</div>
    <div class="card"><h3>Screen time</h3>${screenChartHtml()}<div class="actions"><button class="btn soft sm" id="hScreen">Add last week's average</button></div></div>`;
  $("hAdd").onclick=()=>openSleepEntry(todayStr());
  $("hShortcut").onclick=openShortcut;
  $("hScreen").onclick=openScreenEntry;
  $("hMore").onclick=openPastWeeks;
  wire($("reviewBody"));
  $("reviewBody").querySelectorAll("[data-sleep]").forEach(b=>b.onclick=()=>openSleepEntry(b.dataset.sleep));
  if (latest && !latest.read) api.markRead(latest.id).then(()=>{ latest.read=true; }).catch(()=>{});
}

function openSleepEntry(date){
  const h=health.find(x=>x.date===date);
  const bed=h?.sleep_start?hhmmLocal(h.sleep_start):"06:00", wake=h?.sleep_end?hhmmLocal(h.sleep_end):"13:00";
  sheet(`<h2>Sleep</h2>
    <label class="fl"><span class="label">Woke up on</span><input id="sDate" class="field" type="date" value="${date}"></label>
    <div class="grid2"><label class="fl"><span class="label">Fell asleep</span><input id="sBed" class="field" type="time" value="${bed}"></label>
      <label class="fl"><span class="label">Woke up</span><input id="sWake" class="field" type="time" value="${wake}"></label></div>
    <div class="small muted" id="sHint"></div>
    <div class="actions"><button class="btn" id="sSave">Save</button>${h?`<button class="btn danger" id="sDel">Delete</button>`:""}</div>`);
  const calc=()=>{ const d=$("sDate").value, [bh,bm]=$("sBed").value.split(":").map(Number), [wh,wm]=$("sWake").value.split(":").map(Number);
    const end=new Date(...d.split("-").map((x,i)=>i===1?+x-1:+x), wh, wm), start=new Date(end); start.setHours(bh,bm,0,0); if (start>=end) start.setDate(start.getDate()-1);
    return {start,end,mins:Math.round((end-start)/60000)}; };
  const hint=()=>{ try{ const c=calc(); $("sHint").textContent=W.fmtDur(c.mins)+" of sleep"; }catch{} };
  ["sDate","sBed","sWake"].forEach(id=>$(id).oninput=hint); hint();
  $("sSave").onclick=async()=>{ const c=calc(); if(c.mins<=0||c.mins>20*60) return toast("Check the times");
    const r=await api.saveHealthDay({ user_id:me.id, date:$("sDate").value, sleep_start:c.start.toISOString(), sleep_end:c.end.toISOString(), asleep_minutes:null, source:"manual" });
    if (r.error) return toast(r.error.message); closeSheet(); toast("Saved"); await loadHealth(); render(); };
  if ($("sDel")) $("sDel").onclick=async()=>{ const r=await api.deleteHealthDay(date); if(r.error) return toast(r.error.message); closeSheet(); await loadHealth(); render(); };
}

async function sha256hex(t){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
