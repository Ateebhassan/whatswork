<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1119" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WhatsWork">
<title>WhatsWork</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<style>
/* Layout: phone-first app shell — list pane + chat pane side by side on desktop, stacked with a bottom tab bar on phones */
:root{
  --bg:#f3f4f8; --panel:#ffffff; --sunk:#eceef4; --chat:#e9ecf3;
  --ink:#161b26; --muted:#6a7387; --line:#dfe3ec;
  --brand:#3157e8; --brand-soft:#e3e9ff; --on-brand:#ffffff;
  --mine:#dde5ff; --theirs:#ffffff;
  --task:#ffb21e; --task-deep:#e88a00; --on-task:#2e1f00;
  --late:#e5483b; --ok:#169a62; --done:#a3abbb;
  --shadow:0 1px 2px rgba(22,27,38,.06),0 4px 14px rgba(22,27,38,.06);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1119; --panel:#141a25; --sunk:#1a2130; --chat:#0f141e;
  --ink:#e8ecf4; --muted:#8f99ad; --line:#252e40;
  --brand:#7491ff; --brand-soft:#1e2847; --on-brand:#0d1119;
  --mine:#22305c; --theirs:#1b2231;
  --task:#ffb21e; --task-deep:#ffc552; --on-task:#2e1f00;
  --late:#ff6b5e; --ok:#3fcf8e; --done:#566078;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
body{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.field{width:100%;background:var(--sunk);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,background .15s}
.field:focus{border-color:var(--brand);background:var(--panel)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);font-weight:700;border-radius:12px;padding:12px 18px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--late);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- auth ---------- */
#auth{height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));overflow:auto}
.auth-card{width:100%;max-width:380px;display:grid;gap:14px}
.wordmark{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wordmark .dot{width:14px;height:14px;border-radius:50%;background:var(--task);box-shadow:0 0 0 4px color-mix(in srgb,var(--task) 30%,transparent)}
.auth-demo{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px}
.auth-tabs button{padding:9px;border-radius:9px;font-weight:700;color:var(--muted)}
.auth-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* ---------- shell ---------- */
#app{height:100%;display:flex}
#side{width:380px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0}
.side-head{padding:calc(14px + env(safe-area-inset-top)) 18px 10px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}
.side-head h1{margin:0;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--sunk)}
.iconbtn.brand{background:var(--brand);color:var(--on-brand)}
.pane{flex:1;overflow:auto;min-height:0}
#nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
#nav button{display:grid;justify-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
#nav button.on{color:var(--brand)}
#nav .badge{position:absolute;top:5px;left:calc(50% + 6px)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--task);color:var(--on-task);font-size:11px;font-weight:800;display:inline-grid;place-items:center}

/* chat list */
.search{margin:4px 18px 10px}
.row{display:flex;gap:12px;align-items:center;padding:11px 18px;cursor:pointer;width:100%;text-align:left}
.row:hover{background:var(--sunk)}.row.on{background:var(--brand-soft)}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;font-family:var(--display)}
.av.sm{width:34px;height:34px;font-size:13px}
.row-main{flex:1;min-width:0}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:12px;color:var(--muted);flex:none}
.row-sub{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px}
.row-prev{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-size:18px}

/* chat pane */
#main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--chat)}
#welcome{flex:1;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
#welcome .wordmark{justify-content:center;color:var(--ink);font-size:44px;margin-bottom:6px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat-head{background:var(--panel);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left))}
.chat-title{display:flex;align-items:center;gap:10px;min-height:52px}
.chat-title .who{flex:1;min-width:0}
.chat-title .who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-title .who span{font-size:12.5px;color:var(--muted)}
#back{display:none}

/* floating work bubbles */
.orbit{display:flex;gap:10px;overflow-x:auto;padding:10px 4px 12px;scrollbar-width:none;align-items:center}
.orbit::-webkit-scrollbar{display:none}
.wb{flex:none;display:flex;align-items:center;gap:8px;max-width:230px;padding:7px 14px 7px 7px;border-radius:999px;background:var(--task);color:var(--on-task);font-weight:700;font-size:13px;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--task-deep) 70%,transparent);animation:bob 3.4s ease-in-out infinite}
.wb:nth-child(3n+2){animation-delay:-1.1s}.wb:nth-child(3n){animation-delay:-2.3s}
.wb .who{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;flex:none}
.wb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb .due{font-size:11px;font-weight:800;opacity:.75;flex:none}
.wb.late{background:var(--late);color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--late) 70%,transparent)}
.wb.done{background:var(--sunk);color:var(--muted);box-shadow:none;animation:none;text-decoration:line-through}
.wb.ai::after{content:"AI";font-size:9px;font-weight:800;letter-spacing:.06em;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.12)}
.orbit-empty{font-size:12.5px;color:var(--muted);padding:2px 6px}
.orbit-toggle{flex:none;font-size:12px;font-weight:700;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px dashed var(--line)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wb.new{animation:pop .35s cubic-bezier(.2,1.4,.4,1),bob 3.4s ease-in-out .35s infinite}

#msgs{flex:1;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:3px;
  background-image:radial-gradient(color-mix(in srgb,var(--line) 70%,transparent) 1px,transparent 1.2px);background-size:22px 22px}
.day{align-self:center;margin:12px 0 8px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--panel);padding:4px 12px;border-radius:999px;box-shadow:var(--shadow)}
.msg{max-width:min(78%,560px);padding:8px 12px 6px;border-radius:18px;background:var(--theirs);align-self:flex-start;position:relative;box-shadow:var(--shadow);word-wrap:break-word;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.msg.me{align-self:flex-end;background:var(--mine)}
.msg.first{margin-top:8px}
.msg:not(.me).first{border-top-left-radius:6px}.msg.me.first{border-top-right-radius:6px}
.msg .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted);margin-top:2px}
.msg img{display:block;max-width:100%;max-height:340px;border-radius:12px;margin:-2px -6px 6px;cursor:zoom-in;background:var(--sunk);min-height:80px;min-width:120px;object-fit:cover}
.msg .file{display:flex;align-items:center;gap:10px;padding:8px 10px;margin:-2px -4px 6px;border-radius:12px;background:color-mix(in srgb,var(--ink) 6%,transparent);color:inherit;text-decoration:none;font-weight:600}
.msg .tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--task-deep);margin-bottom:2px;cursor:pointer}
.msg .mk{position:absolute;top:50%;transform:translateY(-50%);right:-42px;width:32px;height:32px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow);display:grid;place-items:center;opacity:0;transition:opacity .15s;color:var(--task-deep)}
.msg.me .mk{right:auto;left:-42px}
.msg:hover .mk{opacity:1}
.msg.flash{animation:flash 1.6s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--task)}100%{box-shadow:var(--shadow)}}
#composer{display:flex;gap:8px;align-items:flex-end;padding:8px max(10px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:var(--panel);border-top:1px solid var(--line)}
#composer textarea{flex:1;resize:none;max-height:140px;min-height:44px;line-height:1.4;border-radius:22px;padding:11px 16px}
#composer .iconbtn{width:44px;height:44px;border-radius:50%}
.hint{font-size:11.5px;color:var(--muted);padding:0 18px 6px;text-align:center;background:var(--panel)}

/* tasks pane */
.seg{display:flex;gap:6px;padding:4px 18px 12px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;background:var(--sunk);color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--panel)}
.tcard{display:flex;gap:12px;align-items:flex-start;margin:0 14px 8px;padding:12px 14px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:calc(100% - 28px)}
.tcard:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.check{width:24px;height:24px;border-radius:50%;border:2px solid var(--task-deep);flex:none;display:grid;place-items:center;margin-top:1px}
.check.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tcard .tt{font-weight:700}
.tcard.done .tt{text-decoration:line-through;color:var(--muted)}
.tcard .ts{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px}
.chip{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.late{background:color-mix(in srgb,var(--late) 15%,transparent);color:var(--late)}
.chip.soon{background:color-mix(in srgb,var(--task) 25%,transparent);color:var(--task-deep)}
.group-h{padding:14px 18px 8px}

/* settings */
.set{padding:0 14px 30px;display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.card p{margin:0;font-size:13.5px;color:var(--muted)}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .2s;pointer-events:none}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span::after{transform:translateX(20px)}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.status{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--done)}
.status.ok::before{background:var(--ok)}.status.bad::before{background:var(--late)}
.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.providers button{padding:10px;border-radius:12px;border:1.5px solid var(--line);font-weight:700;text-align:left;display:grid;gap:1px}
.providers button small{font-weight:500;color:var(--muted);font-size:11.5px}
.providers button.on{border-color:var(--brand);background:var(--brand-soft)}
.err{font-size:12.5px;color:var(--late);background:color-mix(in srgb,var(--late) 10%,transparent);padding:8px 10px;border-radius:10px}
.steps{margin:0;padding-left:18px;font-size:13.5px;color:var(--muted);display:grid;gap:4px}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;animation:fade .15s}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:12px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center}
.sheet h2{margin:0;font-family:var(--display);font-size:22px;font-weight:800;letter-spacing:-.01em}
.sheet .src{font-size:13px;background:var(--sunk);border-left:3px solid var(--task);padding:8px 10px;border-radius:8px;color:var(--muted);white-space:pre-wrap;max-height:110px;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:grid;place-items:center;padding:20px}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}

/* phone */
@media (max-width:860px){
  #side{width:100%;border-right:0}
  #app.inchat #side{display:none}
  #app:not(.inchat) #main{display:none}
  #back{display:grid}
  .msg .mk{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>

</svg>

<!-- AUTH -->
<div id="auth">

function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h%360}

function dayLabel(d){const x=new Date(d),n=new Date();if(x.toDateString()===n.toDateString())return"Today";const y=new Date(n);y.setDate(n.getDate()-1);if(x.toDateString()===y.toDateString())return"Yesterday";return x.toLocaleDateString([], {weekday:"long",day:"numeric",month:"long"})}

  return {cls: diff<864e5 ? "soon" : "", txt};
}

// ---------- CHATS ----------
async function loadChats(){
  const {data,error}=await sb.from("conversation_members").select("conversation_id,user_id,profiles(id,name,email)");
  if(error) return toast(error.message);
  const map={};
  data.forEach(r=>{ if(r.profiles) profiles[r.user_id]=r.profiles; (map[r.conversation_id]??={id:r.conversation_id,people:[]}).people.push({id:r.user_id,...r.profiles}); });
  const ids=Object.keys(map);
  if(ids.length){
    const {data:last}=await sb.from("messages").select("conversation_id,body,file_name,file_type,created_at,sender_id").in("conversation_id",ids).order("created_at",{ascending:false}).limit(300);
    (last||[]).forEach(m=>{ const c=map[m.conversation_id]; if(c && !c.last) c.last=m; });
  }
  chats=Object.values(map).sort((a,b)=>(b.last?.created_at||"").localeCompare(a.last?.created_at||""));
  renderChats();
}
const chatName = c => c.people.filter(p=>p.id!==me.id).map(p=>p.name||p.email).join(", ") || "Just me";
const otherOf = c => c.people.find(p=>p.id!==me.id) || c.people[0];
const preview = m => !m ? "No messages yet" : (m.sender_id===me.id?"You: ":"") + (m.body || (m.file_type?.startsWith("image/")?"📷 Photo":"📎 "+(m.file_name||"File")));

  const openBy = id => allTasks.filter(t=>t.conversation_id===id && t.status==="open").length;

    const n=openBy(c.id);

      <div class="row-main"><div class="row-top"><span class="row-name">${esc(chatName(c))}</span><span class="row-time">${c.last?fmtShort(c.last.created_at):""}</span></div>
      <div class="row-sub"><span class="row-prev">${esc(preview(c.last))}</span>${n?`<span class="badge" title="Open tasks">${n}</span>`:""}</div></div></button>`;

  sheet(`<h2>New chat</h2><p class="muted" style="margin:0">Enter your teammate's email. They need a WhatsWork account first.</p>

async function openChat(id){

// ---------- MESSAGES ----------
async function fileUrl(path){ if(urlCache[path]) return urlCache[path]; const {data}=await sb.storage.from("attachments").createSignedUrl(path,3600); return urlCache[path]=data?.signedUrl; }
const taskForMsg = id => allTasks.find(t=>t.message_id===id);
function msgHtml(m, prev){
  const mine=m.sender_id===me.id, t=taskForMsg(m.id);
  const first=!prev || prev.sender_id!==m.sender_id || (new Date(m.created_at)-new Date(prev.created_at))>5*60e3;
  let inner="";
  if(t) inner+=`<div class="tag" data-task="${t.id}">${icon("pin")} ${t.status==="done"?"Done":"Task"} · ${esc(t.title)}</div>`;
  if(m.file_path) inner += m.file_type?.startsWith("image/") ? `<img data-path="${esc(m.file_path)}" alt="${esc(m.file_name||"Photo")}">` : `<a class="file" href="#" data-dl="${esc(m.file_path)}">${icon("file")}<span>${esc(m.file_name||"File")}</span></a>`;
  if(m.body) inner+=`<div>${esc(m.body).replace(/\n/g,"<br>")}</div>`;
  return `<div class="msg ${mine?"me":""} ${first?"first":""}" id="m-${m.id}" data-id="${m.id}">${inner}<div class="meta">${fmtTime(m.created_at)}</div><button class="mk" title="Make this a task" aria-label="Make task">${icon("pin")}</button></div>`;
}
function renderMsgs(){
  const box=$("msgs"); let html="", lastDay="";
  msgs.forEach((m,i)=>{ const d=new Date(m.created_at).toDateString(); if(d!==lastDay){html+=`<div class="day">${dayLabel(m.created_at)}</div>`;lastDay=d;} html+=msgHtml(m, i&&new Date(msgs[i-1].created_at).toDateString()===d?msgs[i-1]:null); });
  box.innerHTML = html || `<div class="empty" style="margin:auto"><b>Say hi 👋</b><span>Try: <i>task: design the Friday poster</i></span></div>`;
  hydrate(box); box.scrollTop=box.scrollHeight;
}
function hydrate(root){
  root.querySelectorAll("img[data-path]").forEach(async i=>{ i.src=await fileUrl(i.dataset.path); i.onclick=()=>{ $("viewer").querySelector("img").src=i.src; $("viewer").classList.remove("hidden"); }; i.onload=()=>{ const b=$("msgs"); if(b.scrollHeight-b.scrollTop-b.clientHeight<400) b.scrollTop=b.scrollHeight; }; });
  root.querySelectorAll("a[data-dl]").forEach(a=>a.onclick=async e=>{e.preventDefault(); window.open(await fileUrl(a.dataset.dl),"_blank");});
  root.querySelectorAll("[data-task]").forEach(el=>el.onclick=e=>{e.stopPropagation(); openTask(el.dataset.task);});
  root.querySelectorAll(".msg").forEach(el=>{
    el.querySelector(".mk").onclick=()=>taskFromMsg(el.dataset.id);
    let timer, moved=false;
    el.addEventListener("touchstart",()=>{moved=false;timer=setTimeout(()=>{ if(!moved){ navigator.vibrate?.(15); taskFromMsg(el.dataset.id);} },500)},{passive:true});
    el.addEventListener("touchmove",()=>{moved=true;clearTimeout(timer)},{passive:true});
    el.addEventListener("touchend",()=>clearTimeout(timer),{passive:true});
    el.oncontextmenu=e=>{ if(window.getSelection()?.toString()) return; e.preventDefault(); taskFromMsg(el.dataset.id); };
  });
}
$("viewer").onclick=()=>$("viewer").classList.add("hidden");
function onMsg(m){
  const c=chats.find(x=>x.id===m.conversation_id);
  if(c){ c.last=m; chats.sort((a,b)=>(b.last?.created_at||"").localeCompare(a.last?.created_at||"")); renderChats(); } else loadChats();
  if(!cur || m.conversation_id!==cur.id){ if(m.sender_id!==me.id) toast(`${nameOf(m.sender_id)}: ${m.body?m.body.slice(0,60):"sent a file"}`); return; }
  if(msgs.some(x=>x.id===m.id)) return;
  const prev=msgs[msgs.length-1]; msgs.push(m);
  const box=$("msgs");
  if(msgs.length===1){ renderMsgs(); return; }
  if(new Date(prev.created_at).toDateString()!==new Date(m.created_at).toDateString()) box.insertAdjacentHTML("beforeend",`<div class="day">${dayLabel(m.created_at)}</div>`);
  const w=document.createElement("div"); w.innerHTML=msgHtml(m,prev); hydrate(w); box.appendChild(w.firstElementChild);
  box.scrollTop=box.scrollHeight;
}

const TASK_RE=/^\s*(task:|\/\/)\s*/i;
async function send(){
  const body=$("text").value.trim(); if(!body||!cur) return;
  $("text").value=""; autosize();
  const {data,error}=await sb.from("messages").insert({conversation_id:cur.id,body}).select().single();
  if(error){ $("text").value=body; return toast(error.message); }
  onMsg(data);
  if(TASK_RE.test(body)){
    const text=body.replace(TASK_RE,""), other=otherOf(cur);
    await createTask({title:text.split("\n")[0].slice(0,140), details:text.includes("\n")?text:null, message_id:data.id, assignee_id:other?.id||me.id});
  }
}
$("send").onclick=send;
const autosize=()=>{const t=$("text");t.style.height="auto";t.style.height=Math.min(t.scrollHeight,140)+"px"};
$("text").addEventListener("input",autosize);
$("text").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();send()} });
$("attach").onclick=()=>$("file").click();
$("file").onchange=async()=>{
  const f=$("file").files[0]; $("file").value=""; if(!f||!cur) return;
  if(f.size>45*1024*1024) return toast("That file is over 45 MB. Send a smaller one or a link.");
  toast("Uploading "+f.name+"…");
  const path=`${cur.id}/${crypto.randomUUID()}-${f.name.replace(/[^\w.\-]/g,"_")}`;
  const up=await sb.storage.from("attachments").upload(path,f,{contentType:f.type||"application/octet-stream"});
  if(up.error) return toast(up.error.message);
  const caption=$("text").value.trim(); $("text").value=""; autosize();
  const {data,error}=await sb.from("messages").insert({conversation_id:cur.id,body:caption||null,file_path:path,file_name:f.name,file_type:f.type}).select().single();
  if(error) return toast(error.message); onMsg(data);
};

async function loadTasks(){

  if(error) return toast(error.message);
  allTasks=data||[]; afterTasks();
}
function afterTasks(newId){
  const mineOpen=allTasks.filter(t=>t.status==="open"&&t.assignee_id===me.id).length;
  $("navBadge").textContent=mineOpen; $("navBadge").classList.toggle("hidden",!mineOpen);
  renderChats(); if(cur){ renderOrbit(newId); syncTags(); } if(pane==="Tasks") renderTasks();
}
function syncTags(){
  msgs.forEach(m=>{ const el=$("m-"+m.id); if(!el) return; const t=taskForMsg(m.id), tag=el.querySelector(".tag");
    if(t && !tag){ el.insertAdjacentHTML("afterbegin",`<div class="tag" data-task="${t.id}">${icon("pin")} Task · ${esc(t.title)}</div>`); el.querySelector(".tag").onclick=e=>{e.stopPropagation();openTask(t.id)}; }
    else if(t && tag){ tag.innerHTML=`${icon("pin")} ${t.status==="done"?"Done":"Task"} · ${esc(t.title)}`; }
    else if(!t && tag) tag.remove(); });
}
function renderOrbit(newId){
  if(!cur) return;
  const ts=allTasks.filter(t=>t.conversation_id===cur.id).sort((a,b)=>(a.due_at||"9").localeCompare(b.due_at||"9")||a.created_at.localeCompare(b.created_at));
  const open=ts.filter(t=>t.status==="open"), done=ts.filter(t=>t.status==="done");
  const list=showDone?[...open,...done]:open;
  $("chatSub").textContent = open.length ? `${open.length} open task${open.length>1?"s":""}` : "No open work";
  $("orbit").innerHTML = (list.length ? list.map(t=>{
    const late=t.status==="open"&&t.due_at&&new Date(t.due_at)<new Date();
    const a=t.assignee_id;
    return `<button class="wb ${t.status==="done"?"done":""} ${late?"late":""} ${t.source==="ai"?"ai":""} ${t.id===newId?"new":""}" data-id="${t.id}" title="${esc(t.title)} — for ${esc(nameOf(a))}">
      <span class="who" style="background:${avColor(a)}">${esc(initials(a===me.id?myName:profiles[a]?.name))}</span><span class="t">${esc(t.title)}</span>${t.due_at&&t.status==="open"?`<span class="due">${late?"late":short(t)}</span>`:""}</button>`;
  }).join("") : `<span class="orbit-empty">No open work. Long-press a message or start one with <b>task:</b></span>`)
    + (done.length ? `<button class="orbit-toggle" id="orbitToggle">${showDone?"Hide done":`${done.length} done`}</button>` : "");
  $("orbit").querySelectorAll(".wb").forEach(b=>b.onclick=()=>openTask(b.dataset.id));
  const tg=$("orbitToggle"); if(tg) tg.onclick=()=>{showDone=!showDone;renderOrbit()};
}
function onTaskChange(p){
  if(p.eventType==="DELETE"){ allTasks=allTasks.filter(t=>t.id!==p.old.id); afterTasks(); return; }
  const t=p.new, had=allTasks.some(x=>x.id===t.id);
  allTasks=allTasks.filter(x=>x.id!==t.id); allTasks.unshift(t);
  if(!had && t.assignee_id===me.id && t.created_by!==me.id) toast(`New work from ${nameOf(t.created_by)}: ${t.title}`);
  afterTasks(!had?t.id:null);
}
async function createTask(v){
  const {data,error}=await sb.from("tasks").insert({conversation_id:cur.id,...v}).select().single();
  if(error) return toast(error.message);
  onTaskChange({eventType:"INSERT",new:data}); toast("Work bubble added");
}
function renderTasks(){
  document.querySelectorAll("#taskSeg button").forEach(b=>b.classList.toggle("on",b.dataset.f===taskFilter));
  let list = taskFilter==="mine" ? allTasks.filter(t=>t.status==="open"&&t.assignee_id===me.id)
           : taskFilter==="given" ? allTasks.filter(t=>t.status==="open"&&t.created_by===me.id&&t.assignee_id!==me.id)
           : allTasks.filter(t=>t.status==="done");
  list.sort((a,b)=> taskFilter==="done" ? (b.done_at||"").localeCompare(a.done_at||"") : (a.due_at||"9").localeCompare(b.due_at||"9")||b.created_at.localeCompare(a.created_at));
  const chatOf = id => { const c=chats.find(x=>x.id===id); return c?chatName(c):""; };
  $("taskList").innerHTML = list.length ? list.map(t=>{ const d=dueInfo(t);
    return `<div class="tcard ${t.status==="done"?"done":""}" data-id="${t.id}" role="button" tabindex="0">
      <button class="check ${t.status==="done"?"on":""}" data-check="${t.id}" aria-label="Mark done">${t.status==="done"?icon("task"):""}</button>
      <div style="min-width:0;flex:1"><div class="tt">${esc(t.title)}</div>
      <div class="ts">${d?`<span class="chip ${d.cls}">${esc(d.txt)}</span>`:""}<span>${taskFilter==="given"?"For "+esc(nameOf(t.assignee_id)):"From "+esc(nameOf(t.created_by))}</span><span>· ${esc(chatOf(t.conversation_id))}</span>${t.source==="ai"?'<span class="chip">AI</span>':""}</div></div></div>`;
  }).join("") : `<div class="empty"><b>${taskFilter==="done"?"Nothing finished yet":"All clear"}</b><span>${taskFilter==="mine"?"Work people give you shows up here.":taskFilter==="given"?"Work you hand out shows up here until it's done.":"Finished work is kept here."}</span></div>`;
  $("taskList").querySelectorAll(".tcard").forEach(el=>el.onclick=()=>openTask(el.dataset.id));
  $("taskList").querySelectorAll("[data-check]").forEach(b=>b.onclick=e=>{e.stopPropagation(); toggleDone(allTasks.find(t=>t.id===b.dataset.check));});
}
document.querySelectorAll("#taskSeg button").forEach(b=>b.onclick=()=>{taskFilter=b.dataset.f;renderTasks()});
async function toggleDone(t){
  const done=t.status!=="done";
  const {data,error}=await sb.from("tasks").update({status:done?"done":"open",done_at:done?new Date().toISOString():null}).eq("id",t.id).select().single();
  if(error) return toast(error.message);
  onTaskChange({eventType:"UPDATE",new:data}); toast(done?"Marked done ✅":"Reopened");
}

// ---------- SHEET ----------
function sheet(html){
  $("sheetRoot").innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  $("scrim").onclick=e=>{ if(e.target.id==="scrim") closeSheet(); };
  $("sheetRoot").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
}
const closeSheet=()=>$("sheetRoot").innerHTML="";
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeSheet(); $("viewer").classList.add("hidden"); } });
const toLocal = d => d ? new Date(new Date(d).getTime()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16) : "";
function peopleOptions(sel,convId){ const c=chats.find(x=>x.id===(convId||cur?.id)); const ppl=c?c.people:Object.values(profiles); return ppl.map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.id===me.id?"Me":(p.name||p.email))}</option>`).join(""); }

function taskFromMsg(mid){
  const m=msgs.find(x=>x.id===mid); if(!m) return;
  const ex=taskForMsg(mid); if(ex) return openTask(ex.id);
  const text=(m.body||"").replace(TASK_RE,"");
  sheet(`<h2>Make it a task</h2>
    ${m.body?`<div class="src">${esc(m.body)}</div>`:""}
    <input id="tTitle" class="field" placeholder="What needs doing?" value="${esc((text||m.file_name||"").split("\n")[0].slice(0,140))}">
    <textarea id="tDetails" class="field" rows="2" placeholder="Details (optional)">${esc(text.includes("\n")?text:"")}</textarea>
    <div class="grid2"><label style="display:grid;gap:6px"><span class="label">For</span><select id="tWho" class="field">${peopleOptions((otherOf(cur)||{}).id)}</select></label>
    <label style="display:grid;gap:6px"><span class="label">Due</span><input id="tDue" class="field" type="datetime-local"></label></div>
    <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="tSave">${icon("pin")} Add bubble</button></div>`);
  $("tTitle").focus(); $("tTitle").select();
  $("tSave").onclick=async()=>{ const v=readTaskForm(); if(!v) return; closeSheet(); await createTask({...v,message_id:mid}); };
}
function readTaskForm(){
  const v={title:$("tTitle").value.trim(), details:$("tDetails").value.trim()||null, assignee_id:$("tWho").value, due_at:$("tDue").value?new Date($("tDue").value).toISOString():null};
  if(!v.title){ toast("Give the task a title"); return null; } return v;
}
function calLink(t){
  const s=t.due_at?new Date(new Date(t.due_at).getTime()-30*60e3):new Date(Date.now()+60*60e3), e=new Date(s.getTime()+30*60e3);
  const f=d=>d.toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("WhatsWork: "+t.title)+"&dates="+f(s)+"/"+f(e)+"&details="+encodeURIComponent((t.details||"")+"\n\nFrom "+nameOf(t.created_by)+" in WhatsWork");
}
function openTask(id){
  const t=allTasks.find(x=>x.id===id); if(!t) return toast("Task not found");
  const m=msgs.find(x=>x.id===t.message_id), d=dueInfo(t);
  sheet(`<div class="line"><span class="label">${t.source==="ai"?"Spotted by AI":"Task"} · from ${esc(nameOf(t.created_by))}</span>${d?`<span class="chip ${d.cls}">${esc(d.txt)}</span>`:""}</div>
    <input id="tTitle" class="field" style="font-weight:700;font-size:17px" value="${esc(t.title)}">
    ${m?.body?`<div class="src">${esc(m.body)}</div>`:""}
    <textarea id="tDetails" class="field" rows="2" placeholder="Details (optional)">${esc(t.details||"")}</textarea>
    <div class="grid2"><label style="display:grid;gap:6px"><span class="label">For</span><select id="tWho" class="field">${peopleOptions(t.assignee_id,t.conversation_id)}</select></label>
    <label style="display:grid;gap:6px"><span class="label">Due</span><input id="tDue" class="field" type="datetime-local" value="${toLocal(t.due_at)}"></label></div>
    <button class="btn ${t.status==="done"?"ghost":""}" id="tDone" ${t.status==="done"?"":'style="background:var(--ok);color:#fff"'}>${icon("task")} ${t.status==="done"?"Reopen":"Mark done"}</button>
    <div class="actions">
      <button class="btn soft sm" id="tSave">Save changes</button>
      <a class="btn soft sm" href="${calLink(t)}" target="_blank" rel="noopener" style="text-decoration:none">${icon("cal")} Add to calendar</a>
      ${t.message_id?`<button class="btn soft sm" id="tJump">Go to message</button>`:""}
      <button class="btn danger sm" id="tDel">Delete</button>
    </div>`);
  $("tDone").onclick=()=>{ closeSheet(); toggleDone(t); };
  $("tSave").onclick=async()=>{ const v=readTaskForm(); if(!v) return; if(v.due_at!==t.due_at) v.reminded_at=null;
    const {data,error}=await sb.from("tasks").update(v).eq("id",t.id).select().single(); if(error) return toast(error.message);
    closeSheet(); onTaskChange({eventType:"UPDATE",new:data}); toast("Saved"); };
  $("tDel").onclick=()=>{ const b=$("tDel"); if(b.dataset.armed){ (async()=>{ const {error}=await sb.from("tasks").delete().eq("id",t.id); if(error) return toast(error.message); closeSheet(); onTaskChange({eventType:"DELETE",old:{id:t.id}}); toast("Task deleted"); })(); } else { b.dataset.armed=1; b.textContent="Tap again to delete"; } };
  const j=$("tJump"); if(j) j.onclick=async()=>{ closeSheet(); if(!cur||cur.id!==t.conversation_id||$("chat").classList.contains("hidden")||!$("app").classList.contains("inchat")) await openChat(t.conversation_id);
    const el=$("m-"+t.message_id); if(el){ el.scrollIntoView({behavior:"smooth",block:"center"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } else toast("That message is further back"); };
}

// ---------- SETTINGS ----------
let ai={enabled:false,provider:"gemini",model:"",has_key:false}, aiProvider="gemini";
async function renderSettings(){
  const {data}=await sb.rpc("get_ai_settings");
  ai = (data&&data[0]) || {enabled:false,provider:"gemini",model:"",has_key:false};
  aiProvider=ai.provider||"gemini";
  const pushOk = "serviceWorker" in navigator && "PushManager" in window;
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let subbed=false; try{ if(pushOk){ const reg=await navigator.serviceWorker.getRegistration(); subbed=!!(reg && await reg.pushManager.getSubscription()); } }catch{}
  $("settings").innerHTML = `
  <div class="card">
    <h3>${icon("user")} You</h3>
    <div class="line" style="gap:12px">${avHtml({id:me.id,name:myName})}<div style="flex:1;min-width:0"><input id="sName" class="field" value="${esc(myName)}" maxlength="60"><div class="muted" style="font-size:12.5px;margin-top:4px">${esc(me.email)}</div></div></div>
    <div class="actions"><button class="btn soft sm" id="sNameSave">Save name</button><button class="btn ghost sm" id="sOut">Sign out</button></div>
  </div>

  <div class="card">
    <div class="line"><h3>${icon("bell")} Notifications</h3><span class="status ${subbed&&perm==="granted"?"ok":perm==="denied"?"bad":""}">${subbed&&perm==="granted"?"On":perm==="denied"?"Blocked":"Off"}</span></div>
    <p>Get a lock-screen alert for new messages, new work for you, and 1 hour before a task is due.</p>
    ${!pushOk ? (ios&&!standalone ? `<p class="err">On iPhone, add WhatsWork to your Home Screen first (Share → Add to Home Screen), then open it from there and come back here.</p>` : `<p class="err">This browser can't receive notifications. Try Chrome on Android or the installed app on iPhone.</p>`)
      : perm==="denied" ? `<p class="err">Notifications are blocked for this site. Allow them in your browser or phone settings, then come back.</p>`
      : `<div class="actions">${subbed?`<button class="btn soft sm" id="sTest">Send a test</button><button class="btn ghost sm" id="sPushOff">Turn off on this device</button>`:`<button class="btn" id="sPushOn">${icon("bell")} Turn on notifications</button>`}</div>`}
  </div>

  <div class="card">
    <div class="line"><h3>${icon("spark")} AI work bubbles</h3><label class="switch"><input type="checkbox" id="sAi" ${ai.enabled?"checked":""}><span></span></label></div>
    <p>When on, AI reads new chat messages every 5 minutes and turns work requests into bubbles automatically. Manual bubbles always work, with or without AI.</p>
    <div class="providers" id="sProv">${Object.entries(AI_PROVIDERS).map(([k,v])=>`<button data-k="${k}" class="${k===aiProvider?"on":""}">${v.name}<small>${v.note}</small></button>`).join("")}</div>
    <label style="display:grid;gap:6px"><span class="label">Model</span><input id="sModel" class="field" placeholder="Model name" value="${esc(ai.model||AI_PROVIDERS[aiProvider].model)}"></label>
    <label style="display:grid;gap:6px"><span class="label">API key</span><input id="sKey" class="field" type="password" autocomplete="off" placeholder="${ai.has_key?"Saved ("+esc(ai.key_hint||"")+") · paste a new one to replace":"Paste your API key"}"></label>
    <div class="muted" style="font-size:12.5px" id="sKeyHelp">Get a key: <a href="${AI_PROVIDERS[aiProvider].keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${AI_PROVIDERS[aiProvider].keyUrl.replace("https://","")}</a>. Your key is stored on the server only. The app can never show it again.</div>
    ${ai.last_error?`<div class="err">Last run failed: ${esc(ai.last_error)}</div>`:""}
    ${ai.last_run?`<div class="muted" style="font-size:12.5px">Last checked ${fmtShort(ai.last_run)}${ai.last_error?"":` · found ${ai.last_found||0} task${ai.last_found===1?"":"s"}`}</div>`:""}
    <div class="actions"><button class="btn sm" id="sAiSave">Save AI settings</button>${ai.has_key?`<button class="btn soft sm" id="sScan">Check chats now</button><button class="btn ghost sm" id="sKeyDel">Remove key</button>`:""}</div>
  </div>

  <div class="card">
    <h3>${icon("phone")} Install on your phone</h3>
    <ol class="steps"><li><b>Android (Chrome):</b> menu ⋮ → Install app / Add to Home screen.</li><li><b>iPhone (Safari):</b> Share → Add to Home Screen, then open it from the Home Screen.</li><li><b>Desktop (Chrome/Edge):</b> the install icon in the address bar.</li></ol>
  </div>
  <p class="muted" style="text-align:center;font-size:12px;margin:0">WhatsWork · proof of concept</p>`;

  $("sNameSave").onclick=async()=>{ const n=$("sName").value.trim(); if(!n) return; const {error}=await sb.rpc("set_my_name",{p_name:n}); if(error) return toast(error.message); myName=n; profiles[me.id]={...profiles[me.id],name:n}; toast("Name saved"); };
  $("sOut").onclick=async()=>{ await sb.auth.signOut(); location.reload(); };
  const on=$("sPushOn"); if(on) on.onclick=enablePush;
  const off=$("sPushOff"); if(off) off.onclick=disablePush;
  const tst=$("sTest"); if(tst) tst.onclick=async()=>{ tst.disabled=true; const {data,error}=await sb.functions.invoke(WORKER,{body:{action:"test_push"}}); tst.disabled=false; if(error) return toast("Test failed: "+error.message); toast(data?.sent?"Test sent. Check your notifications.":"No device found. Turn notifications off and on again."); };
  $("sProv").querySelectorAll("button").forEach(b=>b.onclick=()=>{ aiProvider=b.dataset.k; $("sProv").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    const p=AI_PROVIDERS[aiProvider]; $("sModel").value = aiProvider===ai.provider&&ai.model ? ai.model : p.model;
    $("sModel").placeholder = aiProvider==="openai"?"e.g. the model name from your OpenAI dashboard":aiProvider==="openrouter"?"e.g. google/… or anthropic/… from openrouter.ai/models":"Model name";
    $("sKeyHelp").innerHTML=`Get a key: <a href="${p.keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${p.keyUrl.replace("https://","")}</a>. Your key is stored on the server only. The app can never show it again.`;
    if(aiProvider!==ai.provider) $("sKey").placeholder="Paste your "+p.name+" API key"; });
  $("sAiSave").onclick=()=>saveAi();
  const sc=$("sScan"); if(sc) sc.onclick=async()=>{ sc.disabled=true; sc.textContent="Checking…"; const {data,error}=await sb.functions.invoke(WORKER,{body:{action:"scan_now"}}); sc.disabled=false; sc.textContent="Check chats now";
    if(error) return toast("Check failed: "+error.message); if(data?.skipped) return toast("Turn AI on and save first"); if(data?.error) toast("AI error: "+data.error); else toast(data.found?`Found ${data.found} new task${data.found>1?"s":""}`:"No new tasks found"); loadTasks(); renderSettings(); };
  const kd=$("sKeyDel"); if(kd) kd.onclick=()=>saveAi("__clear__");
}
async function saveAi(forceKey){
  const key = forceKey ?? $("sKey").value.trim();
  const model = $("sModel").value.trim();
  const enabled = forceKey==="__clear__" ? false : $("sAi").checked;
  if(enabled && !model) return toast("Add a model name first");
  if(enabled && !key && !(ai.has_key && aiProvider===ai.provider)) return toast("Paste an API key first");
  const {error}=await sb.rpc("save_ai_settings",{p_enabled:enabled,p_provider:aiProvider,p_model:model,p_key:key,p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
  if(error) return toast(error.message);
  toast(forceKey==="__clear__"?"Key removed. AI is off.":enabled?"AI is on. It checks new messages every 5 minutes.":"Saved. AI is off.");
  renderSettings();
}
function b64ToBytes(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); const p=s+"=".repeat((4-s.length%4)%4); return Uint8Array.from(atob(p),c=>c.charCodeAt(0)); }
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted") { toast("Notifications weren't allowed"); return renderSettings(); }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
    const j=sub.toJSON();
    const {error}=await sb.rpc("save_push_sub",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
    if(error) throw error;
    toast("Notifications are on for this device");
  }catch(e){ toast("Couldn't turn on notifications: "+(e.message||e)); }
  renderSettings();
}
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub){ await sb.rpc("delete_push_sub",{p_endpoint:sub.endpoint}); await sub.unsubscribe(); } toast("Notifications off on this device"); }
  catch(e){ toast(e.message||String(e)); }
  renderSettings();
}

// refresh due labels every minute
setInterval(()=>{ if(me){ if(cur) renderOrbit(); if(pane==="Tasks") renderTasks(); } }, 60000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
