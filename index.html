const WIDGET_CODE = `// WhatsWork widget for Scriptable
const KEY = "__KEY__";
const URL_ = "__URL__";
let data;
try {
  const r = new Request(URL_); r.method = "POST";
  r.headers = { "Content-Type": "application/json" };
  r.body = JSON.stringify({ action: "widget", key: KEY });
  data = await r.loadJSON();
} catch (e) { data = { error: "No connection" }; }
const w = new ListWidget();
w.backgroundColor = Color.dynamic(new Color("#f4f5f9"), new Color("#141a2b"));
w.url = "https://ateebhassan.github.io/whatswork/";
const ink = Color.dynamic(new Color("#151a25"), new Color("#e8ecf4"));
const muted = Color.dynamic(new Color("#687186"), new Color("#929bb0"));
const size = config.widgetFamily || "medium";
const title = w.addText(data.error ? "WhatsWork" : (data.now ? "Now: " + data.now.title : "Free time"));
title.font = Font.boldSystemFont(14); title.textColor = ink; title.lineLimit = 1;
if (data.now) { const s = w.addText("until " + data.now.end); s.font = Font.systemFont(11); s.textColor = muted; }
w.addSpacer(6);
if (data.error) { const e = w.addText(data.error); e.textColor = muted; e.font = Font.systemFont(12); }
const max = size === "small" ? 3 : size === "large" ? 9 : 4;
for (const it of (data.next || []).slice(0, max)) {
  const row = w.addStack(); row.centerAlignContent(); row.spacing = 6;
  const dot = row.addStack(); dot.size = new Size(4, 16); dot.backgroundColor = new Color(it.color); dot.cornerRadius = 2;
  const tm = row.addText(it.when); tm.font = Font.semiboldMonospacedSystemFont(11); tm.textColor = muted;
  const tx = row.addText(it.title); tx.font = Font.semiboldSystemFont(12.5); tx.textColor = ink; tx.lineLimit = 1;
  w.addSpacer(3);
}
if (data.posts && data.posts.total && size !== "small") {
  w.addSpacer(4);
  const p = w.addText("📌 Posts today: " + data.posts.done + " of " + data.posts.total + " scheduled");
  p.font = Font.semiboldSystemFont(11); p.textColor = data.posts.done < data.posts.total ? new Color("#b45309") : new Color("#169a62");
}
w.addSpacer();
w.refreshAfterDate = new Date(Date.now() + 15 * 60 * 1000);
if (config.runsInWidget) Script.setWidget(w); else w.presentMedium();
Script.complete();`;

const NOTIFY_ROWS = [
  ["shift","💼","Shift"],["university","🎓","Classes"],["meeting","👥","Meetings, calls"],["other","⏰","Everything else"],
  ["prayer","🕌","Prayer breaks"],["bedtime","🌙","Bedtime"],["briefing_am","☀️","9 am: today's check"],["briefing_pm","🌆","8 pm: tomorrow's check"],["review","📝","Sunday weekly review"],

const LEADS=[5,10,15,20,30,45,60,90,120];
function notifyRowsHtml(){
  return NOTIFY_ROWS.map(([k,ic,label])=>{ const v=notify[k]||{}, timed=v.lead!=null;
    return `<div class="nrow ${v.on?"":"dis"}" data-n="${k}"><span class="ic">${ic}</span><span><b>${label}</b>${timed?`<small>${v.on?v.lead+" min before":"Off"}</small>`:""}</span>
      ${timed?`<select data-lead aria-label="How early">${LEADS.map(m=>`<option value="${m}" ${+v.lead===m?"selected":""}>${m<60?m+" min":m/60+" h"}</option>`).join("")}</select>`:"<span></span>"}
      ${timed?`<button class="snd ${v.sound===false?"off":""}" data-snd aria-label="Sound">${v.sound===false?"🔕":"🔔"}</button>`:"<span></span>"}
      <label class="switch"><input type="checkbox" data-on ${v.on?"checked":""}><span></span></label></div>`; }).join("");

let notifyTimer=0;
function saveNotify(){ clearTimeout(notifyTimer); notifyTimer=setTimeout(async()=>{ const r=await api.setNotify(notify); if(r?.error) toast(r.error.message); else toast("Saved"); },600); }
function wireNotify(){
  const root=$("nPrefs"); if(!root) return;
  root.querySelectorAll("[data-n]").forEach(row=>{ const k=row.dataset.n;
    row.querySelector("[data-on]").onchange=e=>{ notify[k]={...notify[k],on:e.target.checked}; root.innerHTML=notifyRowsHtml(); wireNotify(); saveNotify(); };
    const sel=row.querySelector("[data-lead]"); if(sel) sel.onchange=()=>{ notify[k]={...notify[k],lead:+sel.value}; root.innerHTML=notifyRowsHtml(); wireNotify(); saveNotify(); };
    const snd=row.querySelector("[data-snd]"); if(snd) snd.onclick=()=>{ notify[k]={...notify[k],sound:notify[k].sound===false}; root.innerHTML=notifyRowsHtml(); wireNotify(); saveNotify(); };
  });
}

  $("sheetRoot").querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copy); toast("Copied"); }catch{ toast("Press and hold to copy"); } });
  $("aSave").onclick=async()=>{ notify.alarms={wake:$("aWake").checked, shift:$("aShift").checked, shift_lead:+$("aShiftL").value, meeting:$("aMeet").checked, meeting_lead:+$("aMeetL").value};
    const r=await api.setNotify(notify); if(r?.error) return toast(r.error.message); closeSheet(); toast("Saved"); renderSettings(); };
}

/* ---------- designer portal ---------- */
async function openDesignerPortal(){
  let info=null; try{ const {data}=await api.designerTokenInfo(); info=data&&data[0]; }catch{}
  sheet(`<h2>Designer portal</h2>

    <div id="dpBox">${info?`<div class="small">Link made for <b>${esc(info.designer_name||"your designer")}</b> on ${esc(fmtDay(info.created_at.slice(0,10),{day:"numeric",month:"short"}))}${info.last_used?`, last opened ${esc(relDay(info.last_used.slice(0,10)))}`:", not opened yet"}. Lost it? Make a new one; the old link stops working.</div>`:""}</div>
    <input id="dpName" class="field" placeholder="Designer's name" value="${esc(info?.designer_name||"")}" maxlength="60">

    <button class="btn ghost" data-close>Close</button>`);
  $("dpMake").onclick=async()=>{
    const bytes=new Uint8Array(24); crypto.getRandomValues(bytes);
    const key="wd_"+[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("");
    const {error}=await api.setDesignerToken(await sha256hex(key), $("dpName").value.trim()||null); if(error) return toast(error.message);

    $("dpShare").onclick=async()=>{ try{ await navigator.share({title:"Design board", text:"Here's the design board for the college posts. Upload each finished design on its post:", url:link}); }catch{} };
  };

/* the designs attached to a post: thumbnails, download, add your own */
async function designsHtmlInto(p, el){
  const list=files(p);
  if (!list.length) { el.innerHTML=`<div class="small muted">No design uploaded yet.</div>`; return; }
  el.innerHTML=`<div class="small muted">Loading designs…</div>`;
  let urls={}; try { urls=await api.signFiles(list.map(f=>f.path)); } catch {}
  el.innerHTML=`<div class="dfiles">${list.map(f=>{ const u=urls[f.path]; const media=u&&/^image\//.test(f.mime||"")?`<img src="${esc(u)}" alt="" loading="lazy">`:u&&/^video\//.test(f.mime||"")?`<video src="${esc(u)}#t=0.5" muted playsinline preload="metadata"></video>`:esc((f.name.split(".").pop()||"file").toUpperCase());
    return `<a class="dfile" href="${esc(u||"#")}" target="_blank" rel="noopener" download="${esc(f.name)}" title="${esc(f.name)}">${media}<span class="by">${f.uploaded_by==="me"?"You":"Designer"}</span></a>`; }).join("")}</div>
    ${list.filter(f=>f.note).map(f=>`<div class="small" style="background:var(--sunk);border-radius:10px;padding:7px 10px">💬 ${esc(f.note)}</div>`).join("")}
    <div class="small muted">Tap a design to open it, then Share to save it to Photos.</div>`;
}

/* ---------- SETTINGS ---------- */
let ai={enabled:false,provider:"gemini",model:"",has_key:false}, aiProvider="gemini";
async function renderSettings(){
  const pushOk = "serviceWorker" in navigator && "PushManager" in window;
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let subbed=false; try{ if(pushOk){ const reg=await navigator.serviceWorker.getRegistration(); subbed=!!(reg && await reg.pushManager.getSubscription()); } }catch{}
  try{ const {data}=await api.getAi(); ai=(data&&data[0])||ai; }catch{}
  aiProvider=ai.provider||"gemini";
  const billLabel={paid:"Paid",unpaid:"Unpaid",personal:"Personal"};
  $("settingsBody").innerHTML = `
  <div class="card"><div class="line"><h3><span style="display:flex;gap:8px;align-items:center">${icon("bell")} Notifications</span></h3><span class="status ${subbed&&perm==="granted"?"ok":perm==="denied"?"bad":""}">${subbed&&perm==="granted"?"On":perm==="denied"?"Blocked":"Off"}</span></div>
    <p class="small muted" style="margin:0">Pick what you hear about and how early. 🔔 plays the phone's notification sound, 🔕 arrives quietly.</p>
    <div id="nPrefs">${notifyRowsHtml()}</div>
    <button class="calrow" id="sAlarms"><span style="font-size:19px;width:22px;text-align:center">⏰</span><span class="t"><b>Alarms on your iPhone</b><span class="small muted">${[notify.alarms?.wake&&"wake-up",notify.alarms?.shift&&"before shift",notify.alarms?.meeting&&"before meetings"].filter(Boolean).join(", ")||"Off"} · set by a Shortcut</span></span>${icon("right")}</button>
    ${!pushOk ? (ios&&!standalone ? `<p class="err">On iPhone, add WhatsWork to your Home Screen first (Share, then Add to Home Screen), open it from there and come back here.</p>` : `<p class="err">This browser can't receive notifications.</p>`)
      : perm==="denied" ? `<p class="err">Notifications are blocked for this app. Allow them in your phone's settings, then come back.</p>`
      : `<div class="actions">${subbed?`<button class="btn soft sm" id="sTest">Send a test</button><button class="btn ghost sm" id="sPushOff">Turn off on this device</button>`:`<button class="btn" id="sPushOn">${icon("bell")} Turn on notifications</button>`}</div>`}</div>

  <div class="card"><div class="line"><h3><span style="display:flex;gap:8px;align-items:center">${icon("spark")} AI</span></h3><label class="switch"><input type="checkbox" id="sAi" ${ai.enabled?"checked":""}><span></span></label></div>
    <p class="small muted" style="margin:0">${aiOn?"✅ AI is working. ":""}It understands what you say when you add things, and gives weekly tips. Recommended: Gemini with the model gemini-3.5-flash-lite.</p>
    <div class="providers" id="sProv">${Object.entries(AI_PROVIDERS).map(([k,v])=>`<button data-k="${k}" class="${k===aiProvider?"on":""}">${v.name}<small>${v.note}</small></button>`).join("")}</div>
    <label class="fl"><span class="label">Model</span><input id="sModel" class="field" value="${esc(ai.model||AI_PROVIDERS[aiProvider].model)}"></label>
    <label class="fl"><span class="label">API key</span><input id="sKey" class="field" type="password" autocomplete="off" placeholder="${ai.has_key?"Saved ("+esc(ai.key_hint||"")+"). Paste a new one to replace":"Paste your API key"}"></label>
    <div class="small muted" id="sKeyHelp">Get a key at <a href="${AI_PROVIDERS[aiProvider].keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${AI_PROVIDERS[aiProvider].keyUrl.replace("https://","")}</a>. It's stored on the server and never shown again.</div>
    <div class="actions"><button class="btn sm" id="sAiSave">Save AI settings</button>${ai.has_key?`<button class="btn ghost sm" id="sKeyDel">Remove key</button>`:""}</div></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("spark")} Designer link</span></h3>
    <p class="small muted" style="margin:0">Your designer uploads finished posts here; you see them on each post.</p>
    <button class="calrow" id="sDesigner2"><span class="t"><b>Make or share the designer link</b></span>${icon("right")}</button></div>

  <div class="card"><h3>Colours</h3>${legendHtml()}<p class="small muted" style="margin:0">Everything is one calendar. The colour tells you what kind of thing it is.</p></div>

  <div class="card"><h3>📱 Home Screen widget</h3><p class="small muted" style="margin:0">See your next activities and today's posts on your iPhone Home Screen.</p>
    <button class="calrow" id="sWidget"><span class="t"><b>Set up the widget and voice button</b><span class="small muted">for your Home Screen</span></span>${icon("right")}</button></div>

  <details class="card more-set"><summary><h3 style="margin:0">More settings</h3></summary>
  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("layers")} Calendars</span></h3>
    <div>${cals.map(c=>`<button class="calrow" data-cal="${c.id}"><i class="sw" style="background:${c.color}"></i><span class="t"><b>${esc(c.name)}</b><span class="small muted">${billLabel[c.billing]||""}${c.kind==="planner"?" · college posts":""}${c.follows_world_days?" · posts on world days":""}${c.visible===false?" · hidden":""}</span></span>${icon("right")}</button>`).join("")}</div>
    <button class="btn soft" id="sAddCal">${icon("plus")} Add a calendar</button></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("pin")} College planner</span></h3>
    <p class="small muted" style="margin:0">College posts, world days and birthdays show on your calendar. Tap any post there to tick it or edit it.</p>
    <button class="calrow" id="sBdays">${icon("gift")}<span class="t"><b>Faculty birthdays</b><span class="small muted">${(plannerState?.birthdays||[]).length} names</span></span>${icon("right")}</button>
    <button class="calrow" id="sNotes">${icon("q")}<span class="t"><b>To confirm</b><span class="small muted">${(plannerState?.notes||[]).length} waiting for a date</span></span>${icon("right")}</button>
    <button class="calrow" id="sDesigner">${icon("spark")}<span class="t"><b>Designer portal</b><span class="small muted">A link for your designer to upload finished posts</span></span>${icon("right")}</button>
    <button class="calrow" id="sSheets">${icon("layers")}<span class="t"><b>Printable sheets and backup</b><span class="small muted">Month and six-month PDF or Word sheets, backup</span></span>${icon("right")}</button></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("user")} You</span></h3>
    <input id="sName" class="field" value="${esc(myName)}" maxlength="60">
    <div class="small muted">${esc(me.email||"")}</div>
    <div class="actions"><button class="btn soft sm" id="sNameSave">Save name</button><button class="btn ghost sm" id="sOut">Sign out</button></div></div>

  <div class="card"><h3><span style="display:flex;gap:8px;align-items:center">${icon("phone")} Install on your phone</span></h3>
    <p class="small muted" style="margin:0"><b>iPhone (Safari):</b> Share, then Add to Home Screen, then open it from the Home Screen.<br><b>Android (Chrome):</b> menu, then Install app.</p></div></details>`;
  $("settingsBody").querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>openCalendar(calById(b.dataset.cal)));
  $("sAddCal").onclick=()=>openCalendar(null);
  $("sBdays").onclick=openBirthdays; $("sDesigner").onclick=openDesignerPortal; $("sDesigner2").onclick=openDesignerPortal; $("sWidget").onclick=openWidget; $("sAlarms").onclick=openAlarms; wireNotify(); $("sNotes").onclick=openNotes; $("sSheets").onclick=openPlanner;
  $("sNameSave").onclick=async()=>{ const n=$("sName").value.trim(); if(!n) return; const r=await api.setName(n); if(r.error) return toast(r.error.message); myName=n; toast("Name saved"); };
  $("sOut").onclick=async()=>{ await api.signOut(); location.reload(); };
  const on=$("sPushOn"); if(on) on.onclick=enablePush;
  const off=$("sPushOff"); if(off) off.onclick=disablePush;
  const tst=$("sTest"); if(tst) tst.onclick=async()=>{ tst.disabled=true; const {data,error}=await api.testPush(); tst.disabled=false; if(error) return toast("Test failed: "+error.message); toast(data?.sent?"Test sent. Check your notifications.":"No device found. Turn notifications off and on again."); };
  $("sProv").querySelectorAll("button").forEach(b=>b.onclick=()=>{ aiProvider=b.dataset.k; $("sProv").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    const p=AI_PROVIDERS[aiProvider]; $("sModel").value = aiProvider===ai.provider&&ai.model ? ai.model : p.model;
    $("sKeyHelp").innerHTML=`Get a key at <a href="${p.keyUrl}" target="_blank" rel="noopener" style="color:var(--brand)">${p.keyUrl.replace("https://","")}</a>. It's stored on the server and never shown again.`; });
  $("sAiSave").onclick=()=>saveAi();
  $("sAi").onchange=()=>saveAi();
  const kd=$("sKeyDel"); if(kd) kd.onclick=()=>saveAi("__clear__");
}
async function saveAi(forceKey){
  const key = forceKey ?? $("sKey").value.trim(), model=$("sModel").value.trim();
  const enabled = forceKey==="__clear__" ? false : $("sAi").checked;
  if (enabled && !model) return toast("Add a model name first");
  if (enabled && !key && !(ai.has_key && aiProvider===ai.provider)) return toast("Paste an API key first");
  const {error}=await api.saveAi({p_enabled:enabled,p_provider:aiProvider,p_model:model,p_key:key,p_tz:Intl.DateTimeFormat().resolvedOptions().timeZone});
  if (error) return toast(error.message);
  aiOn = enabled && (!!key || ai.has_key) && forceKey!=="__clear__";
  ai = {...ai, enabled, provider:aiProvider, model, has_key: forceKey==="__clear__" ? false : (!!key || ai.has_key)};
  toast(forceKey==="__clear__"?"Key removed":enabled?"AI is on":"Saved. AI is off."); renderSettings();
}
function b64ToBytes(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); const p=s+"=".repeat((4-s.length%4)%4); return Uint8Array.from(atob(p),c=>c.charCodeAt(0)); }
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){ toast("Notifications weren't allowed"); return renderSettings(); }
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
    const {error}=await api.savePush(sub.toJSON()); if(error) throw error;
    toast("Notifications are on for this device");
  }catch(e){ toast("Couldn't turn on notifications: "+(e.message||e)); }
  renderSettings();
}
async function disablePush(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub){ await api.deletePush(sub.endpoint); await sub.unsubscribe(); } toast("Notifications off on this device"); }
  catch(e){ toast(e.message||String(e)); }
  renderSettings();
}

/* ---------- one database step left ---------- */
function showSetup(){
  ["sToday","sCal","sSettings","sReview"].forEach(id=>$(id).classList.add("hidden")); $("nav").classList.add("hidden"); $("sSetup").classList.remove("hidden");
  $("setup").innerHTML=`<div class="wordmark"><span class="dot"></span>Almost ready</div>
    <p style="margin:0">WhatsWork's new calendar needs one database step: open Supabase, then SQL Editor, then New query. Paste the setup file, press Run, then come back here.</p>
    <button class="btn" onclick="location.reload()">Done, reload</button>
    <button class="btn soft" onclick="openPlanner()">Open the College Planner meanwhile</button>`;
}

/* ---------- planner overlay ---------- */
function openPlanner(){
  const f=$("pvFrame"); if(!f.src) f.src="planner.html";
  $("plannerView").classList.remove("hidden"); history.pushState({planner:1},"");
}
function closePlanner(){ $("plannerView").classList.add("hidden"); if (started) reload(); }
$("pvBack").onclick=()=>{ if(history.state?.planner) history.back(); else closePlanner(); };
window.addEventListener("popstate",()=>{ if(!$("plannerView").classList.contains("hidden")) closePlanner(); });

/* ---------- start ---------- */
function handleLink(url){
  const u=new URL(url, location.href);
  if (u.searchParams.get("planner")) { openPlanner(); return; }
  if (u.searchParams.get("review")) { showTab("review"); return; }
  const d=u.searchParams.get("d"); if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) openDay(d);
}
(async function boot(){
  await api.init();
  api.onAuth(async user=>{
    if (!user) { me=null; started=false; $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); return; }
    if (me && me.id===user.id) return;
    me=user; $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
    let d; try { d=await api.loadAll(); } catch(e){ d={error:e}; }
    if (d.error) { if (d.missing) return showSetup(); toast("Couldn't load: "+(d.error.message||d.error)); me=null; return; }
    await loadHealth();
    applyData(d); started=true; api.subscribe(reloadSoon);
    api.getAi().then(r=>{ const a=r?.data?.[0]; if(a) ai={...ai,...a}; aiOn=!!(a && a.enabled && a.has_key); }).catch(()=>{});
    showTab(tab);
    if (location.search) { handleLink(location.href); history.replaceState(null,"",location.pathname); }
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(()=>{});
    navigator.serviceWorker.addEventListener("message",ev=>{ if(ev.data?.url) handleLink(ev.data.url); });
  }
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && me && started) reloadSoon(); });
  setInterval(()=>{ if(me && started && tab!=="settings" && !$("sheetRoot").innerHTML) render(); }, 60000);
})();
</script>
