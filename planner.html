<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@600;700;800&display=swap">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --teal: #0b8a84; --teal-deep: #076a66; --maroon: #8c1d2f; --maroon-deep: #68121f; --navy: #1d2740; --gold: #f5b82e; --gold-soft: #ffeaae;
  --bg: #f1f3f7; --surface: #ffffff; --surface-2: #f6f7fa; --line: #e1e5ec; --ink: #171b24; --muted: #646d7e; --faint: #aab1bd;
  --on-gold: #2a1e00; --strike: #9aa2b1; --chip-text: 82%; --chip-bg: 12%; --shadow: 0 1px 2px #1d27400f, 0 12px 32px #1d274014;
  --danger: #c62828; --ok: #1f8a4c;
  --ui: "DM Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --display: "Outfit", "Segoe UI Semibold", "Segoe UI", system-ui, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1218; --surface: #181c25; --surface-2: #1f2430; --line: #2c3342; --ink: #eef1f6; --muted: #9aa4b5; --faint: #5e6777;
    --navy: #2b3a63; --gold-soft: #5c4712; --strike: #6b7486; --chip-text: 45%; --chip-bg: 22%; --shadow: 0 1px 2px #0006, 0 12px 32px #0006;
    --danger: #ff7b72; --ok: #5fd38d;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1218; --surface: #181c25; --surface-2: #1f2430; --line: #2c3342; --ink: #eef1f6; --muted: #9aa4b5; --faint: #5e6777;
  --navy: #2b3a63; --gold-soft: #5c4712; --strike: #6b7486; --chip-text: 45%; --chip-bg: 22%; --shadow: 0 1px 2px #0006, 0 12px 32px #0006;
  --danger: #ff7b72; --ok: #5fd38d;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--ui); min-height: 100%; --brand: var(--navy); --brand-text: var(--ink);
  --band: linear-gradient(104deg, var(--teal) 0, var(--teal) 56%, var(--maroon) 56.1%, var(--maroon) 100%); }
body[data-college="superior"] { --brand: var(--teal); --brand-text: color-mix(in srgb, var(--teal) 72%, var(--ink)); --band: linear-gradient(104deg, var(--teal), var(--teal-deep)); }
body[data-college="law"] { --brand: var(--maroon); --brand-text: color-mix(in srgb, var(--maroon) 68%, var(--ink)); --band: linear-gradient(104deg, var(--maroon), var(--maroon-deep)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ----- top bar ----- */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font: 700 18px/1 var(--display); margin-right: 6px; }
.mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(104deg, var(--teal) 0, var(--teal) 52%, var(--maroon) 52.1%); box-shadow: inset 0 -3px 0 var(--gold); flex: none; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { background: transparent; border: 0; padding: 6px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; font-weight: 700; }
#filterSeg button[data-v="superior"][aria-pressed="true"] { background: var(--teal); }
#filterSeg button[data-v="law"][aria-pressed="true"] { background: var(--maroon); }
.nav { display: inline-flex; gap: 4px; align-items: center; }
.btn { background: var(--surface); border: 1px solid var(--line); padding: 7px 12px; border-radius: 9px; font-weight: 500; }
.btn:hover { background: var(--surface-2); border-color: var(--faint); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.btn.primary:hover { filter: brightness(1.1); }
.spacer { flex: 1 1 auto; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.status[data-kind="ok"]::before { background: var(--ok); }
.status[data-kind="busy"]::before { background: var(--gold); }
.status[data-kind="bad"]::before { background: var(--danger); }

/* ----- layout ----- */
.wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; padding: 20px 18px 40px; max-width: 1520px; margin: 0 auto; align-items: start; }
@media (max-width: 1040px) { .wrap { grid-template-columns: 1fr; } }
body.loading .wrap, body.loading .actions { opacity: .55; pointer-events: none; }

/* ----- sheet ----- */
.sheet { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; border: 1px solid var(--line); }
.band { background: var(--band); color: #fff; padding: 18px 24px 16px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; border-bottom: 4px solid var(--gold); }
.band h1 { font: 800 clamp(28px, 4.2vw, 50px)/1 var(--display); margin: 0; letter-spacing: -.015em; }
.band .who { text-align: right; font-size: 13px; line-height: 1.3; }
.band .who b { display: block; font: 700 15px/1.2 var(--display); }
.grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.dow { text-align: center; padding: 8px 2px; font: 600 13px/1 var(--display); color: var(--brand-text); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.dow .s { display: none; }
.cell { min-height: 116px; padding: 6px 6px 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.cell:nth-child(7n) { border-right: 0; }
.cell:hover { background: var(--surface-2); }
.cell.out { background: var(--surface-2); cursor: default; }
.num { font: 600 15px/1 var(--display); align-self: flex-start; min-width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; margin: -1px 0 1px -2px; }
.cell.out .num { color: var(--faint); }
.cell.today .num { background: var(--brand); color: #fff; }
.cell.today { box-shadow: inset 0 0 0 2px var(--brand-text); }
.cell { position: relative; }
.todaytag { position: absolute; top: 7px; right: 7px; font: 700 11px/1 var(--display); color: var(--brand-text); }
/* past days: one line across, like striking a day off a paper planner */
.cell.past { background-image: linear-gradient(to bottom right, transparent calc(50% - 1px), var(--strike) calc(50% - 1px), var(--strike) calc(50% + 1px), transparent calc(50% + 1px)); }
.cell.past .num { color: var(--muted); }
.cell.past .chip, .cell.past .more { opacity: .6; }
.cell.past .chip.is-sched { opacity: .6; }
.pastkey { width: 22px; height: 14px; border: 1px solid var(--line); border-radius: 3px; display: inline-block; background-image: linear-gradient(to bottom right, transparent calc(50% - 1px), var(--strike) calc(50% - 1px), var(--strike) calc(50% + 1px), transparent calc(50% + 1px)); }
.chip { font-size: 11.5px; line-height: 1.25; padding: 2px 6px 3px; border-radius: 6px; overflow-wrap: anywhere; font-weight: 500;
  background: color-mix(in srgb, var(--c) var(--chip-bg), var(--surface)); color: color-mix(in srgb, var(--c) var(--chip-text), var(--ink)); }
.chip.major { background: var(--gold); color: var(--on-gold); font-weight: 700; }
.chip .tent { font-weight: 400; font-style: italic; }
.more { font-size: 11px; color: var(--muted); padding-left: 6px; }
.sheet-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 18px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); }
.sheet-foot b { font: 700 13px/1 var(--display); color: var(--ink); }
.sheet-foot .keys { display: flex; flex-wrap: wrap; gap: 4px 16px; }
.sheet-foot .key { display: inline-flex; align-items: center; gap: 6px; }
.st { display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 2px; border-radius: 8px; background: var(--ok); color: #fff; margin-right: 4px; vertical-align: -3px; }
.st.sched { padding: 0 3px; }
.st.q { background: #d97706; }
.tog.q[aria-pressed="true"] { background: #d97706; border-color: #d97706; }
body[data-view="desk"] .side { display: none; }
body[data-view="desk"] .wrap { grid-template-columns: minmax(0, 1fr); max-width: 1000px; }
body.designer-link #btnAdd, body.designer-link #btnBirthdays, body.designer-link #btnEvents, body.designer-link #btnBackup, body.designer-link #btnDownload { display: none; }
.qrow { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; background: var(--surface); display: grid; gap: 10px; }
.qrow.late { border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.qrow.late .when small { color: var(--danger); font-weight: 700; }
.qhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.qtitle { flex: 1 1 200px; min-width: 0; display: flex; gap: 8px; align-items: flex-start; font-weight: 600; }
.qtitle .swatch { margin-top: 5px; }
.qtitle small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.qtitle .maj { background: var(--gold); color: var(--on-gold); padding: 0 6px; border-radius: 5px; font-weight: 700; }
.qacts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.qrow .files { padding-left: 0; }
.donebox .qrow { opacity: .85; }
.chip.is-sched { opacity: .72; }
.chip .clip { display: inline-flex; align-items: center; gap: 1px; font-size: 10px; font-weight: 700; opacity: .85; white-space: nowrap; }
.cell.alldone .num { box-shadow: inset 0 0 0 2px var(--ok); }
.items li { flex-direction: column; align-items: stretch !important; gap: 8px !important; }
.items .top { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.track { display: flex; flex-wrap: wrap; gap: 6px; padding-left: 20px; }
.tog { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 500; color: var(--muted); }
.tog:hover { border-color: var(--faint); color: var(--ink); }
.tog[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
.pbtn.up { cursor: pointer; border-radius: 999px; }
.files { display: grid; gap: 6px; padding-left: 20px; }
.file { display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.file img, .ftile { width: 46px; height: 46px; border-radius: 7px; object-fit: cover; flex: none; background: var(--line); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.fname { flex: 1 1 auto; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fname small { display: block; color: var(--muted); font-size: 11.5px; }
.sheet-foot .key i { width: 22px; height: 10px; border-radius: 3px; background: var(--gold); display: inline-block; }
@media (max-width: 760px) {
  .cell { min-height: 86px; padding: 4px 3px 6px; } .chip { font-size: 9.5px; padding: 1px 3px 2px; } .dow .l { display: none; } .dow .s { display: inline; }
  .band { padding: 14px 14px 12px; } .band .who { display: none; } .bar { padding: 8px 10px; } .wrap { padding: 12px 10px 30px; }
}

/* ----- dashboard ----- */
.dash { padding: 18px 22px 10px; }
.dtop { padding-bottom: 16px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.ddate { font: 700 19px/1.2 var(--display); }
.dsum { color: var(--muted); margin: 4px 0 12px; }
.dsum b { color: var(--ink); }
.prog { display: flex; height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; }
.p-s { background: var(--ok); } .p-m { background: var(--gold); } .p-t { background: var(--line); } .p-l { background: var(--strike); }
.drow.gone .dtitle > span > span { text-decoration: line-through; color: var(--muted); }
.drow.gone .when b { color: var(--muted); }
.pastbox { border-top: 1px solid var(--line); padding: 12px 0 4px; margin-top: 4px; }
.pastbox summary { cursor: pointer; font: 600 14px/1.3 var(--display); color: var(--muted); padding: 2px 0 8px; }
.pastbox summary:hover { color: var(--ink); }
.pkey { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--muted); margin-top: 7px; }
.pkey span { display: inline-flex; align-items: center; gap: 6px; }
.pkey i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.dgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
@media (max-width: 1180px) { .dgrid { grid-template-columns: 1fr; } }
.dsec { margin-bottom: 24px; }
.dsec h2 { font: 700 16px/1.2 var(--display); margin: 0 0 6px; display: flex; align-items: center; gap: 8px; }
.dsec .count { font: 700 12px/1 var(--ui); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
.dsec .hint { margin: 0 0 6px; }
.drow { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.when { width: 86px; flex: none; }
.when b { display: block; font: 600 13.5px/1.2 var(--display); }
.when small { color: var(--muted); font-size: 12px; }
.dtitle { flex: 1 1 180px; min-width: 0; display: flex; gap: 8px; align-items: flex-start; background: none; border: 0; padding: 2px 0; text-align: left; font-weight: 500; }
.dtitle:hover > span > span { text-decoration: underline; }
.dtitle .swatch { margin-top: 4px; }
.dtitle small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }
.dtitle .maj { background: var(--gold); color: var(--on-gold); padding: 0 6px; border-radius: 5px; font-weight: 700; }
.dacts { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 760px) { .dash { padding: 14px 12px 6px; } .dacts { padding-left: 96px; } }

/* ----- six months ----- */
.six { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px 24px; padding: 20px 22px 8px; }
@media (max-width: 1280px) { .six { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .six { grid-template-columns: 1fr; padding: 14px; } }
.mini h3 { margin: 0 0 6px; font: 700 16px/1.1 var(--display); }
.mini h3 button { background: none; border: 0; font: inherit; padding: 2px 0; color: var(--brand-text); border-bottom: 2px solid transparent; }
.mini h3 button:hover { border-bottom-color: currentColor; }
.mini-head, .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.mini-dow { font: 600 10.5px/1 var(--display); padding: 4px 0; text-align: center; color: var(--muted); }
.mcell { border: 0; background: transparent; height: 34px; display: grid; place-items: center; font: 500 12.5px/1 var(--ui); position: relative; border-radius: 9px; }
.mcell.out { color: var(--faint); cursor: default; }
.mcell.has::after { content: ""; position: absolute; bottom: 4px; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); }
.mcell.major { background: var(--gold); color: var(--on-gold); font-weight: 700; }
.mcell.major::after { display: none; }
.mcell.today { box-shadow: inset 0 0 0 2px var(--brand-text); font-weight: 700; }
.mcell.past { color: var(--muted); background-image: linear-gradient(to bottom right, transparent calc(50% - .75px), var(--strike) calc(50% - .75px), var(--strike) calc(50% + .75px), transparent calc(50% + .75px)); }
.mcell.past.major { opacity: .6; }
.mcell:not(.out):not(.major):hover { background: var(--surface-2); }
.mini ul { list-style: none; margin: 8px 0 0; padding: 8px 0 0; font-size: 12.5px; border-top: 1px solid var(--line); }
.mini li { display: flex; gap: 8px; padding: 1.5px 0; }
.mini li b { min-width: 18px; text-align: right; font-family: var(--display); }
.mini li.note { color: var(--muted); }

/* ----- side ----- */
.side { display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
.card h2 { margin: 0 0 10px; font: 700 15px/1.2 var(--display); }
.card.confirm { border-top: 4px solid var(--gold); }
.confirm ul { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 9px; }
.confirm ul.loose { max-height: 320px; overflow: auto; padding-right: 4px; }
.confirm h2 { display: flex; align-items: center; gap: 8px; }
.confirm .count { font: 700 12px/1 var(--ui); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px; color: var(--muted); }
.confirm li { font-size: 13.5px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.confirm .who { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.confirm .mini-actions { display: flex; gap: 12px; margin-top: 4px; }
.link { background: none; border: 0; padding: 0; color: var(--brand-text); text-decoration: underline; font-size: 12.5px; font-weight: 500; }
.link.danger { color: var(--danger); }
.confirm .add { display: grid; gap: 6px; }
.empty { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }
.legend label { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 13.5px; }
.swatch { width: 12px; height: 12px; border-radius: 4px; background: var(--c); display: inline-block; flex: none; }
.legend p { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
input[type=checkbox], input[type=radio] { accent-color: var(--teal); }

/* ----- forms and dialog ----- */
input[type=text], input[type=date], select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); color: var(--ink); }
input[type=text]:hover, input[type=date]:hover, select:hover { border-color: var(--faint); }
dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 20px)); max-height: calc(100vh - 40px); box-shadow: 0 30px 80px #0008; }
dialog.wide { width: min(780px, calc(100vw - 20px)); }
dialog::backdrop { background: #0b0e1499; }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; }
.dlg-head h2 { margin: 0; font: 700 19px/1.15 var(--display); }
.dlg-body { padding: 16px 18px 18px; }
.pbtn { background: var(--surface); border: 1px solid var(--line); padding: 7px 13px; border-radius: 9px; font-weight: 500; display: inline-flex; align-items: center; }
.pbtn:hover { background: var(--surface-2); border-color: var(--faint); }
.pbtn.dark { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 700; }
.pbtn.dark:hover { filter: brightness(1.1); background: var(--brand); }
.pbtn.small { padding: 4px 10px; font-size: 13px; }
.pbtn.red { color: var(--danger); }
.pbtn[data-armed] { background: var(--danger); border-color: var(--danger); color: #fff; }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field > span, fieldset legend { font-size: 13px; font-weight: 700; }
fieldset { border: 0; padding: 0; margin: 0 0 12px; }
fieldset label, .check { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 520px) { .two { grid-template-columns: 1fr; } }
.row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
.items .t { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.items .t.major span { background: var(--gold); color: var(--on-gold); padding: 1px 7px; border-radius: 6px; }
.items .meta { font-size: 12.5px; color: var(--muted); padding-left: 20px; }
.items .acts { display: flex; gap: 6px; flex: none; }
.list { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; margin-top: 10px; }
.list h3 { margin: 0; padding: 7px 12px; font: 700 13px/1.2 var(--display); background: var(--surface-2); position: sticky; top: 0; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 14px; }
.lrow .grow { flex: 1 1 auto; min-width: 0; }
.lrow .sub { font-size: 12px; color: var(--muted); }

.bar { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 6px 10px; scrollbar-width: none; }

  /* ---------- one day ---------- */
  function openDay(date) {

          (canUpload ? '<label class="pbtn small up">Upload files<input type="file" data-up="' + i + '" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,video/mp4,video/webm,application/pdf"></label>' : '') + '</div>';
        if (files.length) {

  function hydrateThumbs(root) {

  }
  function fileThumbHtml(f) {

      : '<span class="ftile"' + (ON_GOOGLE && /^image\//.test(f.t) ? ' data-thumb="' + esc(f.id) + '"' : '') + '>' + word + '</span>';
  }
  function uploadFiles(fileList, it, done) {
    var files = Array.prototype.slice.call(fileList || []), assets = cloud.assets, n = 0, added = 0, notes = [];
    if (!files.length || !assets) return;
    function finish() {
      if (added) notes.unshift(added + (added === 1 ? ' file uploaded.' : ' files uploaded.'));
      done(); if (notes.length) toast(notes.join(' '));
      if (!cloud.saving && !cloud.dirty) setStatus('Saved online', 'ok');
    }
    function next() {
      if (n >= files.length) { finish(); return; }
      var file = files[n++], ext = (file.name.split('.').pop() || '').toLowerCase(), type = UPLOAD_TYPES[ext];
      if (!type) { notes.push(file.name + ' was skipped: use JPG, PNG, WebP, GIF, MP4, WebM or PDF.'); next(); return; }
      if (file.size > MAX_UPLOAD_MB * 1048576) { notes.push(file.name + ' was skipped: it is ' + fmtSize(file.size) + ' and the limit is ' + MAX_UPLOAD_MB + ' MB for each file.'); next(); return; }
      setStatus('Uploading ' + n + ' of ' + files.length, 'busy');
      assets.upload(file, { type: type }).then(function (r) {
        var list = (getT(it).f || []).slice();

          code === 'quota_or_state' ? 'The storage for uploaded files is full. Remove some old files first.' : code === 'rate_limited' ? 'Too many uploads at once. Wait a moment and try again.' : file.name + ' could not be uploaded. Try again.');

  function itemToForm(it) {

  /* ---------- add or edit an event ---------- */
  function openEventForm(o) {

  /* ---------- all events ---------- */

      Object.keys(CATEGORIES).forEach(function (cat) {
        if (cat === 'birthday') return;
        var rows = defs.filter(function (d) { return d.cat === cat && !d.hidden && match(d); });
        if (!rows.length) return;
        out += '<h3>' + CATEGORIES[cat].name + 's</h3>' + rows.map(rowHtml).join('');
      });
      $('eList').innerHTML = out || '<p class="empty" style="padding:10px">No events match.</p>';
    }
    draw();
    $('eSearch').oninput = draw;
    $('eList').onchange = function (e) {
      var id = e.target.getAttribute('data-show'); if (!id) return;
      if (e.target.checked) delete state.hidden[id]; else state.hidden[id] = true;
      save(); draw();
    };
    $('eList').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var id = b.getAttribute('data-e') || b.getAttribute('data-r');
      var def = allEventDefs(state).filter(function (d) { return d.id === id; })[0];
      if (b.getAttribute('data-r')) {
        if (!armed(b)) return;
        state.custom = state.custom.filter(function (c) { return c.id !== id; }); save(); draw(); return;
      }
      var date;
      if (def.kind === 'custom') {
        var c = state.custom.filter(function (x) { return x.id === id; })[0];
        date = c.repeat ? ymd(view.y, c.m, c.d) : c.date;
      } else {
        var key = id + '@' + view.y;
        date = (!def.weekly && state.moved[key]) || ISLAMIC_OVERRIDES[key] || datesForRule(def.rule, view.y)[0] || ymd(view.y, 1, 1);
      }
      openEventForm({ id: id, kind: def.kind, title: def.title, date: date, days: def.days || 1, cat: def.cat, college: def.college, size: def.size, repeat: def.repeat, weekly: def.weekly, tentative: def.tentative && !state.moved[id + '@' + view.y] });
    };
  }

  /* ---------- download ---------- */
  function saveFile(blob, name) {
    if (hosted) {
      return window.claude.use('downloads').then(function (dl) {
        if (!dl) { toast('Downloads are not available in this view.'); return false; }
        return dl.save({ filename: name, data: blob }).then(function () { return true; }, function (e) {
          if (!e || e.code !== 'declined') toast('The file could not be saved. Try again in a moment.');
          return false;
        });
      });
    }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    return Promise.resolve(true);
  }
  function radio(name, value, label, checked) {
    return '<label><input type="radio" name="' + name + '" value="' + value + '"' + (checked ? ' checked' : '') + '> ' + label + '</label>';
  }
  function openDownload() {
    var monthName = MONTH_NAMES[view.m - 1] + ' ' + view.y;
    var html = '<fieldset><legend>Which planner?</legend>' +
      radio('dCollege', 'both', 'Master planner (both colleges)', prefs.filter === 'both') +
      radio('dCollege', 'superior', 'Superior College only', prefs.filter === 'superior') +
      radio('dCollege', 'law', 'Allama Iqbal Law College only', prefs.filter === 'law') + '</fieldset>' +
      '<fieldset><legend>How much?</legend>' +
      radio('dKind', 'month', 'One month: ' + monthName, view.mode !== 'six') +
      radio('dKind', 'six', 'Six months on one page: ' + sixRangeLabel(view.y, view.m), view.mode === 'six') + '</fieldset>' +
      '<fieldset><legend>File type</legend>' +
      radio('dFormat', 'pdf', 'PDF (best for printing)', true) +
      radio('dFormat', 'docx', 'Word document (you can type in it)', false) + '</fieldset>' +
      '<label class="check"><input type="checkbox" id="dBlank"> Empty boxes: dates only, nothing printed inside</label>' +
      '<p class="hint" style="margin-top:10px">The six-month page leaves out birthdays so the small boxes stay readable. To start from a different month, close this and move to that month first.</p>' +
      '<div class="row-actions"><button class="pbtn dark" id="dGo">Download</button><button class="pbtn" data-close>Cancel</button></div>';
    openDialog('Download planner', html);
    $('dGo').onclick = function () {
      var pick = function (n) { return dlg.querySelector('input[name=' + n + ']:checked').value; };
      var filter = pick('dCollege'), kind = pick('dKind'), format = pick('dFormat');
      var opts = { filter: filter, cats: prefs.cats, blank: $('dBlank').checked };
      var who = filter === 'both' ? 'Master' : COLLEGES[filter].name;
      var name = 'Planner ' + (kind === 'month' ? monthName : sixRangeLabel(view.y, view.m)) + ' - ' + who;
      var blob;
      try {
        if (format === 'pdf') {
          if (!window.jspdf) { toast('The PDF maker did not load. Check the internet and reload the page, or choose Word.'); return; }
          var J = window.jspdf.jsPDF;
          blob = (kind === 'month' ? pdfMonth(J, state, view.y, view.m, opts) : pdfSix(J, state, view.y, view.m, opts)).output('blob');
        } else {
          blob = new Blob([buildDocx(state, kind, view.y, view.m, opts)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        }
      } catch (err) { toast('The file could not be made: ' + err.message); return; }
      saveFile(blob, name + (format === 'pdf' ? '.pdf' : '.docx')).then(function (ok) { if (ok && dlg.open) dlg.close(); });
    };
  }

  /* ---------- backup, restore, updates ---------- */
  function readJsonFile(input, done) {
    var f = input.files && input.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () { var data; try { data = JSON.parse(r.result); } catch (e) { toast('That file could not be read. Choose a file made by this planner.'); return; } done(data); };
    r.readAsText(f);
  }
  function openBackup() {
    var html = '<p class="hint">' + (ON_GOOGLE ? 'Your planner is saved in your WhatsWork account and syncs to all your devices. A backup file is an extra copy you keep yourself.' : hosted ? 'Your planner is saved online. A backup file is an extra copy you keep yourself.' : 'Everything you add is kept inside this browser. Save a backup file now and then so nothing is lost.') + '</p>' +
      '<div class="row-actions" style="margin-top:0"><button class="pbtn dark" id="kSave">Save a backup file</button>' +
      '<label class="pbtn">Restore from a backup file<input type="file" id="kRestore" accept=".json,application/json" hidden></label></div><hr>' +
      '<p class="hint" id="kUsage"></p>' +
      '<p class="hint">An update file is a list of new dates (for example a result date or next year\'s events). You will see each one and choose to add it or skip it.</p>' +
      '<div class="row-actions" style="margin-top:0"><label class="pbtn">Open an update file<input type="file" id="kUpdate" accept=".json,application/json" hidden></label></div>';
    openDialog('Backup and updates', html);
    if (hosted && cloud.assets) {
      cloud.assets.list().then(function (r) {
        var u = r && r.usage; if (!u || !$('kUsage')) return;
        if (ON_GOOGLE) {
          $('kUsage').innerHTML = 'Uploaded posts: ' + u.files + ' stored in WhatsWork, using ' + fmtSize(u.bytes) + (u.maxBytes > 0 ? ' of ' + fmtSize(u.maxBytes) : '') + '. Posts uploaded before the move stay in your Google Drive. ' +
            (r.folderUrl ? '<a href="' + esc(r.folderUrl) + '" target="_blank" rel="noopener">Open the uploads folder</a>' : '');
          return;
        }
        $('kUsage').textContent = 'Uploaded files: ' + u.files + ' stored, using ' + fmtSize(u.bytes) + ' of ' + fmtSize(u.maxBytes) + '. Uploaded files are not inside the backup file.';
      }, function () { });
    }
    $('kSave').onclick = function () {
      gatherTracks().then(function (all) {
        saveFile(new Blob([JSON.stringify({ collegePlannerBackup: 1, saved: todayStr, state: state, track: all }, null, 1)], { type: 'application/json' }), 'College planner backup ' + todayStr + '.json');
      });
    };
    $('kRestore').onchange = function () {
      readJsonFile(this, function (data) {
        if (!data || !data.collegePlannerBackup || !data.state) { toast('This is not a planner backup file.'); return; }
        openDialog('Restore this backup?', '<p>This replaces everything in the planner with the backup from ' + esc(data.saved || 'an earlier date') + '.</p>' +
          '<div class="row-actions"><button class="pbtn dark" id="kYes">Replace everything</button><button class="pbtn" data-close>Cancel</button></div>');
        $('kYes').onclick = function () {
          state = normaliseState(data.state); dlg.close(); save();
          restoreTracks(data.track).then(function () { render(); toast('Backup restored.'); });
        };
      });
    };
    $('kUpdate').onchange = function () {
      readJsonFile(this, function (data) {
        if (!data || !Array.isArray(data.events)) { toast('This is not a planner update file.'); return; }
        openUpdateReview(data.events);
      });
    };
  }
  function gatherTracks() {
    var out = {};
    if (hosted && cloud.db) {
      return cloud.db.collection('track').get().then(function (q) {
        q.docs.forEach(function (d) { try { var j = (d.data() || {}).json; if (typeof j === 'string') out[d.id] = JSON.parse(j); } catch (x) { } });
        Object.keys(tracks).forEach(function (ym) { out[ym] = tracks[ym].map; });
        return out;
      }, function () { Object.keys(tracks).forEach(function (ym) { out[ym] = tracks[ym].map; }); return out; });
    }
    if (storageOk) {
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i), pre = KEY + '.track.';
          if (k && k.indexOf(pre) === 0) out[k.slice(pre.length)] = JSON.parse(localStorage.getItem(k));
        }
      } catch (x) { }
    }
    return Promise.resolve(out);
  }
  function restoreTracks(all) {
    var yms = Object.keys(all && typeof all === 'object' ? all : {}).filter(function (ym) { return /^\d{4}-\d{2}$/.test(ym) && all[ym] && typeof all[ym] === 'object'; });
    Object.keys(tracks).forEach(function (ym) { if (tracks[ym].unsub) tracks[ym].unsub(); });
    tracks = {};
    if (hosted && cloud.db) {
      return yms.reduce(function (p, ym) {
        return p.then(function () { return cloud.db.doc('track/' + ym).set({ v: 1, json: JSON.stringify(all[ym]), updatedAt: Date.now() }); }).then(function () { }, function () { });
      }, Promise.resolve());
    }
    if (storageOk) yms.forEach(function (ym) { try { localStorage.setItem(KEY + '.track.' + ym, JSON.stringify(all[ym])); } catch (x) { } });
    return Promise.resolve();
  }
  function openUpdateReview(events) {
    var list = events.filter(function (e) { return e && e.title && /^\d{4}-\d{2}-\d{2}$/.test(e.date || ''); });
    var done = {};
    function draw() {
      var html = '<p class="hint">' + list.length + ' new dates. Add the ones you want. Skipped ones are simply left out.</p><div class="list" style="max-height:60vh">';
      list.forEach(function (e, i) {
        var col = COLLEGES[e.college] ? e.college : 'both';
        html += '<div class="lrow"><div class="grow">' + esc(e.title) + '<div class="sub">' + esc(longDate(e.date)) + (e.repeat ? ', every year' : '') + '. ' + esc(COLLEGES[col].name) + (e.note ? '. ' + esc(e.note) : '') + '</div></div>' +
          (done[i] ? '<span class="done">' + done[i] + '</span>' : '<button class="pbtn small dark" data-a="' + i + '">Add</button><button class="pbtn small" data-s="' + i + '">Skip</button>') + '</div>';
      });
      html += '</div><div class="row-actions"><button class="pbtn" data-close>Finish</button></div>';
      openDialog('Review new dates', html, true);
      dlg.querySelector('.list').onclick = function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        var a = b.getAttribute('data-a'), s = b.getAttribute('data-s');
        if (s !== null) { done[+s] = 'Skipped'; draw(); return; }
        if (a !== null) {
          var e = list[+a], p = parseYmd(e.date);
          var rec = { id: newId(), title: String(e.title), cat: CATEGORIES[e.category] && e.category !== 'birthday' ? e.category : 'college', college: COLLEGES[e.college] ? e.college : 'both', size: e.size === 'major' ? 'major' : 'minor', repeat: !!e.repeat, date: e.date, m: p.m, d: p.d };
          if (/^\d{4}-\d{2}-\d{2}$/.test(e.end || '') && e.end > e.date) { var q = parseYmd(e.end), n = Math.round((new Date(q.y, q.m - 1, q.d) - new Date(p.y, p.m - 1, p.d)) / 86400000) + 1; if (n > 1 && n <= 60) rec.days = n; }
          state.custom.push(rec);
          done[+a] = 'Added'; save(); draw();
        }
      };
    }
    draw();
  }

  /* ---------- wiring ---------- */
  function shift(n) { var t = addMonths(view.y, view.m, n); view.y = t.y; view.m = t.m; render(); }
  $('prev').onclick = function () { shift(-1); };
  $('next').onclick = function () { shift(1); };
  $('today').onclick = function () { view.y = now.getFullYear(); view.m = now.getMonth() + 1; render(); };
  $('btnAdd').onclick = function () {
    var inView = todayStr.slice(0, 7) === ymKey(view.y, view.m);
    openEventForm({ date: inView ? todayStr : ymd(view.y, view.m, 1), college: prefs.filter });
  };
  $('btnBirthdays').onclick = function () { openBirthdays(); };
  $('btnEvents').onclick = openEvents;
  $('btnBackup').onclick = openBackup;
  $('btnDownload').onclick = openDownload;
  $('sheet').addEventListener('click', function (e) {
    if (e.target.closest('#tickMissed')) { dashMissed.slice().forEach(function (r) { setT(r.it, { m: 1, s: 1 }); }); return; }
    var tg = e.target.closest('[data-dm],[data-ds]');
    if (tg) {
      var made = tg.getAttribute('data-dm'), r = dashRows[+(made !== null ? made : tg.getAttribute('data-ds'))];
      if (r) { var tr = getT(r.it); setT(r.it, made !== null ? (tr.m ? { m: 0, s: 0 } : { m: 1 }) : (tr.s ? { s: 0 } : { m: 1, s: 1 })); }
      return;
    }
    var dq = e.target.closest('[data-dq]');
    if (dq) { var qr = dashRows[+dq.getAttribute('data-dq')]; if (qr) { var qt = getT(qr.it); setT(qr.it, qt.q ? { q: 0 } : { q: 1 }); } return; }
    var qm = e.target.closest('[data-qmade]');
    if (qm) { var mr = deskRows[+qm.getAttribute('data-qmade')]; if (mr) { var mt = getT(mr.it); setT(mr.it, (mt.m || mt.s) ? { m: 0, s: 0 } : { m: 1 }); } return; }
    var qd = e.target.closest('[data-qdl]');
    if (qd) { var a1 = qd.getAttribute('data-qdl').split(':'), r1 = deskRows[+a1[0]]; if (r1) downloadFile((getT(r1.it).f || [])[+a1[1]], qd); return; }
    var qx = e.target.closest('[data-qrm]');
    if (qx) {
      if (!armed(qx)) return;
      var a2 = qx.getAttribute('data-qrm').split(':'), r2 = deskRows[+a2[0]];
      if (r2) { var fl = (getT(r2.it).f || []).slice(), gone = fl.splice(+a2[1], 1)[0]; if (gone && setT(r2.it, { f: fl }) && cloud.assets) cloud.assets['delete'](gone.id).then(function () { }, function () { }); }
      return;
    }
    var dp = e.target.closest('[data-dp]');
    if (dp) { var pr = dashRows[+dp.getAttribute('data-dp')]; if (pr) setT(pr.it, { m: 1, s: 1 }); return; }
    var open = e.target.closest('[data-open]');
    if (open) { var p = open.getAttribute('data-open').split('-'); view.y = +p[0]; view.m = +p[1]; view.mode = 'month'; render(); return; }
    var c = e.target.closest('[data-date]'); if (c) openDay(c.getAttribute('data-date'));
  });
  $('sheet').addEventListener('change', function (e) {
    var i = e.target.getAttribute && e.target.getAttribute('data-qup'); if (i === null || i === undefined) return;
    var r = deskRows[+i]; if (r) uploadFiles(e.target.files, r.it, function () { renderSheet(); });
  });
  $('sheet').addEventListener('toggle', function (e) { if (e.target.classList && e.target.classList.contains('donebox')) deskDoneOpen = e.target.open; else if (e.target.classList && e.target.classList.contains('pastbox')) pastOpen = e.target.open; }, true);
  $('sheet').addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('cell') && e.target.getAttribute('data-date')) { e.preventDefault(); openDay(e.target.getAttribute('data-date')); }
  });

  function refreshToday() {
    var n = new Date(), t = ymd(n.getFullYear(), n.getMonth() + 1, n.getDate());
    now = n;
    if (t !== todayStr) { todayStr = t; render(); }
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshToday(); });
  window.addEventListener('focus', refreshToday);
  setInterval(refreshToday, 60000);

  loadLocal();
  render();
  startCloud();
  try {
    if (/[?&]view=designer\b/.test(location.search)) { view.mode = 'desk'; document.body.classList.add('designer-link'); render(); }
    if (ON_GOOGLE && window.google && google.script && google.script.url && google.script.url.getLocation) {
      google.script.url.getLocation(function (loc) {
        var v = loc && loc.parameter && loc.parameter.view;
        if (v === 'designer') { view.mode = 'desk'; document.body.classList.add('designer-link'); render(); }
      });
    }
  } catch (e) { }
})();
</script>
</body>
</html>
